}
function saveSettings() {
  if (!requireAdmin()) return;
  const v = id => parseInt(document.getElementById(id).value, 10);
  const s1 = v('st-s1'), s2 = v('st-s2'), sh = v('st-sh');
  if (s1 + s2 + sh !== 100) { toast(`האחוזים חייבים להסתכם ב-100 (עכשיו ${s1 + s2 + sh})`); return; }
  Object.assign(S.settings, {
    entryPrice: Math.max(1, v('st-entry')), houseFee: Math.max(0, v('st-fee')),
    savingsFee: Math.max(0, v('st-savings')),
    cashEntryPrice: Math.max(1, v('st-cash-entry')), cashHouseFee: Math.max(0, v('st-cash-fee')),
    cashChips: Math.max(1, v('st-cash-chips')), cashRoundMinutes: Math.max(1, v('st-cash-round')),
    splitFirst: s1, splitSecond: s2, splitHouse: sh,
    maxRebuys: Math.max(0, v('st-cap')),
    levelMinutes: parseInt(document.getElementById('st-lvlmin').value, 10),
    breakAfter: Math.max(0, v('st-brkafter')), breakMinutes: Math.max(1, v('st-brkmin')),
  });
  S.settings.updatedAt = Date.now();
  save(); toast('ההגדרות נשמרו ✔ (יחולו ממשחק חדש)');
}
function settingsExtras() {
  const el = document.getElementById('dealer-code');
  if (!el || !isAdmin() || !SESSION.key) return;
  dealerCodeFor(SESSION.key).then(c => { el.textContent = prettyCode(c); }).catch(() => {});
}
async function copyDealerCode() {
  if (!requireAdmin()) return;
  const code = prettyCode(await dealerCodeFor(SESSION.key));
  try { await navigator.clipboard.writeText(code); toast('הקוד הועתק 📋'); }
  catch (e) { toast(code); }
}
async function shareDealerCode() {
  if (!requireAdmin()) return;
  const code = prettyCode(await dealerCodeFor(SESSION.key));
  const text = `קוד דילר לערב פוקר: ${code}\nנכנסים באפליקציה דרך «דילר» במסך הכניסה.`;
  if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}
function newSeasonDlg() {
  if (!requireAdmin()) return;
  const open = !!seasonStart();
  // a season usually wants to start where the games already are, not today
  const earliest = liveGames().filter(g => g.status === 'done' && !isCash(g)).map(g => g.date).sort()[0];
  const suggested = open ? today() : (earliest || today());
  sheet(`<h3>🏆 ${open ? 'סגירת עונה ופתיחת חדשה' : 'פתיחת עונה'}</h3>
    ${open ? `<label class="field"><span>שם העונה שנסגרת</span><input type="text" id="se-old" value="${esc(seasonName())}"></label>` : ''}
    <label class="field"><span>שם העונה החדשה</span><input type="text" id="se-new" placeholder="לדוגמה: עונה 2026"></label>
    <label class="field"><span>העונה מתחילה בתאריך</span>
      <input type="date" id="se-date" value="${suggested}" oninput="seasonPreview()"></label>
    <div class="card" style="padding:10px 14px;margin-bottom:12px">
      <div class="empty" id="se-preview" style="padding:0;font-size:.8rem;text-align:right">${seasonPreviewText(suggested)}</div>
    </div>
    <div class="empty" style="padding:0 0 12px;font-size:.76rem;text-align:right">${open
      ? 'העונה הנוכחית נסגרת עם האלוף שלה ונשמרת ברשימת האלופים. אפשר להתחיל את החדשה בתאריך אחר — למשל בתחילת החודש.'
      : 'אפשר להתחיל את העונה בעבר כדי שהמשחקים שכבר שיחקתם ייכנסו אליה. טבלת כל הזמנים לא משתנה — פשוט נוספת לה לשונית.'}</div>
    <button class="btn-primary btn-big" onclick="startSeason()">${open ? 'סגירה ופתיחה' : 'פתיחת עונה'}</button>
    <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">ביטול</button>`);
  setTimeout(() => document.getElementById('se-new')?.focus(), 60);
}
function seasonPreviewText(from) {
  if (!from) return 'בחרו תאריך התחלה.';
  const n = gamesFrom(from);
  if (from > today()) return `העונה תתחיל ב-${heDateShort(from)} — עדיין בעתיד, אז היא תתחיל ריקה.`;
  return n
    ? `${n} ${n === 1 ? 'משחק ייכנס' : 'משחקים ייכנסו'} לעונה החדשה (מ-${heDateShort(from)}).`
    : `אף משחק קיים לא ייכנס — העונה תתחיל ריקה מ-${heDateShort(from)}.`;
}
function seasonPreview() {
  const el = document.getElementById('se-preview');
  const d = document.getElementById('se-date');
  if (el && d) el.textContent = seasonPreviewText(d.value);
}
function startSeason() {
  if (!requireAdmin()) return;
  const newName = (document.getElementById('se-new').value || '').trim();
  const oldEl = document.getElementById('se-old');
  const start = (document.getElementById('se-date').value || '').trim() || today();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(start)) { toast('תאריך לא תקין'); return; }
  if (seasonStart()) {
    if (start < seasonStart()) { toast('העונה החדשה לא יכולה להתחיל לפני הקודמת'); return; }
    const rec = closeSeason((oldEl && oldEl.value.trim()) || seasonName(), newName, start);
    closeSheet(); statsMode = 'season'; render();
    toast(rec.championPid ? `אלוף ${rec.name}: ${pname(rec.championPid)} 🏆` : 'העונה נסגרה');
    return;
  }
  S.settings.seasonStart = start;
  S.settings.seasonName = newName || 'עונה חדשה';
  S.settings.updatedAt = Date.now();
  save(); closeSheet(); statsMode = 'season'; render();
  toast(`העונה נפתחה 🏆 · ${gamesFrom(start)} משחקים`);
}
function downloadFile(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click(); URL.revokeObjectURL(a.href);
}
// one row per player per night — the shape a spreadsheet actually wants
function exportCsv() {
  const rows = [['תאריך', 'סוג', 'שחקן', 'כינוי', 'כניסות', 'שולם', 'זכייה', 'מאזן', 'סיום']];
  const games = liveGames().filter(g => g.status === 'done')
    .sort((a, b) => (a.date + a.id).localeCompare(b.date + b.id));
  for (const g of games) {
    const p = payouts(g);
    for (const pid of g.playerIds) {
      const cash = isCash(g);
      const place = cash ? ''
        : g.results.first === pid ? (g.results.chop ? 'צ׳ופ' : '1')
        : g.results.second === pid ? (g.results.chop ? 'צ׳ופ' : '2')
        : g.results.bubble === pid ? 'באבל בוי' : '';
      const win = cash ? (Number((g.results.cashouts || {})[pid]) || 0)
        : ((g.results.first === pid ? p.first : 0) + (g.results.second === pid ? p.second : 0));
      const paid = entriesOf(g, pid) * g.config.entryPrice + (g.config.houseFee || 0) + (cash ? 0 : savingsFeeOf(g.config));
      rows.push([g.date, cash ? 'קאש' : 'טורניר', pname(pid), pnick(pid) || '',
                 entriesOf(g, pid), paid, win, p.nets[pid], place]);
    }
  }
  const csv = '\ufeff' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
  downloadFile(`pokernight-${new Date().toISOString().slice(0, 10)}.csv`, csv, 'text/csv;charset=utf-8');
  toast(`יוצאו ${rows.length - 1} שורות ✔`);
}
function exportBackup() {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pokernight-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('הגיבוי ירד ✔');
}
function importBackup() {
  if (!requireAdmin()) return;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!Array.isArray(data.players) || !Array.isArray(data.games)) throw new Error('bad');
        confirmDlg('השחזור יחליף את כל הנתונים הקיימים. להמשיך?', () => {
          S = data; S.settings = Object.assign({}, DEFAULT_SETTINGS, S.settings || {});
          save(); render(); toast('שוחזר בהצלחה ✔');
        });
      } catch (e) { toast('קובץ גיבוי לא תקין'); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function wipeAll() {
  if (!requireAdmin()) return;
  confirmDlg('למחוק את <b>כל</b> הנתונים לצמיתות?<br>שחקנים, משחקים וסטטיסטיקות — מהמכשיר ומהענן.', () => {
    confirmDlg('בטוחים לגמרי? אין דרך חזרה.', () => {
      S = { players: [], games: [], settings: Object.assign({}, DEFAULT_SETTINGS) };
      save(); go('home'); toast('הכול נמחק');
    });
  });
}

/* ================= sheet / dialogs ================= */
function sheet(html) {
  closeSheet();
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'sheet-ov';
  ov.onclick = e => { if (e.target === ov) closeSheet(); };
  ov.innerHTML = `<div class="sheet-modal">${html}</div>`;
  document.body.appendChild(ov);
}
function closeSheet() { document.getElementById('sheet-ov')?.remove(); }
function confirmDlg(msg, onYes) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.style.alignItems = 'center';
  ov.innerHTML = `<div class="sheet-modal" style="border-radius:20px;max-width:340px;margin:0 16px">
    <div style="margin-bottom:16px;line-height:1.5">${msg}</div>
    <div class="row"><button class="grow" id="cd-no">ביטול</button>
    <button class="grow btn-primary" id="cd-yes">אישור</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#cd-no').onclick = () => ov.remove();
  ov.querySelector('#cd-yes').onclick = () => { ov.remove(); onYes(); };
}

/* ================= boot ================= */
window.addEventListener('load', () => {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('service-worker.js').then(reg => {
    if (!reg) return;
    // a build already sitting in the wings, or one that lands while we watch
    const watch = w => w && w.addEventListener('statechange', () => {
      if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar('יש גרסה חדשה של האפליקציה');
    });
    if (reg.waiting && navigator.serviceWorker.controller) showUpdateBar('יש גרסה חדשה של האפליקציה');
    reg.addEventListener('updatefound', () => watch(reg.installing));
    setInterval(() => reg.update().catch(() => {}), 300000);
  }).catch(() => {});
});
const _g = activeGame();
if (_g) {
  timerCatchUp(_g, true);
  view = 'game';
  try {
    const last = JSON.parse(localStorage.getItem(VIEW_KEY));
    if (last && (last.v === 'clock' || last.v === 'game')) { view = last.v; viewParam = last.param ?? null; }
  } catch (e) {}
}
if (TV_MODE) { view = 'clock'; viewParam = null; document.getElementById('nav').hidden = true; }
render();
if (_g || TV_MODE) startTick();
acquireWake();
if (SESSION) { pullState(); pullPhotoIndex(true); }
</script>
