<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="מנהל ערבי פוקר — כניסות, חישוב פרסים, שעון בליינדים וסיכום לוואטסאפ.">
<meta name="theme-color" content="#0b120e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ערב פוקר">
<title>ערב פוקר 🃏</title>
<style>
  @font-face { font-family: 'Rubik'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/rubik-var-hebrew.woff2) format('woff2'); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: 'Rubik'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/rubik-var-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Frank Ruhl Libre'; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/frank-ruhl-libre-700-hebrew.woff2) format('woff2'); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: 'Frank Ruhl Libre'; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/frank-ruhl-libre-700-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  :root {
    --bg: #0b120e;
    --felt: #12281c;
    --felt-hi: #1a3a28;
    --card: rgba(17, 27, 21, .93);
    --card-hi: rgba(24, 38, 30, .95);
    --line: #24382c;
    --gold: #d4af37;
    --gold-dim: #a8892b;
    --ink: #f2efe6;
    --ink-dim: #9fb0a5;
    --pos: #4caf7d;
    --neg: #e05252;
    --danger: #b03434;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    font-family: "Rubik", "Heebo", "Assistant", "Arial Hebrew", -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    direction: rtl;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  bdi, .num { font-variant-numeric: tabular-nums; }

  #bgimg {
    position: fixed; inset: 0; z-index: -1;
    background: url(bg.jpg) center / cover no-repeat var(--bg);
    transition: background-image .3s ease;
  }
  #bgimg.table { background-image: url(table.jpg); background-position: center top; }
  #bgimg::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(rgba(7, 12, 9, .68), rgba(7, 12, 9, .84));
  }
  #bgimg.table::after {
    background: linear-gradient(rgba(7, 12, 9, .55) 0%, rgba(7, 12, 9, .74) 45%, rgba(7, 12, 9, .88) 100%);
  }

  #app {
    max-width: 560px;
    margin: 0 auto;
    padding: 14px 14px calc(84px + env(safe-area-inset-bottom));
    min-height: 100dvh;
  }
  h1 { font-size: 1.35rem; font-weight: 700; font-family: 'Frank Ruhl Libre', 'Rubik', serif; letter-spacing: .01em; }
  h2 { font-size: .82rem; font-weight: 600; color: var(--gold-dim); margin: 18px 0 8px; letter-spacing: .14em; text-transform: uppercase; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .topbar .sub { color: var(--ink-dim); font-size: .85rem; }

  .card {
    background: linear-gradient(rgba(255, 255, 255, .025), rgba(255, 255, 255, 0) 40%), var(--card);
    border: 1px solid rgba(212, 175, 55, .13);
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .35);
  }
  .card.felt {
    background: linear-gradient(160deg, var(--felt-hi), var(--felt));
    border-color: rgba(212, 175, 55, .3);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .05);
  }

  button {
    font: inherit; color: inherit; background: var(--card-hi);
    border: 1px solid rgba(212, 175, 55, .16); border-radius: 12px;
    padding: 10px 14px; cursor: pointer; touch-action: manipulation;
    transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease;
  }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .4; }
  .btn-primary {
    background: linear-gradient(165deg, #efd77c 0%, #d4af37 45%, #a8892b 100%);
    color: #17130a; font-weight: 700; border: none;
    box-shadow: 0 4px 18px rgba(212, 175, 55, .22), inset 0 1px 0 rgba(255, 255, 255, .35);
    text-shadow: 0 1px 0 rgba(255, 255, 255, .25);
  }
  .btn-big { width: 100%; padding: 16px; font-size: 1.12rem; border-radius: 15px; letter-spacing: .02em; }
  .btn-ghost { background: transparent; }
  .btn-danger { color: #ff9c9c; border-color: rgba(224, 82, 82, .35); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, .2); border-radius: 4px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .grow { flex: 1; }

  /* bottom nav */
  nav {
    position: fixed; bottom: 0; right: 0; left: 0; z-index: 30;
    background: rgba(11, 18, 14, .92); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-around;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  nav button {
    background: none; border: none; color: var(--ink-dim);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: .7rem; padding: 4px 8px; min-width: 58px;
  }
  nav button .ico svg { width: 22px; height: 22px; display: block; }
  nav button.active { color: var(--gold); }
  nav button.active .ico svg { filter: drop-shadow(0 0 7px rgba(212, 175, 55, .65)); }
  .gi svg { width: 18px; height: 18px; vertical-align: -4px; }

  /* player rows in active game */
  .prow {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid rgba(212, 175, 55, .12);
    border-radius: 16px; padding: 10px 12px; margin-bottom: 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
  }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--felt-hi); color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; overflow: hidden; flex-shrink: 0;
    border: 2px solid var(--gold-dim);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .4);
    font-family: 'Frank Ruhl Libre', serif;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.big { width: 84px; height: 84px; font-size: 1.6rem; }
  .prow .name { flex: 1; min-width: 0; }
  .prow .name .nick { font-weight: 600; }
  .prow .name .meta { font-size: .78rem; color: var(--ink-dim); }
  .nickname { color: var(--gold-dim); font-size: .72rem; font-weight: 500; line-height: 1.3; opacity: .9; }
  .prow .name .nick, .lb .who > div:first-child { font-size: 1rem; font-weight: 600; }
  .cnt { font-size: 1.3rem; font-weight: 700; min-width: 34px; text-align: center; }
  .btn-plus, .btn-minus {
    width: 46px; height: 46px; border-radius: 50%; font-size: 1.5rem;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .btn-plus {
    background: radial-gradient(circle at 35% 28%, #f4de85, #d4af37 55%, #967922);
    color: #17130a; font-weight: 700;
    border: 3px dashed rgba(255, 255, 255, .6);
    box-shadow: 0 3px 10px rgba(0, 0, 0, .5), inset 0 0 0 2px rgba(0, 0, 0, .18);
  }
  .btn-minus { background: transparent; color: var(--ink-dim); width: 38px; height: 38px; font-size: 1.2rem; border-color: rgba(212, 175, 55, .18); }
  .capped { font-size: .68rem; color: var(--neg); }

  /* timer strip */
  .strip {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: linear-gradient(160deg, var(--felt-hi), var(--felt));
    border: 1px solid rgba(212, 175, 55, .3); border-radius: 18px;
    padding: 12px 14px; margin-bottom: 12px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .05);
  }
  .strip .lvl, #clock .lvl { letter-spacing: .12em; }
  .strip .t { font-size: 1.7rem; font-weight: 700; }
  .strip .b { font-size: 1.05rem; font-weight: 600; color: var(--gold); }
  .strip .lvl { font-size: .75rem; color: var(--ink-dim); }

  /* fullscreen clock */
  #clock {
    position: fixed; inset: 0; z-index: 50; width: 100vw; height: 100dvh;
    background: linear-gradient(rgba(7, 12, 9, .78), rgba(7, 12, 9, .9)), url(bg.jpg) center / cover no-repeat var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(4px, 1.5vh, 14px); padding: 20px; user-select: none;
  }
  #clock .lvl { color: var(--ink-dim); font-size: max(1rem, 3.4vmin); letter-spacing: .12em; }
  #clock .time { font-size: max(3.5rem, 27vmin); font-weight: 700; line-height: .98; direction: ltr; font-family: 'Frank Ruhl Libre', 'Rubik', serif; }
  #clock .blinds { font-size: max(2rem, 11.5vmin); font-weight: 700; color: var(--gold); direction: ltr; font-family: 'Frank Ruhl Libre', 'Rubik', serif; text-shadow: 0 0 .35em rgba(212, 175, 55, .3); }
  #clock .next { color: var(--ink-dim); font-size: max(.95rem, 3.2vmin); }
  #clock .roster {
    display: flex; flex-wrap: wrap; justify-content: center;
    margin-top: 2vh; max-width: 94vw;
  }
  #clock .roster .pl {
    display: inline-flex; align-items: center;
    background: rgba(0, 0, 0, .34); border: 1px solid rgba(212, 175, 55, .28);
    border-radius: 999px; padding: .34em 1.05em;
    margin: max(5px, 1vmin);
    font-size: max(.95rem, 3.4vmin);
  }
  #clock .roster .pl b { margin-inline-start: .55em; }
  #clock .roster .pl b { color: var(--gold); font-variant-numeric: tabular-nums; font-weight: 700; }
  #clock .roster .pl .out { opacity: .45; }
  #clock .stats {
    display: flex; margin-top: 3.2vh;
    flex-wrap: wrap; justify-content: center; max-width: 96vw;
  }
  #clock .stats > div { text-align: center; margin: .6vh max(18px, 6vmin); }
  #clock .stats .v { font-size: max(1.15rem, 4.6vmin); font-weight: 700; line-height: 1.1; }
  #clock .stats .k { font-size: max(.72rem, 1.9vmin); color: var(--ink-dim); margin-top: .35em; letter-spacing: .04em; }
  #clock.break-mode { background: linear-gradient(rgba(46, 37, 15, .8), rgba(10, 8, 2, .92)), url(bg.jpg) center / cover no-repeat var(--bg); }
  #clock .ctrls {
    position: absolute; bottom: calc(16px + env(safe-area-inset-bottom)); right: 0; left: 0;
    display: flex; justify-content: center; flex-wrap: wrap;
    font-size: max(1rem, 2.1vmin);
    transition: opacity .25s; opacity: 0; pointer-events: none;
  }
  #clock.show-ctrls .ctrls { opacity: 1; pointer-events: auto; }
  #clock .ctrls > button { margin: max(5px, .7vmin); }
  #clock .exit { position: absolute; top: calc(14px + env(safe-area-inset-top)); inset-inline-start: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #clock.show-ctrls .exit { opacity: 1; pointer-events: auto; }
  #clock .paused-tag { color: var(--neg); font-weight: 700; letter-spacing: .1em; }
  @keyframes pulse { 0% { opacity: .85; } 100% { opacity: 0; } }
  #clock .flash { position: absolute; inset: 0; background: var(--gold); opacity: 0; pointer-events: none; }
  #clock .flash.on { animation: pulse 1.1s ease-out; }

  /* stats / tables */
  .lb { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-bottom: 1px solid var(--line); }
  .lb:last-child { border-bottom: none; }
  .lb .rank { width: 26px; text-align: center; color: var(--ink-dim); font-weight: 700; }
  .lb .who { flex: 1; min-width: 0; }
  .lb .who .meta { font-size: .74rem; color: var(--ink-dim); }
  .money-pos { color: var(--pos); font-weight: 700; }
  .money-neg { color: var(--neg); font-weight: 700; }
  .money-zero { color: var(--ink-dim); font-weight: 700; }

  table.sheet { width: 100%; border-collapse: collapse; font-size: .92rem; }
  table.sheet th { color: var(--ink-dim); font-weight: 500; font-size: .76rem; text-align: right; padding: 6px 4px; }
  table.sheet td { padding: 8px 4px; border-top: 1px solid var(--line); }
  table.sheet td:last-child, table.sheet th:last-child { text-align: left; }

  /* forms */
  input[type=text], input[type=number], input[type=date], input[type=time], input[type=password], select {
    font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
    border: 1px solid rgba(212, 175, 55, .18); border-radius: 12px;
    padding: 10px 12px; width: 100%;
    -webkit-appearance: none; appearance: none;
  }
  input:focus, select:focus { outline: none; border-color: var(--gold-dim); box-shadow: 0 0 0 3px rgba(212, 175, 55, .14); }
  label.field { display: block; margin-bottom: 10px; font-size: .85rem; color: var(--ink-dim); }
  label.field span { display: block; margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid rgba(212, 175, 55, .18); border-radius: 999px; padding: 8px 14px;
    background: var(--card); cursor: pointer; display: flex; align-items: center; gap: 8px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .chip.on { border-color: var(--gold); color: var(--gold); background: rgba(212, 175, 55, .08); box-shadow: 0 0 12px rgba(212, 175, 55, .18); }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper button { width: 38px; height: 38px; border-radius: 50%; padding: 0; font-size: 1.2rem; }

  /* overlays */
  .overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .6);
    display: flex; align-items: flex-end; justify-content: center;
  }
  @keyframes sheetUp { from { transform: translateY(26px); opacity: .5; } to { transform: none; opacity: 1; } }
  .sheet-modal {
    background: var(--card); border: 1px solid rgba(212, 175, 55, .2); border-bottom: none;
    animation: sheetUp .22s ease;
    box-shadow: 0 -12px 40px rgba(0, 0, 0, .5);
    border-radius: 22px 22px 0 0; width: 100%; max-width: 560px;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height: 88dvh; overflow-y: auto;
  }
  .sheet-modal::before { content: ''; display: block; width: 38px; height: 4px; border-radius: 2px; background: rgba(212, 175, 55, .35); margin: 0 auto 12px; }
  .sheet-modal h3 { margin-bottom: 12px; font-family: 'Frank Ruhl Libre', serif; }

  #toast {
    position: fixed; bottom: calc(96px + env(safe-area-inset-bottom)); right: 50%;
    transform: translateX(50%); z-index: 70;
    background: var(--card-hi); border: 1px solid rgba(212, 175, 55, .3);
    padding: 10px 18px; border-radius: 999px; font-size: .88rem;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .5);
    transition: opacity .3s; opacity: 0; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  .pool-bar {
    position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 20;
    background: linear-gradient(160deg, var(--felt-hi), var(--felt));
    border: 1px solid var(--gold-dim); border-radius: 16px;
    padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .55), 0 0 22px rgba(212, 175, 55, .12);
  }
  .live-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #e05252; animation: livePulse 1.6s infinite; margin-inline-end: 2px; }
  @keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(224, 82, 82, .45); } 70% { box-shadow: 0 0 0 8px rgba(224, 82, 82, 0); } 100% { box-shadow: 0 0 0 0 rgba(224, 82, 82, 0); } }
  .empty-lg::before { content: '\2660'; display: block; font-size: 1.7rem; color: var(--gold-dim); opacity: .55; margin-bottom: 4px; }
  .avatar.huge { width: 112px; height: 112px; font-size: 2.4rem; border-width: 3px; }
  .balloon { display: inline-block; font-size: 1.7rem; animation: floaty 2.6s ease-in-out infinite; }
  .balloon.b2 { animation-delay: 1.3s; }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  /* edges are faded to true black inside the file itself, so `screen` leaves
     no rectangle on any browser (iOS Safari ignored the CSS mask) */
  .neon-hero {
    display: block; width: 100%; max-width: 335px; margin: -10px auto 2px;
    mix-blend-mode: screen;
    filter: saturate(1.08) contrast(1.04);
    pointer-events: none;
  }
  .refresh-btn {
    width: 34px; height: 34px; border-radius: 50%; padding: 0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 1px solid rgba(212, 175, 55, .25); color: var(--gold-dim);
  }
  .refresh-btn svg { width: 17px; height: 17px; }
  .refresh-btn.spin svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(-360deg); } }
  #clock .refresh-btn { background: rgba(0, 0, 0, .3); }
  .topbar { gap: 10px; }
  .avatar-wrap { position: relative; display: inline-flex; flex-shrink: 0; }
  .crown {
    position: absolute; top: -11px; left: 50%; z-index: 2;
    transform: translateX(-50%) rotate(-14deg); font-size: .95rem; line-height: 1;
    filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .7));
  }
  .avatar-wrap.big .crown { font-size: 1.45rem; top: -15px; }
  .avatar-wrap.huge .crown { font-size: 1.95rem; top: -20px; }
  .mvp-badge {
    font-size: .58rem; font-weight: 700; letter-spacing: .07em; color: #17130a;
    background: linear-gradient(160deg, #efd77c, #d4af37); border-radius: 999px;
    padding: 1px 6px; vertical-align: 2px; white-space: nowrap;
  }
  .break-col { display: flex; flex-direction: column; gap: 6px; }
  .break-btn {
    width: 58px; height: 100%; min-height: 30px; padding: 3px 0; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font-size: 1rem; line-height: 1; background: var(--card-hi);
  }
  .break-btn b { font-size: .62rem; font-weight: 600; color: var(--ink-dim); }
  .break-btn.resume { background: linear-gradient(165deg, #efd77c, #d4af37 45%, #a8892b); color: #17130a; border: none; }
  .break-btn.resume b { color: #17130a; }
  .guest-tag {
    font-size: .6rem; color: var(--gold-dim); border: 1px solid rgba(212,175,55,.35);
    border-radius: 999px; padding: 1px 6px; vertical-align: 2px;
  }
  .wall-item { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .wall-item:last-child { border-bottom: none; }
  .wall-item .who { font-size: .78rem; color: var(--gold-dim); font-weight: 600; }
  .wall-item .txt { font-size: .92rem; margin-top: 2px; word-break: break-word; }
  .wall-item .when { font-size: .68rem; color: var(--ink-dim); }
  .wall-del { float: left; background: none; border: none; color: var(--ink-dim); padding: 0 4px; font-size: .9rem; }
  .hist-row { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
  .hist-row:last-child { border-bottom: none; }
  .bubble-card { text-align: center; }
  .bubble-card .who { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .pool-bar .amounts { font-size: .78rem; color: var(--ink-dim); }
  .pool-bar .pool { font-size: 1.25rem; font-weight: 700; color: var(--gold); }
  .empty { text-align: center; color: var(--ink-dim); padding: 30px 10px; font-size: .9rem; }
  .winner-pick .prow { cursor: pointer; }
  .winner-pick .prow:active { border-color: var(--gold); }
  a { color: var(--gold); }

  /* ---- build / staleness banner ---- */
  #update-bar {
    position: fixed; top: 0; right: 0; left: 0; z-index: 90;
    background: linear-gradient(165deg, #efd77c, #d4af37 55%, #a8892b);
    color: #17130a; font-weight: 700; font-size: .88rem;
    padding: calc(9px + env(safe-area-inset-top)) 14px 9px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, .5);
  }
  #update-bar button {
    background: rgba(0, 0, 0, .82); color: #f6e9b8; border: none;

  .spark .dot { fill: var(--gold); }
  .kpis { display: flex; flex-wrap: wrap; }

  .kpis .v { font-size: 1.12rem; font-weight: 700; }
  .kpis .k { font-size: .68rem; color: var(--ink-dim); margin-top: 2px; }
  .streak-tag {
    display: inline-block; border-radius: 999px; padding: 3px 11px; font-size: .74rem;

  }
  .streak-tag.cold { color: var(--ink-dim); border-color: var(--line); }

  /* ---- season tabs ---- */
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs .tab {
    flex: 1; text-align: center; padding: 9px 6px; border-radius: 12px; cursor: pointer;
    background: var(--card); border: 1px solid rgba(212, 175, 55, .14);

  }
  .tabs .tab.on { color: var(--gold); border-color: var(--gold-dim); background: rgba(212, 175, 55, .09); }

  /* ---- bigger touch targets ---- */
  .btn-plus { width: 54px; height: 54px; font-size: 1.7rem; }
  .btn-minus { width: 44px; height: 44px; font-size: 1.3rem; }
  nav button { min-height: 50px; justify-content: center; }
  .prow { padding: 12px; }
  .chip { min-height: 42px; }
  .stepper button { width: 44px; height: 44px; }

  /* ---- avatar tint for players with no photo ---- */
  .avatar.tint { background: var(--tint, var(--felt-hi)); }
  .no-photo::after {
    content: '📷'; position: absolute; bottom: -2px; inset-inline-start: -2px;
    background: var(--card-hi); border: 1px solid var(--gold-dim); border-radius: 50%;
    width: 19px; height: 19px; font-size: .6rem; line-height: 17px; text-align: center;
  }

  /* ---- home hero cards ---- */
  .hero-card { text-align: center; }
  .hero-card .who { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .hero-card .title { font-weight: 700; font-size: 1.2rem; margin-top: 8px; font-family: 'Frank Ruhl Libre', serif; }
  .hero-card .sub2 { color: var(--ink-dim); font-size: .8rem; margin-top: 2px; }

  /* ---- TV clock extras ---- */
  #clock .upnext {
    display: flex; flex-wrap: wrap; justify-content: center;
    margin-top: 1.2vh; font-size: max(.8rem, 2.4vmin); color: var(--ink-dim);
  }
  #clock .upnext span { margin: .3vh max(8px, 2.4vmin); }
  #clock .upnext b { color: var(--gold-dim); font-weight: 700; }
  #clock .panel {
    margin-top: 2.4vh; min-height: max(2.6rem, 7vmin);
    display: flex; align-items: center; justify-content: center;
    text-align: center; max-width: 92vw;
    font-size: max(1rem, 3.2vmin); color: var(--ink);
    transition: opacity .45s ease; opacity: 1;
  }
  #clock .panel.fade { opacity: 0; }
  #clock .panel b { color: var(--gold); }
  #clock.tv .exit { display: none; }

  /* ---- photo of the night ---- */
  .night-photo {
    display: block; width: 100%; max-height: 320px; object-fit: cover;
    border-radius: 14px; background: var(--felt);
  }
  .night-photo-wrap { position: relative; margin-bottom: 12px; }
  .night-photo-wrap .tools {
    position: absolute; bottom: 8px; inset-inline-start: 8px;
    display: flex; gap: 6px;
  }
  .night-photo-wrap .tools button {
    background: rgba(0, 0, 0, .62); border: 1px solid rgba(212, 175, 55, .3);
    color: var(--ink); font-size: .74rem; padding: 5px 11px; border-radius: 999px;
    backdrop-filter: blur(6px);
  }
  .photo-thumb {
    width: 54px; height: 54px; border-radius: 12px; object-fit: cover;

<body>
<div id="bgimg"></div>
<div id="app"></div>
<div id="clock-root"></div>
<nav id="nav"></nav>
<div id="toast"></div>

<script>
'use strict';

/* ================= state ================= */
const LS_KEY = 'pokernight_v1';
// bumped on every deploy; a device holding an older build is told to refresh
const APP_BUILD = 37;
const CHIPS_PER_ENTRY = 1500;
const LADDER = [
  [10, 20], [20, 40], [30, 60], [40, 80],
  [50, 100], [75, 150], [100, 200], [150, 300], [200, 400],
  [300, 600], [400, 800], [500, 1000], [750, 1500], [1000, 2000],
  [1500, 3000], [2000, 4000], [3000, 6000], [4000, 8000], [5000, 10000],
];
const DEFAULT_SETTINGS = {
  entryPrice: 30, houseFee: 10, savingsFee: 20,
  splitFirst: 65, splitSecond: 25, splitHouse: 10,
  maxRebuys: 12,
  levelMinutes: 15, breakAfter: 0, breakMinutes: 10,
  cashEntryPrice: 20, cashHouseFee: 10, cashChips: 1000, cashRoundMinutes: 15,
  sound: true, voice: true, haptics: true,
  seasonStart: null, seasonName: '',
};

let S = loadState();
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      s.settings = Object.assign({}, DEFAULT_SETTINGS, s.settings || {});
      s.players = s.players || [];
      s.games = s.games || [];
      s.seasons = s.seasons || [];
      dropScheduledBreak(s);
      clampTimers(s);
      return s;
    }
  } catch (e) { console.error(e); }
  return { players: [], games: [], seasons: [], settings: Object.assign({}, DEFAULT_SETTINGS) };
}
function saveLocal() { mvpDirty = true; localStorage.setItem(LS_KEY, JSON.stringify(S)); }
function save() { saveLocal(); schedulePush(); }
// stamp what changed so a merge can tell newer from older
function touchGame(g) {
  if (!g) return;
  g.updatedAt = Date.now();
  // who last touched this game, so a table full of phones can tell whose
  // count is on screen
  if (SESSION) g.updatedBy = isAdmin() ? (SESSION.name || 'מנהל') : (SESSION.name || '');
}
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)); }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

/* ---- TV mode: ?tv=1 boots straight into a read-only clock for a big screen,
   with no login, no nav and no controls ---- */
const TV_MODE = /(^|[?&])tv=1(&|$)/.test(location.search);

/* ================= auth ================= */
const ADMIN_USER = 'pitboss';
const ADMIN_HASH = '4a25821c2a1389c33ea72d492e616f0c2fcc56e274ca2070b0964494eadb547f';
const SESSION_KEY = 'pokernight_session';
let SESSION = null;
try { SESSION = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) {}
// a wall screen never signs in; it just watches
if (TV_MODE) SESSION = { role: 'user', name: 'מסך', tv: true, ts: Date.now() };
const isAdmin = () => !!SESSION && SESSION.role === 'admin';
// a dealer runs the table — entries, late joins and the clock — but cannot
// finish, delete or edit a game, and the server enforces that too
const isDealer = () => !!SESSION && SESSION.role === 'dealer';
const canDeal = () => isAdmin() || isDealer();
const syncKey = () => (SESSION && SESSION.key) || '';
function requireAdmin() {
  if (isAdmin()) return true;
  toast(isDealer() ? 'רק המנהל יכול לעשות את זה 🔒' : 'פעולה למנהל בלבד 🔒');
  return false;
}
function requireDeal() {
  if (canDeal()) return true;
  toast('פעולה למנהל בלבד 🔒');
  return false;
}
async function sha256hex(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
/* ---- dealer code ----
   Derived from the admin password on the admin's own device, so a dealer can
   be handed a code without ever learning the master password. The server
   derives the same value from its env var and accepts it for a narrow set of
   writes only. ---- */
const DEALER_CODE_LEN = 12;
const normalizeCode = c => String(c || '').replace(/[^0-9a-fA-F]/g, '').toLowerCase().slice(0, DEALER_CODE_LEN);
const prettyCode = c => (normalizeCode(c).toUpperCase().match(/.{1,4}/g) || []).join('-');
async function dealerCodeFor(pass) {
  return (await sha256hex('pn-dealer|' + pass)).slice(0, DEALER_CODE_LEN);
}
let loginMode = 'user';
function renderLogin() {
  document.getElementById('nav').hidden = true;
  setTimeout(injectRefresh, 0);
  document.getElementById('app').innerHTML = `
    <div style="min-height:88dvh;display:flex;flex-direction:column;justify-content:center">
      <div style="text-align:center;margin-bottom:26px">
        <img src="icon-192.png" alt="" style="width:84px;height:84px;border-radius:20px">
        <h1 style="margin-top:12px;font-size:1.9rem;background:linear-gradient(160deg,#e8cd6a,#a8892b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">ערב פוקר</h1>
      </div>
      <div class="card felt">
        <div class="chips" style="justify-content:center;margin-bottom:16px">
          <div class="chip ${loginMode === 'user' ? 'on' : ''}" onclick="loginMode='user';renderLogin()"><span class="gi">${ICONS.user}</span> שחקן</div>
          <div class="chip ${loginMode === 'dealer' ? 'on' : ''}" onclick="loginMode='dealer';renderLogin()">🃏 דילר</div>
          <div class="chip ${loginMode === 'admin' ? 'on' : ''}" onclick="loginMode='admin';renderLogin()"><span class="gi">${ICONS.key}</span> מנהל</div>
        </div>
        ${loginMode === 'user' ? `
          <label class="field"><span>איך קוראים לך?</span><input type="text" id="lg-name" autocomplete="off"></label>
          <button class="btn-primary btn-big" onclick="userLogin()">כניסה</button>
          <div class="login-actions row" style="justify-content:center;margin-top:12px"></div>
        ` : loginMode === 'dealer' ? `
          <label class="field"><span>איך קוראים לך?</span><input type="text" id="lg-dname" autocomplete="off"></label>
          <label class="field"><span>קוד דילר</span><input type="text" id="lg-code" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX" style="direction:ltr;text-align:center;letter-spacing:.12em"></label>
          <button class="btn-primary btn-big" id="lg-dbtn" onclick="dealerLogin()">כניסת דילר</button>
          <div class="empty" style="padding:12px 0 0;font-size:.76rem">דילר יכול להוסיף כניסות, לצרף שחקנים ולהפעיל את השעון — אבל לא לסיים, למחוק או לערוך משחק. את הקוד מקבלים מהמנהל (הגדרות ← קוד דילר).</div>
          <div class="login-actions row" style="justify-content:center;margin-top:12px"></div>
        ` : `
          <label class="field"><span>שם משתמש</span><input type="text" id="lg-user" autocomplete="off" autocapitalize="off"></label>
          <label class="field"><span>סיסמה</span><input type="password" id="lg-pass"></label>
          <button class="btn-primary btn-big" onclick="adminLogin()">כניסת מנהל</button>
          <div class="login-actions row" style="justify-content:center;margin-top:12px"></div>
        `}
      </div>
    </div>`;
  setTimeout(() => document.getElementById(loginMode === 'user' ? 'lg-name' : loginMode === 'dealer' ? 'lg-dname' : 'lg-user')?.focus(), 60);
}
function setSession(sess) {
  SESSION = sess;
  localStorage.setItem(SESSION_KEY, JSON.stringify(sess));
}
function userLogin() {
  const name = document.getElementById('lg-name').value.trim();
  if (!name) { toast('צריך שם 🙂'); return; }
  setSession({ role: 'user', name, ts: Date.now() });
  playLoginChime();
  render();
  pullState(true);
}
async function dealerLogin() {
  const name = document.getElementById('lg-dname').value.trim();
  const code = normalizeCode(document.getElementById('lg-code').value);
  if (!name) { toast('צריך שם 🙂'); return; }
  if (code.length !== DEALER_CODE_LEN) { toast('הקוד לא שלם'); return; }
  const btn = document.getElementById('lg-dbtn');
  if (btn) { btn.disabled = true; btn.textContent = 'בודק…'; }
  let role = null;
  try {
    const r = await fetch(API, {
      method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-key': code },
      body: JSON.stringify({ verify: true }),
    });
    if (r.ok) role = (await r.json()).role || null;
  } catch (e) { toast('אין חיבור לרשת'); }
  if (role !== 'dealer') {
    if (btn) { btn.disabled = false; btn.textContent = 'כניסת דילר'; }
    if (role === null) toast('קוד דילר שגוי');
    return;
  }
  setSession({ role: 'dealer', name, key: code, ts: Date.now() });
  playLoginChime();
  toast(`ברוך הבא, ${name} 🃏`);
  render();
  pullState(true);
}
async function adminLogin() {
  const u = document.getElementById('lg-user').value.trim();
  const p = document.getElementById('lg-pass').value;
  if (u === ADMIN_USER && await sha256hex(`pn|${u}|${p}`) === ADMIN_HASH) {
    setSession({ role: 'admin', name: 'מנהל', key: p, ts: Date.now() });
    playLoginChime();
    toast('ברוך הבא, מנהל 🔑');
    render();
    pullState();
  } else {
    toast('שם משתמש או סיסמה שגויים');
    const el = document.getElementById('lg-pass'); if (el) el.value = '';
  }
}
function logout() {
  localStorage.removeItem(SESSION_KEY);
  SESSION = null;
  render();
}

/* ================= wall comments ================= */
const COMMENTS_API = '/api/comments';
let COMMENTS = {};
try { COMMENTS = JSON.parse(localStorage.getItem('pokernight_comments')) || {}; } catch (e) {}
async function pullComments(rerender) {
  try {
    const r = await fetch(COMMENTS_API, { cache: 'no-store' });
    if (!r.ok) return;
    COMMENTS = await r.json();
    localStorage.setItem('pokernight_comments', JSON.stringify(COMMENTS));
    if (rerender && document.getElementById('wall-list')) renderWall(rerender);
  } catch (e) {}
}
function wallOf(pid) { return (COMMENTS[pid] || []).slice().sort((a, b) => b.ts - a.ts); }
async function postComment(pid) {
  const inp = document.getElementById('wall-input');
  const text = (inp.value || '').trim();
  if (!text) return;
  const author = isAdmin() ? 'מנהל' : SESSION.name;
  inp.value = '';
  (COMMENTS[pid] = COMMENTS[pid] || []).push({ id: 'tmp' + Date.now(), author, text, ts: Date.now() });
  renderWall(pid);
  try {
    await fetch(COMMENTS_API, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ playerId: pid, author, text }),
    });
  } catch (e) { toast('הפרסום יסונכרן כשתהיה רשת'); }
  pullComments(pid);
}
async function deleteComment(pid, id) {
  if (!requireAdmin()) return;
  COMMENTS[pid] = (COMMENTS[pid] || []).filter(c => c.id !== id);
  renderWall(pid);
  try {
    await fetch(COMMENTS_API, {
      method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-key': SESSION.key },
      body: JSON.stringify({ playerId: pid, id, action: 'delete' }),
    });
  } catch (e) {}
  pullComments(pid);
}
function renderWall(pid) {
  const box = document.getElementById('wall-list');
  if (!box) return;
  const list = wallOf(pid);
  box.innerHTML = list.length ? list.map(c => `<div class="wall-item">
      ${isAdmin() ? `<button class="wall-del" onclick="deleteComment('${pid}','${c.id}')">✕</button>` : ''}
      <div class="who">${esc(c.author)} <span class="when">· ${heDateShort(new Date(c.ts).toISOString().slice(0, 10))}</span></div>
      <div class="txt">${esc(c.text)}</div>
    </div>`).join('') : '<div class="empty" style="padding:12px">אין עדיין הודעות — תהיו הראשונים 💬</div>';
}

/* ================= photo of the night =================
   Kept out of the synced state document on purpose: that document is pushed
   in full on every rebuy, and a few hundred kilobytes of photo per night
   would make the whole evening crawl. The index is tiny; the picture itself
   is fetched only when someone opens that night. */
const PHOTO_API = '/api/photos';
let PHOTO_INDEX = {};
try { PHOTO_INDEX = JSON.parse(localStorage.getItem('pokernight_photoindex')) || {}; } catch (e) {}
const photoCache = new Map();
const hasPhoto = id => !!PHOTO_INDEX[id];

let photoIndexAt = 0;
async function pullPhotoIndex(rerender) {
  photoIndexAt = Date.now();
  try {
    const r = await fetch(PHOTO_API, { cache: 'no-store' });
    if (!r.ok) return;
    const next = await r.json();
    const changed = JSON.stringify(next) !== JSON.stringify(PHOTO_INDEX);
    PHOTO_INDEX = next;
    localStorage.setItem('pokernight_photoindex', JSON.stringify(next));
    if (changed && rerender && SESSION) render();
  } catch (e) {}
}
// fill in every <img data-photo="gameId"> the current screen put on the page
async function paintPhotos() {
  for (const img of document.querySelectorAll('img[data-photo]')) {
    const id = img.dataset.photo;
    if (img.dataset.done === id) continue;
    img.dataset.done = id;
    const src = await loadPhoto(id);
    if (src && img.isConnected) img.src = src;
    else if (!src && img.isConnected) img.closest('[data-photo-slot]')?.remove();
  }
}
async function loadPhoto(id) {
  if (photoCache.has(id)) return photoCache.get(id);
  if (!hasPhoto(id)) return null;
  try {
    const r = await fetch(`${PHOTO_API}?id=${encodeURIComponent(id)}`);
    if (!r.ok) return null;
    const j = await r.json();
    if (!j.photo) return null;
    photoCache.set(id, j.photo);
    return j.photo;
  } catch (e) { return null; }
}
// a phone photo is 3-6 MB; this puts it on a diet before it ever leaves the device
// a phone can hand us a file two ways: shoot one now, or pick one already taken
function pickGamePhoto(gameId) {
  if (!requireDeal()) return;
  sheet(`<h3>📷 תמונה מהערב</h3>
    <button class="btn-primary btn-big" onclick="closeSheet();takeGamePhoto('${gameId}',true)">📸 צילום עכשיו</button>
    <button class="btn-ghost btn-big" style="margin-top:8px" onclick="closeSheet();takeGamePhoto('${gameId}',false)">📁 בחירה מהגלריה</button>
    <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">ביטול</button>`);
}
function takeGamePhoto(gameId, useCamera) {
  if (!requireDeal()) return;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  // tells a phone to open the camera straight away; desktop browsers ignore it
  if (useCamera) inp.setAttribute('capture', 'environment');
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    toast('מכינה את התמונה…');
    const img = new Image();
    img.onload = () => {
      const MAX = 1280;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      uploadGamePhoto(gameId, c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => toast('לא הצלחתי לקרוא את התמונה');
    img.src = URL.createObjectURL(f);
  };
  inp.click();
}
async function uploadGamePhoto(gameId, dataUri) {
  try {
    const r = await fetch(PHOTO_API, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-admin-key': syncKey() },
      body: JSON.stringify({ gameId, photo: dataUri, by: (SESSION && SESSION.name) || '' }),
    });
    if (r.status === 413) { toast('התמונה גדולה מדי'); return; }
    if (!r.ok) { toast('ההעלאה נכשלה — ננסה שוב מאוחר יותר'); return; }
    photoCache.set(gameId, dataUri);
    PHOTO_INDEX[gameId] = { ts: Date.now(), by: (SESSION && SESSION.name) || '' };
    localStorage.setItem('pokernight_photoindex', JSON.stringify(PHOTO_INDEX));
    render();
    toast('התמונה נשמרה 📷');
  } catch (e) { toast('אין חיבור לרשת'); }
}
function removeGamePhoto(gameId) {
  if (!requireAdmin()) return;
  confirmDlg('למחוק את התמונה של הערב הזה?', async () => {
    photoCache.delete(gameId);
    delete PHOTO_INDEX[gameId];
    localStorage.setItem('pokernight_photoindex', JSON.stringify(PHOTO_INDEX));
    render();
    try {
      await fetch(PHOTO_API, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-admin-key': syncKey() },
        body: JSON.stringify({ gameId, action: 'delete' }),
      });
    } catch (e) {}

/* ================= cloud sync (Netlify Functions + Blobs) ================= */
const API = '/api/state';
const SYNCMETA_KEY = 'pokernight_syncmeta';
let SYNC = { version: 0, dirty: false, pushing: false, status: 'idle' };
try { Object.assign(SYNC, JSON.parse(localStorage.getItem(SYNCMETA_KEY)) || {}); } catch (e) {}
SYNC.pushing = false;
function syncMetaSave() { localStorage.setItem(SYNCMETA_KEY, JSON.stringify({ version: SYNC.version, dirty: SYNC.dirty })); }

/* ---- merging two copies of the data, newest-wins per record ----
   Devices each hold a full copy, so a plain overwrite lets an old copy undo
   newer work. Everything below merges record by record instead. ---- */
const FINISHED_KEY = 'pokernight_finished';
let FINISHED = [];
try { FINISHED = JSON.parse(localStorage.getItem(FINISHED_KEY)) || []; } catch (e) {}
function rememberFinished(id) {
  if (!FINISHED.includes(id)) FINISHED.push(id);
  if (FINISHED.length > 200) FINISHED = FINISHED.slice(-200);
  localStorage.setItem(FINISHED_KEY, JSON.stringify(FINISHED));
}
const entryKey = e => e.id || (e.pid + '|' + e.ts + '|' + e.delta);
function mergeById(a, b) {
  const m = new Map();
  for (const it of [...(a || []), ...(b || [])]) {
    const prev = m.get(it.id);
    if (!prev || (it.updatedAt || 0) > (prev.updatedAt || 0)) m.set(it.id, it);
  }
  return [...m.values()];
}
function mergeGame(a, b) {
  // deletion travels with the data: whichever happened last, deleting or
  // restoring, is what the merged game reflects
  const lastDel = Math.max(a.deleted ? (a.deletedAt || 1) : 0, b.deleted ? (b.deletedAt || 1) : 0);
  const lastRes = Math.max(a.restoredAt || 0, b.restoredAt || 0);
  const purged = !!(a.purged || b.purged);
  const stamp = out => {
    if (purged || lastDel > lastRes) { out.deleted = true; out.deletedAt = lastDel || Date.now(); }
    else { out.deleted = false; }
    if (lastRes) out.restoredAt = lastRes;
    if (purged) { out.purged = true; out.entries = []; out.playerIds = []; }
    return out;
  };
  // a finished game can never go back to being active
  const aDone = a.status === 'done' || FINISHED.includes(a.id);
  const bDone = b.status === 'done' || FINISHED.includes(b.id);
  let base;
  if (aDone && !bDone) base = a;
  else if (bDone && !aDone) base = b;
  else base = (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b;
  const other = base === a ? b : a;
  const out = Object.assign({}, base);
  if (FINISHED.includes(out.id) && out.status !== 'done' && other.status === 'done') return stamp(Object.assign({}, other));

  // than unioning, or the old entries would come straight back
  const aRev = a.entriesRev || 0, bRev = b.entriesRev || 0;
  if (aRev !== bRev) {
    const newer = aRev > bRev ? a : b;
    out.entries = (newer.entries || []).filter(e => (out.playerIds || []).includes(e.pid));
    return stamp(out);
  }
  // entries are append-only, so union them and drop anyone no longer in the game
  const seen = new Set(), entries = [];
  for (const e of [...(base.entries || []), ...(other.entries || [])]) {
    const k = entryKey(e);
    if (seen.has(k)) continue;
    seen.add(k); entries.push(e);
  }

}
function mergeGames(a, b) {
  const m = new Map();
  for (const g of [...(a || []), ...(b || [])]) {

function mergeRemote(remote) {
  const rd = remote.data || {};
  const before = JSON.stringify([S.players, S.games, S.seasons, S.settings]);
  S.players = mergeById(S.players, rd.players);
  S.games = mergeGames(S.games, rd.games);
  S.seasons = mergeById(S.seasons || [], rd.seasons);
  const rs = rd.settings || {};
  if ((rs.updatedAt || 0) > (S.settings.updatedAt || 0)) S.settings = Object.assign({}, DEFAULT_SETTINGS, rs);
  for (const g of S.games) if (g.status === 'done') rememberFinished(g.id);

  clampTimers(S);
  mvpDirty = true;
  localStorage.setItem(LS_KEY, JSON.stringify(S));
  SYNC.version = remote.version;
  syncMetaSave();
  return before !== JSON.stringify([S.players, S.games, S.seasons, S.settings]);
}

async function pullState(force) {
  try {
    const r = await fetch(API, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const remote = await r.json();
    // another device is already on a newer build — this one is behind
    if (remote.build && remote.build > APP_BUILD) showUpdateBar('יש גרסה חדשה של האפליקציה');
    if (remote.data && (remote.version !== SYNC.version || force)) {
      const changed = mergeRemote(remote);
      if (changed && SESSION) { render(); pullPhotoIndex(); }
    } else if (remote.version === 0 && isAdmin() && (S.players.length || S.games.length)) {
      schedulePush(); // seed the cloud from this device
    }
    SYNC.status = 'ok';
    pullComments();
  } catch (e) { SYNC.status = 'offline'; }
  if (SYNC.dirty && canDeal()) pushState();
  updateSyncBadge();
}

let pushTimer = null;
function schedulePush() {
  if (!canDeal() || !syncKey()) return;
  SYNC.dirty = true; syncMetaSave();

  pushTimer = setTimeout(pushState, 700);
  updateSyncBadge();
}
async function pushState(attempt) {
  if (!canDeal() || !syncKey() || SYNC.pushing) return;
  clearTimeout(pushTimer);
  SYNC.pushing = true;
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-admin-key': syncKey() },
      body: JSON.stringify({
        baseVersion: SYNC.version, build: APP_BUILD,
        data: { players: S.players, games: S.games, seasons: S.seasons || [], settings: S.settings },
      }),
    });
    if (r.status === 401) { SYNC.status = 'auth'; SYNC.pushing = false; updateSyncBadge(); return; }
    if (r.status === 403) {
      // the server refused a write this role is not allowed to make
      SYNC.status = 'denied'; SYNC.dirty = false; syncMetaSave();
      SYNC.pushing = false; updateSyncBadge();
      toast('השינוי הזה מותר למנהל בלבד 🔒');
      pullState(true);
      return;
    }
    if (r.status === 426) {
      // this build is too old for the server to trust — say so, loudly
      SYNC.status = 'stale'; SYNC.pushing = false; updateSyncBadge();
      showUpdateBar('הגרסה במכשיר ישנה — צריך לרענן כדי לשמור');
      return;
    }
    if (r.status === 409) {
      // someone else wrote first: merge their state in, then send the result
      const remote = await r.json();
      const changed = mergeRemote(remote);
      if (changed && SESSION) render();
      SYNC.pushing = false;
      if ((attempt || 0) < 4) return pushState((attempt || 0) + 1);
      updateSyncBadge();
      return;
    }
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    SYNC.version = j.version; SYNC.dirty = false; SYNC.status = 'ok';
    syncMetaSave();
  } catch (e) {
    SYNC.status = 'offline';
    setTimeout(() => { if (SYNC.dirty) pushState(); }, 15000);
  }

}

// who last changed this game, and when — settles "is this count current?"
function lastTouchLine(g) {

/* ================= MVP of the month ================= */
let mvpDirty = true, mvpCache = null;
const monthOf = iso => String(iso || '').slice(0, 7);
const heMonth = ym => new Intl.DateTimeFormat('he-IL', { month: 'long', year: 'numeric' })
  .format(new Date(ym + '-15T12:00:00'));
function mvpByMonth() {
  if (!mvpDirty && mvpCache) return mvpCache;
  const totals = {};
  for (const g of liveGames()) {
    if (g.status !== 'done' || !g.results || isCash(g)) continue;   // MVP is tournaments only
    const m = monthOf(g.date), p = payouts(g);
    const acc = totals[m] || (totals[m] = {});
    for (const pid of g.playerIds) acc[pid] = (acc[pid] || 0) + p.nets[pid];
  }
  const out = {};
  for (const [m, tot] of Object.entries(totals)) {
    let best = null, bv = -Infinity;
    for (const [pid, v] of Object.entries(tot)) if (v > bv) { bv = v; best = pid; }
    if (best) out[m] = { pid: best, net: bv };
  }
  mvpCache = out; mvpDirty = false;
  return out;
}
// the crown belongs to the winner of the last *finished* month
function currentMvp() {
  const all = mvpByMonth();
  const thisMonth = new Date().toISOString().slice(0, 7);
  const done = Object.keys(all).filter(m => m < thisMonth).sort();
  const last = done[done.length - 1];
  return last ? Object.assign({ month: last }, all[last]) : null;
}
function mvpTitles(pid) {

  return Object.entries(mvpByMonth()).filter(([m, v]) => m < thisMonth && v.pid === pid).length;
}
const isMvp = pid => { const m = currentMvp(); return !!m && m.pid === pid; };
const mvpBadge = pid => isMvp(pid) ? ' <span class="mvp-badge">MVP</span>' : '';

/* ================= game math ================= */
const isDeleted = g => !!g && g.deleted === true;
const liveGames = () => S.games.filter(g => !g.deleted);
const isCash = g => !!g && g.type === 'cash';

const CASH_BLINDS = [10, 20];
const activeGame = () => S.games.find(g => g.status === 'active' && !g.deleted);
const entriesOf = (g, pid) => g.entries.filter(e => e.pid === pid).reduce((s, e) => s + e.delta, 0);
const totalEntries = g => g.entries.reduce((s, e) => s + e.delta, 0);
const poolOf = g => totalEntries(g) * g.config.entryPrice;

function payouts(g) {
  if (isCash(g)) return cashPayouts(g);
  const pool = poolOf(g);
  const house10 = Math.round(pool * g.config.splitHouse / 100);
  let first, second;
  if (g.results && g.results.chop) {
    // the two winners share everything that is not the house's cut
    const prize = pool - house10;
    const pct = Math.max(0, Math.min(100, g.results.pctFirst != null ? g.results.pctFirst : 50));
    first = Math.round(prize * pct / 100);
    second = prize - first;
  } else {
    second = Math.round(pool * g.config.splitSecond / 100);
    first = pool - second - house10; // remainder to 1st
  }
  const n = g.playerIds.length;
  const houseFee = g.config.houseFee || 0;                       // per player, to the house
  const savingsFee = savingsFeeOf(g.config);                     // per player, for wear & tear
  const houseFees = n * houseFee;
  const savings = n * savingsFee;
  const houseTotal = house10 + houseFees;                        // everything the house keeps
  const nets = {};
  for (const pid of g.playerIds) {
    let win = 0;
    if (g.results) {
      if (g.results.first === pid) win += first;
      if (g.results.second === pid) win += second;
    }
    nets[pid] = win - entriesOf(g, pid) * g.config.entryPrice - houseFee - savingsFee;
  }
  return { pool, first, second, house10, houseFees, houseTotal, savings, nets };
}
// a cash night: everyone buys chips and cashes out; the house takes a flat fee
function cashPayouts(g) {
  const onTable = poolOf(g);                       // entries x buy-in = money in play
  const n = g.playerIds.length;
  const houseFee = g.config.houseFee || 0;
  const houseFees = n * houseFee;
  const cashouts = (g.results && g.results.cashouts) || {};
  const nets = {};
  let cashedOut = 0;
  for (const pid of g.playerIds) {
    const out = Number(cashouts[pid]) || 0;
    cashedOut += out;
    nets[pid] = out - entriesOf(g, pid) * g.config.entryPrice - houseFee;
  }
  return {
    cash: true, pool: onTable, onTable, cashedOut, diff: cashedOut - onTable,

function dropScheduledBreak(s) {

  playGong();
  if (S.settings.voice) speak('ההפסקה הסתיימה');
  flashClock();
}
function resumeFromBreak(g) {
  touchGame(g);
  const t = g.timer;
  if (t.resumeIdx != null) t.idx = t.resumeIdx;
  const tl = buildTimeline(g.config);
  t.endAt = Date.now() + (t.resumeRemainingMs ?? levelAt(tl, t.idx).min * 60000);
  t.running = true; t.remainingMs = null; t.mode = 'level';
  delete t.breakEndAt; delete t.breakMin; delete t.resumeIdx; delete t.resumeRemainingMs;
  warned = {}; save();
}
function timerCatchUp(g, silent) {
  const t = g.timer, tl = buildTimeline(g.config);
  if (timerMode(g) === 'awaiting') return false;
  if (timerMode(g) === 'break') {
    if (Date.now() >= t.breakEndAt) { if (silent) { t.mode = 'awaiting'; save(); } else breakFinished(g); return true; }
    return false;
  }
  if (isCash(g)) {
    // blinds never move — the round simply starts over
    const ms = (g.config.levelMinutes || 15) * 60000;
    let rolled = false;
    while (t.running && Date.now() >= t.endAt && ms > 0) {
      t.round = (t.round || 1) + 1;
      t.endAt += ms;
      rolled = true;
    }
    if (rolled) { saveLocal(); warned = {}; if (!silent) flashClock(); }
    return rolled;
  }
  let advanced = false;
  while (t.running && Date.now() >= t.endAt && t.idx < tl.length - 1) {
    t.idx++;
    t.endAt += tl[t.idx].min * 60000;
    advanced = true;
  }
  if (advanced) {
    saveLocal();          // derived from timestamps on every device; never pushed
    if (!silent) levelChanged(g);
  }
  return advanced;
}
function timerPause(g) {
  touchGame(g);
  const t = g.timer;
  if (!t.running) return;
  t.remainingMs = Math.max(0, t.endAt - Date.now());
  t.running = false; save();
}
function timerResume(g) {
  touchGame(g);
  const t = g.timer;
  if (t.running) return;
  t.endAt = Date.now() + (t.remainingMs ?? 0);
  t.running = true; t.remainingMs = null; save();
}
function timerAddMinute(g, delta) {
  touchGame(g);
  const t = g.timer, d = (delta || 1) * 60000, MIN = 10000;
  if (t.running) t.endAt = Math.max(Date.now() + MIN, t.endAt + d);
  else t.remainingMs = Math.max(MIN, (t.remainingMs || 0) + d);
  save();
}
function timerJump(g, dir) {
  touchGame(g);
  const t = g.timer, tl = buildTimeline(g.config);
  const ni = Math.min(tl.length - 1, Math.max(0, t.idx + dir));
  t.idx = ni;
  if (t.running) t.endAt = Date.now() + tl[ni].min * 60000;
  else t.remainingMs = tl[ni].min * 60000;
  save();
}
let warned = {};
function levelChanged(g) {
  const tl = buildTimeline(g.config), cur = levelAt(tl, g.timer.idx);
  cur.type === 'break' ? playBreakStart() : playLevelUp();
  vibe([80, 60, 80]);
  if (S.settings.voice) {
    if (cur.type === 'break') speak('הפסקה');
    else speak(`הבליינדים עולים: ${cur.sb}, ${cur.bb}`);
  }
  flashClock();
}

/* sounds */
let audioCtx;
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, delay, vol) {
  const ctx = ac(), o = ctx.createOscillator(), gn = ctx.createGain();
  o.frequency.value = freq; o.type = 'sine';
  gn.gain.setValueAtTime(0, ctx.currentTime + delay);
  gn.gain.linearRampToValueAtTime(vol, ctx.currentTime + delay + 0.02);
  gn.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + dur);
  o.connect(gn).connect(ctx.destination);
  o.start(ctx.currentTime + delay); o.stop(ctx.currentTime + delay + dur + 0.05);
}
function playGong() { if (!S.settings.sound) return; try { tone(660, 1.2, 0, .5); tone(880, 1.4, 0.15, .35); tone(440, 1.6, 0.05, .3); } catch (e) {} }
// blinds up: a rising figure, so the room can tell it from a break ending
function playLevelUp() { if (!S.settings.sound) return; try { tone(523, .5, 0, .38); tone(659, .5, .14, .38); tone(880, 1.1, .28, .42); } catch (e) {} }
// break called: a soft descending figure
function playBreakStart() { if (!S.settings.sound) return; try { tone(784, .45, 0, .3); tone(587, .55, .16, .3); tone(392, .9, .32, .26); } catch (e) {} }
// game over: a short fanfare
function playFanfare() { if (!S.settings.sound) return; try { tone(523, .25, 0, .34); tone(659, .25, .16, .34); tone(784, .25, .32, .36); tone(1047, .9, .48, .4); } catch (e) {} }
function playWarn() { if (!S.settings.sound) return; try { tone(880, .18, 0, .35); tone(880, .18, .28, .35); } catch (e) {} }
function playClick() { if (!S.settings.sound) return; try { tone(1200, .06, 0, .18); } catch (e) {} }
const loginAudio = new Audio('login.mp3');
loginAudio.preload = 'auto';
function playLoginChime() {
  try {
    loginAudio.currentTime = 0;
    const p = loginAudio.play();
    if (p && p.catch) p.catch(() => playChipSynth());
  } catch (e) { playChipSynth(); }
}
function playChipSynth() {
  // fallback: synthesized chip riffle
  try {
    const ctx = ac();
    for (let i = 0; i < 7; i++) {
      const t = ctx.currentTime + i * 0.055 + Math.random() * 0.012;
      const dur = 0.035;
      const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / d.length, 2);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
      bp.frequency.value = 2200 + Math.random() * 1800; bp.Q.value = 6;
      const gn = ctx.createGain(); gn.gain.value = 0.45 + Math.random() * 0.25;
      src.connect(bp); bp.connect(gn); gn.connect(ctx.destination);
      src.start(t);
    }
    tone(1050, .05, 0.46, .28);
    tone(680, .10, 0.52, .32);
  } catch (e) {}
}
function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'he-IL'; u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* wake lock */
let wakeLock = null;
async function acquireWake() {
  if (wakeLock || !('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}
function releaseWake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') acquireWake();
});
document.addEventListener('click', acquireWake, { passive: true });
setInterval(acquireWake, 30000);

/* ---- periodic refresh: reloads the app every 2 minutes so a display left
   running all night stays on the newest build and re-arms the wake lock.
   Skipped whenever a reload would interrupt something. ---- */
const AUTO_REFRESH_MS = 120000;
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (document.querySelector('.overlay')) return;                       // a dialog or sheet is open
  if (SYNC.dirty || SYNC.pushing) return;                               // changes not yet in the cloud
  const ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;       // someone is typing
  const g = activeGame();
  if (g && timerMode(g) === 'awaiting') return;                         // waiting for the manager's approval
  location.reload();
}, AUTO_REFRESH_MS);

function startGame() {

    ladder: [CASH_BLINDS.slice()],
    splitFirst: 0, splitSecond: 0, splitHouse: 0,
    maxRebuys: 0, levelMinutes: S.settings.cashRoundMinutes,
    breakAfter: 0, breakMinutes: S.settings.breakMinutes,
    chipsPerEntry: S.settings.cashChips,
  } : {
    entryPrice: S.settings.entryPrice, houseFee: S.settings.houseFee,
    savingsFee: S.settings.savingsFee,
    ladder: LADDER.map(l => l.slice()),
    splitFirst: S.settings.splitFirst, splitSecond: S.settings.splitSecond, splitHouse: S.settings.splitHouse,
    maxRebuys: S.settings.maxRebuys, levelMinutes: S.settings.levelMinutes,
    breakAfter: S.settings.breakAfter, breakMinutes: S.settings.breakMinutes,
    chipsPerEntry: CHIPS_PER_ENTRY,
  };
  const g = {
    id: uid(), date: new Date().toISOString().slice(0, 10),
    type: cash ? 'cash' : 'tournament',
    startAt: now, endAt: null, status: 'active', isManual: false,
    config,
    playerIds: [...ngSel],
    entries: [...ngSel].map(pid => ({ id: uid(), pid, delta: 1, ts: now })),
    updatedAt: now,
    results: null, timer: null,
  };
  timerInit(g);
  S.games.push(g); save();
  ngSel = new Set();
  go('game');
}

function addEntry(pid, delta) {
  if (!requireDeal()) return;
  const g = activeGame(); if (!g) return;
  const cnt = entriesOf(g, pid);
  if (delta > 0 && g.config.maxRebuys > 0 && cnt >= g.config.maxRebuys + 1) {
    confirmDlg(`⚠️ ${esc(pname(pid))} הגיע לתקרת הרי-באי (${g.config.maxRebuys}).<br>לחרוג מהתקרה?`, () => {
      pushEntry(g, { id: uid(), pid, delta: 1, ts: Date.now(), override: true });
    });
    return;
  }
  if (delta < 0 && cnt <= 0) return;
  pushEntry(g, { id: uid(), pid, delta, ts: Date.now() });
}
// every entry can be taken straight back — a misplaced tap costs one press
function pushEntry(g, entry) {
  g.entries.push(entry);
  touchGame(g); save(); playClick(); vibe(entry.delta > 0 ? 25 : [18, 40, 18]);
  render();
  const name = pname(entry.pid);
  toastAction(entry.delta > 0 ? `כניסה נוספה ל${name}` : `כניסה בוטלה ל${name}`, 'ביטול', () => {
    const cur = activeGame();
    if (!cur) return;
    cur.entries = cur.entries.filter(e => e.id !== entry.id);
    touchGame(cur); save(); render();
    toast('בוטל ↩');
  });
}
function openGamePlayer(pid) {

}
function removeFromGame(pid) {
  if (!requireDeal()) return;
  const g = activeGame(); if (!g) return;
  if (g.playerIds.length <= 2) { toast('צריך לפחות 2 שחקנים במשחק'); return; }
  confirmDlg(`להסיר את ${esc(pname(pid))} מהמשחק?<br><span style="color:var(--ink-dim);font-size:.85rem">כל הכניסות שלו במשחק הזה יימחקו.</span>`, () => {
    const p = player(pid);
    g.playerIds = g.playerIds.filter(x => x !== pid);
    g.entries = g.entries.filter(e => e.pid !== pid);
    if (g.results) for (const k of ['first', 'second', 'bubble']) if (g.results[k] === pid) g.results[k] = null;
    // a guest added by mistake, who never played anywhere else, leaves no trace
    if (p && p.guest && !S.games.some(x => x.playerIds.includes(pid))) S.players = S.players.filter(x => x.id !== pid);
    touchGame(g); save(); closeSheet(); render(); toast('השחקן הוסר מהמשחק');
  });
}
function openAddPlayerToGame() {
  if (!requireDeal()) return;

}
function lateAdd(pid) {
  if (!requireDeal()) return;
  const g = activeGame(); if (!g || g.playerIds.includes(pid)) return;
  g.playerIds.push(pid);
  g.entries.push({ id: uid(), pid, delta: 1, ts: Date.now() });
  touchGame(g); save(); closeSheet(); render(); toast(`${pname(pid)} הצטרף למשחק 🎉`);
}

/* ---- end game flow ---- */
let endPick = null;
const endResults = () => ({

  chop: endPick.chop || false, pctFirst: endPick.pctFirst,

// step 0 — a normal finish, or a deal between the last two players
function renderEndMode() {
  sheet(`<h3>איך הסתיים המשחק?</h3>

}
function setEndMode(isChop) {

  renderEndPick();
}
function renderEndPick() {
  const g = activeGame();
  const step = endPick.first === null ? 'first' : endPick.second === null ? 'second' : 'bubble';
  const title = endPick.chop
    ? (step === 'first' ? '🤝 שחקן ראשון בצ׳ופ' : step === 'second' ? '🤝 שחקן שני בצ׳ופ' : '🎈 מי היה הבאבל בוי? (יצא שלישי)')
    : (step === 'first' ? '🥇 מי לקח מקום ראשון?' : step === 'second' ? '🥈 מי לקח מקום שני?' : '🎈 מי היה הבאבל בוי? (יצא שלישי)');
  const cands = g.playerIds.filter(pid => pid !== endPick.first && pid !== endPick.second);
  sheet(`<h3>${title}</h3><div class="winner-pick">${cands.map(pid =>
    `<div class="prow" onclick="pickWinner('${pid}')">${avatarHtml(player(pid))}
     <div class="name"><div class="nick">${esc(pname(pid))}</div>
     ${nickLine(pid)}
     <div class="meta">${entriesOf(g, pid)} כניסות</div></div></div>`).join('')}</div>
    ${step === 'bubble' ? `<button class="btn-ghost" style="width:100%;margin-top:8px" onclick="endPick.bubble=null;showEndConfirm()">בלי באבל בוי</button>` : ''}

}
function pickWinner(pid) {
  const g = activeGame();
  if (endPick.first === null) { endPick.first = pid; renderEndPick(); return; }
  if (endPick.second === null) {
    endPick.second = pid;
    if (endPick.chop) { renderChopSplit(); return; }
    afterWinners();
    return;
  }
  endPick.bubble = pid; showEndConfirm();
}
function afterWinners() {
  const g = activeGame();
  const rest = g.playerIds.filter(x => x !== endPick.first && x !== endPick.second);
  if (rest.length === 1) { endPick.bubble = rest[0]; showEndConfirm(); return; }
  if (rest.length === 0) { endPick.bubble = null; showEndConfirm(); return; }
  renderEndPick();
}
// step 2b — how the two of them split the money
function renderChopSplit() {
  const g = activeGame();

}
function setChop(v, typing) {
  let n = Math.round(Number(v));
  if (!isFinite(n)) n = 50;
  endPick.pctFirst = Math.max(0, Math.min(100, n));
  if (typing) {
    // update the totals live without stealing focus from the field
    const g = activeGame();
    const p = payouts(Object.assign({}, g, { results: endResults() }));
    const b = document.getElementById('chop-b');
    if (b) b.value = 100 - endPick.pctFirst;
    const rows = document.querySelectorAll('.sheet-modal table.sheet td');
    if (rows.length >= 4) {
      rows[0].innerHTML = `🥇 ${esc(pname(endPick.first))} (${endPick.pctFirst}%)`;
      rows[1].innerHTML = shk(p.first);
      rows[2].innerHTML = `🥇 ${esc(pname(endPick.second))} (${100 - endPick.pctFirst}%)`;
      rows[3].innerHTML = shk(p.second);
    }
    return;
  }
  renderChopSplit();
}
// cash night: type what each player took off the table, and keep the books honest
function renderCashout() {
  const g = activeGame(); if (!g) return;
  const co = endPick.cashouts;
  const onTable = poolOf(g);
  const out = g.playerIds.reduce((s, pid) => s + (Number(co[pid]) || 0), 0);
  const diff = out - onTable;
  const balanced = diff === 0;
  sheet(`<h3>💵 כמה כל אחד לקח מהשולחן?</h3>
    <div class="card" style="margin-bottom:12px">
      <div class="row"><div class="grow">על השולחן</div><div style="font-weight:700;color:var(--gold)">${shk(onTable)}</div></div>
      <div class="row" style="margin-top:4px"><div class="grow">נספר עד כה</div><div style="font-weight:700">${shk(out)}</div></div>
      <div class="row" style="margin-top:4px"><div class="grow">${balanced ? '✔ מאוזן' : (diff < 0 ? 'חסר' : 'עודף')}</div>
        <div style="font-weight:700;color:${balanced ? 'var(--pos)' : 'var(--neg)'}">${balanced ? '—' : shk(Math.abs(diff))}</div></div>
    </div>
    ${g.playerIds.map(pid => `
      <div class="prow">${avatarHtml(player(pid))}
        <div class="name"><div class="nick">${esc(pname(pid))}</div>
          <div class="meta">${entriesOf(g, pid)} כניסות · ${shk(entriesOf(g, pid) * g.config.entryPrice)}</div></div>
        <input type="number" inputmode="numeric" style="width:96px;text-align:center"
               value="${co[pid] != null ? co[pid] : ''}" placeholder="₪"
               onchange="setCashout('${pid}', this.value)">
      </div>`).join('')}
    <div style="height:12px"></div>
    <button class="btn-primary btn-big" onclick="cashoutNext()">${balanced ? 'המשך' : 'המשך בכל זאת'}</button>
    <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">ביטול</button>`);
}
function setCashout(pid, v) {
  const n = Math.round(Number(v));
  if (v === '' || !isFinite(n)) delete endPick.cashouts[pid];
  else endPick.cashouts[pid] = Math.max(0, n);
  renderCashout();
}

  const g = activeGame(); if (!g) return;

// Deleting has to be recorded rather than simply dropped: every device holds a

function restoreGame(id) {

function buildWhatsApp(g) {

  if (isCash(g)) {

    ...(g.results.chop
      ? [`🤝 צ׳ופ ${g.results.pctFirst}/${100 - g.results.pctFirst} — מנצחים משותפים`,
         `🥇 ${pname(g.results.first)} — ₪${p.first} (${net(p.nets[g.results.first])})`,
         `🥇 ${pname(g.results.second)} — ₪${p.second} (${net(p.nets[g.results.second])})`]
      : [`🥇 ${pname(g.results.first)} — ₪${p.first} (${net(p.nets[g.results.first])})`,
         `🥈 ${pname(g.results.second)} — ₪${p.second} (${net(p.nets[g.results.second])})`]),
    ...(g.results.bubble ? [`🎈 ${pname(g.results.bubble)} — הבאבל בוי (${net(p.nets[g.results.bubble])})`] : []),
    `🏠 הבית (10%) — ₪${p.house10}`,

// base64 -> File without an await, so the share still counts as a user gesture
function dataUriToFile(uri, name) {
  const comma = uri.indexOf(',');
  const mime = (uri.slice(0, comma).match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
  const bin = atob(uri.slice(comma + 1));
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new File([arr], name, { type: mime });
}
async function shareGame(id) {
  const g = S.games.find(x => x.id === id); if (!g) return;
  const text = buildWhatsApp(g);
  // the night's picture goes out with the summary when the phone allows it.
  // It comes from the cache the screen already filled, so nothing is awaited
  // before the share call and the gesture stays valid.
  const photo = photoCache.get(id);
  if (photo && navigator.share && navigator.canShare) {
    try {
      const file = dataUriToFile(photo, `poker-${g.date}.jpg`);
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text });
        return;
      }
    } catch (e) {
      if (e.name === 'AbortError') return;
      // fall through to sharing the text on its own
    }
  }
  if (navigator.share) {
    try { await navigator.share({ text }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

  // one-minute warning (per round on a cash night)
  const warnKey = isCash(g) ? 'r' + (t.round || 1) : t.idx;
  if (mode === 'level' && t.running && rem <= 60000 && rem > 0 && !warned[warnKey]) { warned[warnKey] = true; playWarn(); }
}

/* ---- the rotating panel: dead screen time turned into something to read ---- */
const TV_PANEL_MS = 12000;
function tvPanels(g) {
  const out = [];
  const p = payouts(g);
  if (!isCash(g)) out.push(`🥇 <b>₪${p.first.toLocaleString('he-IL')}</b> &nbsp; 🥈 <b>₪${p.second.toLocaleString('he-IL')}</b>`);
  else out.push(`🏠 דמי בית: <b>₪${p.houseFees.toLocaleString('he-IL')}</b>`);
  // these hold from the first night, so the panel always has somewhere to go
  out.push(`🎲 <b>${(totalEntries(g) * chipsOf(g)).toLocaleString('he-IL')}</b> צ'יפים על השולחן`);
  out.push(isCash(g)
    ? `⏱ סבב של <b>${g.config.levelMinutes}</b> דקות · בליינדים קבועים <b>10/20</b>`
    : `⏱ <b>${g.config.levelMinutes}</b> דקות לרמה · <b>${(g.config.ladder || LADDER).length}</b> רמות בסולם`);
  const lead = g.playerIds.map(pid => ({ pid, n: entriesOf(g, pid) })).sort((a, b) => b.n - a.n)[0];
  if (lead && lead.n > 1) out.push(`הכי הרבה כניסות הערב: <b>${esc(pname(lead.pid))}</b> (${lead.n})`);
  const mvp = currentMvp();
  if (mvp) out.push(`👑 MVP ${esc(heMonth(mvp.month))}: <b>${esc(pname(mvp.pid))}</b>`);
  const lastBubble = liveGames()
    .filter(x => x.status === 'done' && !isCash(x) && x.results && x.results.bubble)
    .sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id))[0];
  if (lastBubble) out.push(`🎈 הבאבל בוי האחרון: <b>${esc(pname(lastBubble.results.bubble))}</b>`);
  const top = leaderboard(seasonGames())[0];
  if (top) {
    const label = S.settings.seasonName ? esc(S.settings.seasonName) : 'הטבלה';
    out.push(`🏆 מוביל ${label} — <b>${esc(pname(top.pid))}</b> &nbsp; <bdi>${top.net > 0 ? '‎+' : top.net < 0 ? '‎−' : ''}₪${Math.abs(top.net).toLocaleString('he-IL')}</bdi>`);
  }
  return out;
}
function updateTvPanel(g) {
  const el = document.getElementById('ck-panel');
  if (!el) return;
  const panels = tvPanels(g);
  if (!panels.length) { el.innerHTML = ''; return; }
  const i = Math.floor(Date.now() / TV_PANEL_MS) % panels.length;
  if (el.dataset.i === String(i)) return;
  el.dataset.i = String(i);
  el.classList.add('fade');
  setTimeout(() => {
    el.innerHTML = panels[i];
    el.classList.remove('fade');
  }, el.innerHTML ? 320 : 0);
}

/* tick loop */
let tickId = null;
function startTick() {
  if (tickId) return;
  tickId = setInterval(() => {
    const g = activeGame();
    if (!g) { if (!TV_MODE) stopTick(); return; }
    if (view === 'clock') {
      const wasMode = timerMode(g);
      updateClock();
      if (timerMode(g) !== wasMode) render();
    } else if (view === 'game') {
      const adv = timerCatchUp(g);
      if (adv) { render(); return; }
      const rem = Math.max(0, timerRemaining(g));
      const mm = Math.floor(rem / 60000), ss = Math.floor((rem % 60000) / 1000);
      const elx = document.getElementById('strip-time');
      if (elx) elx.textContent = `${mm}:${String(ss).padStart(2, '0')}`;
      const wk = isCash(g) ? 'r' + (g.timer.round || 1) : g.timer.idx;
      if (timerMode(g) === 'level' && g.timer.running && rem <= 60000 && rem > 0 && !warned[wk]) { warned[wk] = true; playWarn(); }
    } else if (view !== 'home') return;
    else timerCatchUp(g);
  }, 250);
}
function stopTick() { clearInterval(tickId); tickId = null; }

/* ---- seasons ----
   A season is just a start date: everything played on or after it counts. When
   a new one opens the old one is archived with its champion, so the all-time
   table keeps growing while the league still gets a fresh race. ---- */
const seasonStart = () => S.settings.seasonStart || null;
const seasonName = () => S.settings.seasonName || 'העונה הנוכחית';
const inSeason = g => !seasonStart() || (g.date || '') >= seasonStart();
const seasonGames = () => liveGames().filter(inSeason);
const seasonsDone = () => (S.seasons || []).slice().sort((a, b) => (b.start || '').localeCompare(a.start || ''));
const today = () => new Date().toISOString().slice(0, 10);
const dayBefore = iso => {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
};
// how many nights a season starting on this date would pick up
const gamesFrom = from => liveGames().filter(g => g.status === 'done' && !isCash(g) && (g.date || '') >= from).length;
function closeSeason(name, nextName, nextStart) {
  const start = nextStart || today();
  const games = seasonGames().filter(g => g.status === 'done' && !isCash(g));
  const lb = leaderboard(seasonGames());
  const champ = lb[0] || null;
  const rec = {
    id: uid(), name: name || seasonName(),
    start: seasonStart() || games.map(g => g.date).sort()[0] || start,
    // one season ends where the next begins, so the two never overlap
    end: dayBefore(start),
    championPid: champ ? champ.pid : null, net: champ ? champ.net : 0,
    games: games.length, updatedAt: Date.now(),
  };
  S.seasons = (S.seasons || []).concat([rec]);
  S.settings.seasonStart = start;
  S.settings.seasonName = nextName || '';
  S.settings.updatedAt = Date.now();
  save();
  return rec;
}

/* ---- streaks: how the last few nights went, newest first ---- */
function streakOf(pid) {
  const gs = liveGames()
    .filter(g => g.status === 'done' && !isCash(g) && g.playerIds.includes(pid) && g.results)
    .sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
  if (!gs.length) return null;
  const itm = g => g.results.first === pid || g.results.second === pid;
  const hot = itm(gs[0]);
  let n = 0;
  for (const g of gs) { if (itm(g) === hot) n++; else break; }
  return { hot, n };
}
const streakTag = pid => {
  const s = streakOf(pid);
  if (!s || s.n < 2) return '';
  return s.hot
    ? `<span class="streak-tag">🔥 ${s.n} ערבים ברצף בכסף</span>`
    : `<span class="streak-tag cold">${s.n} ערבים ברצף בלי כסף</span>`;
};

/* ---- head to head ---- */
function headToHead(a, b) {
  const shared = liveGames().filter(g => g.status === 'done' && !isCash(g)
    && g.playerIds.includes(a) && g.playerIds.includes(b));
  let aWins = 0, bWins = 0, aNet = 0, bNet = 0;
  for (const g of shared) {
    const p = payouts(g);
    aNet += p.nets[a]; bNet += p.nets[b];
    if (p.nets[a] > p.nets[b]) aWins++;
    else if (p.nets[b] > p.nets[a]) bWins++;
  }
  return { games: shared.length, aWins, bWins, aNet, bNet };
}

/* ---- stats ---- */
function allStats(list) {
  const st = {};
  for (const g of (list || liveGames())) {
    if (g.status !== 'done' || isCash(g)) continue;   // cash nights stay out of the table
    const p = payouts(g);
    for (const pid of g.playerIds) {
      const s = st[pid] || (st[pid] = { pid, games: 0, entries: 0, firsts: 0, seconds: 0, bubbles: 0, net: 0, best: -Infinity });
      s.games++; s.entries += entriesOf(g, pid);
      if (g.results.first === pid) s.firsts++;
      if (g.results.second === pid) { if (g.results.chop) s.firsts++; else s.seconds++; }
      if (g.results.bubble === pid) s.bubbles++;
      s.net += p.nets[pid];
      s.best = Math.max(s.best, p.nets[pid]);
    }
  }
  return st;
}
function leaderboard(list) { return Object.values(allStats(list)).sort((a, b) => b.net - a.net); }

/* ---- cumulative profit sparkline ---- */
function sparkHtml(vals) {
  if (!vals || vals.length < 2) return '';
  const W = 300, H = 92, PAD = 8;
  const min = Math.min(0, ...vals), max = Math.max(0, ...vals);
  const span = (max - min) || 1;
  const x = i => PAD + i * (W - 2 * PAD) / (vals.length - 1);
  const y = v => PAD + (max - v) / span * (H - 2 * PAD);
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const zy = y(0).toFixed(1);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <line class="zero" x1="0" y1="${zy}" x2="${W}" y2="${zy}" vector-effect="non-scaling-stroke"/>
    <path class="line" d="${d}" vector-effect="non-scaling-stroke"/>
    <circle class="dot" cx="${x(vals.length - 1).toFixed(1)}" cy="${y(vals[vals.length - 1]).toFixed(1)}" r="3.6"/>
  </svg>`;
}

  }

      <div class="row">
        <label class="field grow"><span>מקום 1 (%)</span><input type="number" inputmode="numeric" id="st-s1" value="${s.splitFirst}"></label>
        <label class="field grow"><span>מקום 2 (%)</span><input type="number" inputmode="numeric" id="st-s2" value="${s.splitSecond}"></label>

    </div>

    <div class="card">
      <div class="row">
        <label class="field grow"><span>כניסה בקאש (₪)</span><input type="number" inputmode="numeric" id="st-cash-entry" value="${s.cashEntryPrice}"></label>
        <label class="field grow"><span>דמי בית בקאש (₪)</span><input type="number" inputmode="numeric" id="st-cash-fee" value="${s.cashHouseFee}"></label>

    </div>
