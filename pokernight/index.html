<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="מנהל ערבי פוקר — כניסות, חישוב פרסים, שעון בליינדים וסיכום לוואטסאפ.">
<meta name="theme-color" content="#0b120e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ערב פוקר">
<title>ערב פוקר 🃏</title>
<style>
  @font-face { font-family: 'Rubik'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/rubik-var-hebrew.woff2) format('woff2'); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: 'Rubik'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/rubik-var-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Frank Ruhl Libre'; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/frank-ruhl-libre-700-hebrew.woff2) format('woff2'); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: 'Frank Ruhl Libre'; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/frank-ruhl-libre-700-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  :root {
    --bg: #0b120e;
    --felt: #12281c;
    --felt-hi: #1a3a28;
    --card: rgba(17, 27, 21, .93);
    --card-hi: rgba(24, 38, 30, .95);
    --line: #24382c;
    --gold: #d4af37;
    --gold-dim: #a8892b;
    --ink: #f2efe6;
    --ink-dim: #9fb0a5;
    --pos: #4caf7d;
    --neg: #e05252;
    --danger: #b03434;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    font-family: "Rubik", "Heebo", "Assistant", "Arial Hebrew", -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    direction: rtl;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  bdi, .num { font-variant-numeric: tabular-nums; }

  #bgimg {
    position: fixed; inset: 0; z-index: -1;
    background: url(bg.jpg) center / cover no-repeat var(--bg);
  }
  #bgimg::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(rgba(7, 12, 9, .68), rgba(7, 12, 9, .84));
  }

  #app {
    max-width: 560px;
    margin: 0 auto;
    padding: 14px 14px calc(84px + env(safe-area-inset-bottom));
    min-height: 100dvh;
  }
  h1 { font-size: 1.35rem; font-weight: 700; font-family: 'Frank Ruhl Libre', 'Rubik', serif; letter-spacing: .01em; }
  h2 { font-size: .82rem; font-weight: 600; color: var(--gold-dim); margin: 18px 0 8px; letter-spacing: .14em; text-transform: uppercase; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .topbar .sub { color: var(--ink-dim); font-size: .85rem; }

  .card {
    background: linear-gradient(rgba(255, 255, 255, .025), rgba(255, 255, 255, 0) 40%), var(--card);
    border: 1px solid rgba(212, 175, 55, .13);
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .35);
  }
  .card.felt {
    background: linear-gradient(160deg, var(--felt-hi), var(--felt));
    border-color: rgba(212, 175, 55, .3);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .05);
  }

  button {
    font: inherit; color: inherit; background: var(--card-hi);
    border: 1px solid rgba(212, 175, 55, .16); border-radius: 12px;
    padding: 10px 14px; cursor: pointer; touch-action: manipulation;
    transition: transform .12s ease, box-shadow .2s ease, border-color .2s ease;
  }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .4; }
  .btn-primary {
    background: linear-gradient(165deg, #efd77c 0%, #d4af37 45%, #a8892b 100%);
    color: #17130a; font-weight: 700; border: none;
    box-shadow: 0 4px 18px rgba(212, 175, 55, .22), inset 0 1px 0 rgba(255, 255, 255, .35);
    text-shadow: 0 1px 0 rgba(255, 255, 255, .25);
  }
  .btn-big { width: 100%; padding: 16px; font-size: 1.12rem; border-radius: 15px; letter-spacing: .02em; }
  .btn-ghost { background: transparent; }
  .btn-danger { color: #ff9c9c; border-color: rgba(224, 82, 82, .35); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, .2); border-radius: 4px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .grow { flex: 1; }

  /* bottom nav */
  nav {
    position: fixed; bottom: 0; right: 0; left: 0; z-index: 30;
    background: rgba(11, 18, 14, .92); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-around;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  nav button {
    background: none; border: none; color: var(--ink-dim);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: .7rem; padding: 4px 8px; min-width: 58px;
  }
  nav button .ico svg { width: 22px; height: 22px; display: block; }
  nav button.active { color: var(--gold); }
  nav button.active .ico svg { filter: drop-shadow(0 0 7px rgba(212, 175, 55, .65)); }
  .gi svg { width: 18px; height: 18px; vertical-align: -4px; }

  /* player rows in active game */
  .prow {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid rgba(212, 175, 55, .12);
    border-radius: 16px; padding: 10px 12px; margin-bottom: 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
  }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--felt-hi); color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; overflow: hidden; flex-shrink: 0;
    border: 2px solid var(--gold-dim);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .4);
    font-family: 'Frank Ruhl Libre', serif;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.big { width: 84px; height: 84px; font-size: 1.6rem; }
  .prow .name { flex: 1; min-width: 0; }
  .prow .name .nick { font-weight: 600; }
  .prow .name .meta { font-size: .78rem; color: var(--ink-dim); }
  .nickname { color: var(--gold-dim); font-size: .76rem; font-weight: 500; }
  .cnt { font-size: 1.3rem; font-weight: 700; min-width: 34px; text-align: center; }
  .btn-plus, .btn-minus {
    width: 46px; height: 46px; border-radius: 50%; font-size: 1.5rem;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .btn-plus {
    background: radial-gradient(circle at 35% 28%, #f4de85, #d4af37 55%, #967922);
    color: #17130a; font-weight: 700;
    border: 3px dashed rgba(255, 255, 255, .6);
    box-shadow: 0 3px 10px rgba(0, 0, 0, .5), inset 0 0 0 2px rgba(0, 0, 0, .18);
  }
  .btn-minus { background: transparent; color: var(--ink-dim); width: 38px; height: 38px; font-size: 1.2rem; border-color: rgba(212, 175, 55, .18); }
  .capped { font-size: .68rem; color: var(--neg); }

  /* timer strip */
  .strip {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: linear-gradient(160deg, var(--felt-hi), var(--felt));
    border: 1px solid rgba(212, 175, 55, .3); border-radius: 18px;
    padding: 12px 14px; margin-bottom: 12px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .05);
  }
  .strip .lvl, #clock .lvl { letter-spacing: .12em; }
  .strip .t { font-size: 1.7rem; font-weight: 700; }
  .strip .b { font-size: 1.05rem; font-weight: 600; color: var(--gold); }
  .strip .lvl { font-size: .75rem; color: var(--ink-dim); }

  /* fullscreen clock */
  #clock {
    position: fixed; inset: 0; z-index: 50;
    background: linear-gradient(rgba(7, 12, 9, .78), rgba(7, 12, 9, .9)), url(bg.jpg) center / cover no-repeat var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(4px, 1.5vh, 14px); padding: 20px; user-select: none;
  }
  #clock .lvl { color: var(--ink-dim); font-size: clamp(1rem, 3vmin, 1.4rem); letter-spacing: .06em; }
  #clock .time { font-size: clamp(4rem, 24vmin, 12rem); font-weight: 700; line-height: 1; direction: ltr; font-family: 'Frank Ruhl Libre', 'Rubik', serif; }
  #clock .blinds { font-size: clamp(2rem, 10vmin, 5rem); font-weight: 700; color: var(--gold); direction: ltr; font-family: 'Frank Ruhl Libre', 'Rubik', serif; text-shadow: 0 0 24px rgba(212, 175, 55, .25); }
  #clock .next { color: var(--ink-dim); font-size: clamp(.95rem, 3vmin, 1.3rem); }
  #clock .stats { display: flex; gap: clamp(12px, 4vmin, 34px); margin-top: 1vh; flex-wrap: wrap; justify-content: center; }
  #clock .stats div { text-align: center; }
  #clock .stats .v { font-size: clamp(1.1rem, 4vmin, 1.7rem); font-weight: 700; }
  #clock .stats .k { font-size: .72rem; color: var(--ink-dim); }
  #clock.break-mode { background: linear-gradient(rgba(46, 37, 15, .8), rgba(10, 8, 2, .92)), url(bg.jpg) center / cover no-repeat var(--bg); }
  #clock .ctrls {
    position: absolute; bottom: calc(16px + env(safe-area-inset-bottom)); right: 0; left: 0;
    display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
    transition: opacity .25s; opacity: 0; pointer-events: none;
  }
  #clock.show-ctrls .ctrls { opacity: 1; pointer-events: auto; }
  #clock .exit { position: absolute; top: calc(14px + env(safe-area-inset-top)); inset-inline-start: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #clock.show-ctrls .exit { opacity: 1; pointer-events: auto; }
  #clock .paused-tag { color: var(--neg); font-weight: 700; letter-spacing: .1em; }
  @keyframes pulse { 0% { opacity: .85; } 100% { opacity: 0; } }
  #clock .flash { position: absolute; inset: 0; background: var(--gold); opacity: 0; pointer-events: none; }
  #clock .flash.on { animation: pulse 1.1s ease-out; }

  /* stats / tables */
  .lb { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-bottom: 1px solid var(--line); }
  .lb:last-child { border-bottom: none; }
  .lb .rank { width: 26px; text-align: center; color: var(--ink-dim); font-weight: 700; }
  .lb .who { flex: 1; min-width: 0; }
  .lb .who .meta { font-size: .74rem; color: var(--ink-dim); }
  .money-pos { color: var(--pos); font-weight: 700; }
  .money-neg { color: var(--neg); font-weight: 700; }
  .money-zero { color: var(--ink-dim); font-weight: 700; }

  table.sheet { width: 100%; border-collapse: collapse; font-size: .92rem; }
  table.sheet th { color: var(--ink-dim); font-weight: 500; font-size: .76rem; text-align: right; padding: 6px 4px; }
  table.sheet td { padding: 8px 4px; border-top: 1px solid var(--line); }
  table.sheet td:last-child, table.sheet th:last-child { text-align: left; }

  /* forms */
  input[type=text], input[type=number], input[type=date], input[type=time], input[type=password], select {
    font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
    border: 1px solid rgba(212, 175, 55, .18); border-radius: 12px;
    padding: 10px 12px; width: 100%;
    -webkit-appearance: none; appearance: none;
  }
  input:focus, select:focus { outline: none; border-color: var(--gold-dim); box-shadow: 0 0 0 3px rgba(212, 175, 55, .14); }
  label.field { display: block; margin-bottom: 10px; font-size: .85rem; color: var(--ink-dim); }
  label.field span { display: block; margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid rgba(212, 175, 55, .18); border-radius: 999px; padding: 8px 14px;
    background: var(--card); cursor: pointer; display: flex; align-items: center; gap: 8px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .chip.on { border-color: var(--gold); color: var(--gold); background: rgba(212, 175, 55, .08); box-shadow: 0 0 12px rgba(212, 175, 55, .18); }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper button { width: 38px; height: 38px; border-radius: 50%; padding: 0; font-size: 1.2rem; }

  /* overlays */
  .overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .6);
    display: flex; align-items: flex-end; justify-content: center;
  }
  @keyframes sheetUp { from { transform: translateY(26px); opacity: .5; } to { transform: none; opacity: 1; } }
  .sheet-modal {
    background: var(--card); border: 1px solid rgba(212, 175, 55, .2); border-bottom: none;
    animation: sheetUp .22s ease;
    box-shadow: 0 -12px 40px rgba(0, 0, 0, .5);
    border-radius: 22px 22px 0 0; width: 100%; max-width: 560px;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height: 88dvh; overflow-y: auto;
  }
  .sheet-modal::before { content: ''; display: block; width: 38px; height: 4px; border-radius: 2px; background: rgba(212, 175, 55, .35); margin: 0 auto 12px; }
  .sheet-modal h3 { margin-bottom: 12px; font-family: 'Frank Ruhl Libre', serif; }

  #toast {
    position: fixed; bottom: calc(96px + env(safe-area-inset-bottom)); right: 50%;
    transform: translateX(50%); z-index: 70;
    background: var(--card-hi); border: 1px solid rgba(212, 175, 55, .3);
    padding: 10px 18px; border-radius: 999px; font-size: .88rem;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .5);
    transition: opacity .3s; opacity: 0; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  .pool-bar {
    position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 20;
    background: linear-gradient(160deg, var(--felt-hi), var(--felt));
    border: 1px solid var(--gold-dim); border-radius: 16px;
    padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .55), 0 0 22px rgba(212, 175, 55, .12);
  }
  .live-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #e05252; animation: livePulse 1.6s infinite; margin-inline-end: 2px; }
  @keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(224, 82, 82, .45); } 70% { box-shadow: 0 0 0 8px rgba(224, 82, 82, 0); } 100% { box-shadow: 0 0 0 0 rgba(224, 82, 82, 0); } }
  .empty-lg::before { content: '\2660'; display: block; font-size: 1.7rem; color: var(--gold-dim); opacity: .55; margin-bottom: 4px; }
  .avatar.huge { width: 112px; height: 112px; font-size: 2.4rem; border-width: 3px; }
  .balloon { display: inline-block; font-size: 1.7rem; animation: floaty 2.6s ease-in-out infinite; }
  .balloon.b2 { animation-delay: 1.3s; }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .bubble-card { text-align: center; }
  .bubble-card .who { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .pool-bar .amounts { font-size: .78rem; color: var(--ink-dim); }
  .pool-bar .pool { font-size: 1.25rem; font-weight: 700; color: var(--gold); }
  .empty { text-align: center; color: var(--ink-dim); padding: 30px 10px; font-size: .9rem; }
  .winner-pick .prow { cursor: pointer; }
  .winner-pick .prow:active { border-color: var(--gold); }
  a { color: var(--gold); }
</style>
</head>
<body>
<div id="bgimg"></div>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast"></div>

<script>
'use strict';

/* ================= state ================= */
const LS_KEY = 'pokernight_v1';
const CHIPS_PER_ENTRY = 1500;
const LADDER = [
  [10, 20], [15, 30], [20, 40], [30, 60], [40, 80],
  [50, 100], [75, 150], [100, 200], [150, 300], [200, 400],
  [300, 600], [400, 800], [600, 1200], [800, 1600], [1000, 2000],
  [1500, 3000], [2000, 4000], [3000, 6000],
];
const DEFAULT_SETTINGS = {
  entryPrice: 30, houseFee: 30,
  splitFirst: 65, splitSecond: 25, splitHouse: 10,
  maxRebuys: 12,
  levelMinutes: 15, breakAfter: 5, breakMinutes: 10,
  sound: true, voice: true,
};

let S = loadState();
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      s.settings = Object.assign({}, DEFAULT_SETTINGS, s.settings || {});
      s.players = s.players || [];
      s.games = s.games || [];
      return s;
    }
  } catch (e) { console.error(e); }
  return { players: [], games: [], settings: Object.assign({}, DEFAULT_SETTINGS) };
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(S)); schedulePush(); }
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)); }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

/* ================= auth ================= */
const ADMIN_USER = 'pitboss';
const ADMIN_HASH = '4a25821c2a1389c33ea72d492e616f0c2fcc56e274ca2070b0964494eadb547f';
const SESSION_KEY = 'pokernight_session';
let SESSION = null;
try { SESSION = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) {}
const isAdmin = () => !!SESSION && SESSION.role === 'admin';
function requireAdmin() {
  if (isAdmin()) return true;
  toast('פעולה למנהל בלבד 🔒');
  return false;
}
async function sha256hex(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
let loginMode = 'user';
function renderLogin() {
  document.getElementById('nav').hidden = true;
  document.getElementById('app').innerHTML = `
    <div style="min-height:88dvh;display:flex;flex-direction:column;justify-content:center">
      <div style="text-align:center;margin-bottom:26px">
        <img src="icon-192.png" alt="" style="width:84px;height:84px;border-radius:20px">
        <h1 style="margin-top:12px;font-size:1.9rem;background:linear-gradient(160deg,#e8cd6a,#a8892b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">ערב פוקר</h1>
      </div>
      <div class="card felt">
        <div class="chips" style="justify-content:center;margin-bottom:16px">
          <div class="chip ${loginMode === 'user' ? 'on' : ''}" onclick="loginMode='user';renderLogin()"><span class="gi">${ICONS.user}</span> שחקן</div>
          <div class="chip ${loginMode === 'admin' ? 'on' : ''}" onclick="loginMode='admin';renderLogin()"><span class="gi">${ICONS.key}</span> מנהל</div>
        </div>
        ${loginMode === 'user' ? `
          <label class="field"><span>איך קוראים לך?</span><input type="text" id="lg-name" autocomplete="off"></label>
          <button class="btn-primary btn-big" onclick="userLogin()">כניסה</button>
        ` : `
          <label class="field"><span>שם משתמש</span><input type="text" id="lg-user" autocomplete="off" autocapitalize="off"></label>
          <label class="field"><span>סיסמה</span><input type="password" id="lg-pass"></label>
          <button class="btn-primary btn-big" onclick="adminLogin()">כניסת מנהל</button>
        `}
      </div>
    </div>`;
  setTimeout(() => document.getElementById(loginMode === 'user' ? 'lg-name' : 'lg-user')?.focus(), 60);
}
function setSession(sess) {
  SESSION = sess;
  localStorage.setItem(SESSION_KEY, JSON.stringify(sess));
}
function userLogin() {
  const name = document.getElementById('lg-name').value.trim();
  if (!name) { toast('צריך שם 🙂'); return; }
  setSession({ role: 'user', name, ts: Date.now() });
  playLoginChime();
  render();
  pullState(true);
}
async function adminLogin() {
  const u = document.getElementById('lg-user').value.trim();
  const p = document.getElementById('lg-pass').value;
  if (u === ADMIN_USER && await sha256hex(`pn|${u}|${p}`) === ADMIN_HASH) {
    setSession({ role: 'admin', name: 'מנהל', key: p, ts: Date.now() });
    playLoginChime();
    toast('ברוך הבא, מנהל 🔑');
    render();
    pullState();
  } else {
    toast('שם משתמש או סיסמה שגויים');
    const el = document.getElementById('lg-pass'); if (el) el.value = '';
  }
}
function logout() {
  localStorage.removeItem(SESSION_KEY);
  SESSION = null;
  render();
}

/* ================= cloud sync (Netlify Functions + Blobs) ================= */
const API = '/api/state';
const SYNCMETA_KEY = 'pokernight_syncmeta';
let SYNC = { version: 0, dirty: false, pushing: false, status: 'idle' };
try { Object.assign(SYNC, JSON.parse(localStorage.getItem(SYNCMETA_KEY)) || {}); } catch (e) {}
SYNC.pushing = false;
function syncMetaSave() { localStorage.setItem(SYNCMETA_KEY, JSON.stringify({ version: SYNC.version, dirty: SYNC.dirty })); }

function applyRemote(remote) {
  S = {
    players: remote.data.players || [],
    games: remote.data.games || [],
    settings: Object.assign({}, DEFAULT_SETTINGS, remote.data.settings || {}),
  };
  localStorage.setItem(LS_KEY, JSON.stringify(S));
  SYNC.version = remote.version;
  SYNC.dirty = false;
  syncMetaSave();
}

async function pullState(force) {
  // an admin with unpushed local changes never pulls over them
  if (SYNC.dirty && isAdmin()) { pushState(); return; }
  try {
    const r = await fetch(API, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const remote = await r.json();
    if (remote.data && (remote.version > SYNC.version || force)) {
      applyRemote(remote);
      if (SESSION) render();
    } else if (remote.version === 0 && isAdmin() && (S.players.length || S.games.length)) {
      schedulePush(); // seed the cloud from this device
    }
    SYNC.status = 'ok';
  } catch (e) { SYNC.status = 'offline'; }
  updateSyncBadge();
}

let pushTimer = null;
function schedulePush() {
  if (!isAdmin() || !SESSION.key) return;
  SYNC.dirty = true; syncMetaSave();
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushState, 1500);
  updateSyncBadge();
}
async function pushState() {
  if (!isAdmin() || !SESSION.key || SYNC.pushing) return;
  SYNC.pushing = true;
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-admin-key': SESSION.key },
      body: JSON.stringify({ data: { players: S.players, games: S.games, settings: S.settings } }),
    });
    if (r.status === 401) { SYNC.status = 'auth'; SYNC.pushing = false; updateSyncBadge(); return; }
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    SYNC.version = j.version; SYNC.dirty = false; SYNC.status = 'ok';
    syncMetaSave();
  } catch (e) {
    SYNC.status = 'offline';
    setTimeout(() => { if (SYNC.dirty) pushState(); }, 15000);
  }
  SYNC.pushing = false;
  updateSyncBadge();
}
function syncBadgeText() {
  if (SYNC.status === 'auth') return '🔒 מפתח סנכרון שגוי';
  if (SYNC.dirty) return '⟳ ממתין לסנכרון';
  if (SYNC.status === 'ok') return '☁️ מסונכרן';
  if (SYNC.status === 'offline') return '📴 אופליין — הנתונים נשמרים במכשיר';
  return '';
}
function updateSyncBadge() {
  const el = document.getElementById('sync-badge');
  if (el) el.textContent = syncBadgeText();
}
setInterval(() => { if (document.visibilityState === 'visible') pullState(); }, 10000);
window.addEventListener('online', () => { SYNC.dirty ? pushState() : pullState(); });

  return `<span class="money-zero"><bdi>₪0</bdi></span>`;
}

/* ================= game math ================= */
const activeGame = () => S.games.find(g => g.status === 'active');
const entriesOf = (g, pid) => g.entries.filter(e => e.pid === pid).reduce((s, e) => s + e.delta, 0);
const totalEntries = g => g.entries.reduce((s, e) => s + e.delta, 0);
const poolOf = g => totalEntries(g) * g.config.entryPrice;

function payouts(g) {
  const pool = poolOf(g);
  const second = Math.round(pool * g.config.splitSecond / 100);
  const house10 = Math.round(pool * g.config.splitHouse / 100);
  const first = pool - second - house10; // remainder to 1st
  const houseTotal = house10 + g.playerIds.length * g.config.houseFee;
  const nets = {};
  for (const pid of g.playerIds) {
    let win = 0;
    if (g.results) {
      if (g.results.first === pid) win += first;
      if (g.results.second === pid) win += second;
    }
    nets[pid] = win - entriesOf(g, pid) * g.config.entryPrice - g.config.houseFee;
  }
  return { pool, first, second, house10, houseTotal, nets };
}

function buildTimeline(cfg) {
  const t = [];
  LADDER.forEach(([sb, bb], i) => {
    t.push({ type: 'level', n: i + 1, sb, bb, min: cfg.levelMinutes });
    if (i + 1 === cfg.breakAfter) t.push({ type: 'break', min: cfg.breakMinutes });
  });
  return t;
}

/* ================= timer engine ================= */
function timerInit(g) {
  g.timer = { idx: 0, running: true, endAt: Date.now() + buildTimeline(g.config)[0].min * 60000, remainingMs: null };
}
function timerRemaining(g) {
  const t = g.timer;
  return t.running ? t.endAt - Date.now() : t.remainingMs;
}
function timerCatchUp(g, silent) {
  const t = g.timer, tl = buildTimeline(g.config);
  let advanced = false;
  while (t.running && Date.now() >= t.endAt && t.idx < tl.length - 1) {
    t.idx++;
    t.endAt += tl[t.idx].min * 60000;
    advanced = true;
  }
  if (advanced) {
    save();
    if (!silent) levelChanged(g);
  }
  return advanced;
}
function timerPause(g) {
  const t = g.timer;
  if (!t.running) return;
  t.remainingMs = Math.max(0, t.endAt - Date.now());
  t.running = false; save();
}
function timerResume(g) {
  const t = g.timer;
  if (t.running) return;
  t.endAt = Date.now() + (t.remainingMs ?? 0);
  t.running = true; t.remainingMs = null; save();
}
function timerAddMinute(g) {
  const t = g.timer;
  if (t.running) t.endAt += 60000; else t.remainingMs += 60000;
  save();
}
function timerJump(g, dir) {
  const t = g.timer, tl = buildTimeline(g.config);
  const ni = Math.min(tl.length - 1, Math.max(0, t.idx + dir));
  t.idx = ni;
  if (t.running) t.endAt = Date.now() + tl[ni].min * 60000;
  else t.remainingMs = tl[ni].min * 60000;
  save();
}
let warned = {};
function levelChanged(g) {
  const tl = buildTimeline(g.config), cur = tl[g.timer.idx];
  playGong();
  if (S.settings.voice) {
    if (cur.type === 'break') speak('הפסקה');
    else speak(`הבליינדים עולים: ${cur.sb}, ${cur.bb}`);
  }
  flashClock();
}

/* sounds */
let audioCtx;
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, delay, vol) {
  const ctx = ac(), o = ctx.createOscillator(), gn = ctx.createGain();
  o.frequency.value = freq; o.type = 'sine';
  gn.gain.setValueAtTime(0, ctx.currentTime + delay);
  gn.gain.linearRampToValueAtTime(vol, ctx.currentTime + delay + 0.02);
  gn.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + dur);
  o.connect(gn).connect(ctx.destination);
  o.start(ctx.currentTime + delay); o.stop(ctx.currentTime + delay + dur + 0.05);
}
function playGong() { if (!S.settings.sound) return; try { tone(660, 1.2, 0, .5); tone(880, 1.4, 0.15, .35); tone(440, 1.6, 0.05, .3); } catch (e) {} }
function playWarn() { if (!S.settings.sound) return; try { tone(880, .18, 0, .35); tone(880, .18, .28, .35); } catch (e) {} }
function playClick() { if (!S.settings.sound) return; try { tone(1200, .06, 0, .18); } catch (e) {} }
const loginAudio = new Audio('login.mp3');
loginAudio.preload = 'auto';
function playLoginChime() {
  try {
    loginAudio.currentTime = 0;
    const p = loginAudio.play();
    if (p && p.catch) p.catch(() => playChipSynth());
  } catch (e) { playChipSynth(); }
}
function playChipSynth() {
  // fallback: synthesized chip riffle
  try {
    const ctx = ac();
    for (let i = 0; i < 7; i++) {
      const t = ctx.currentTime + i * 0.055 + Math.random() * 0.012;
      const dur = 0.035;
      const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / d.length, 2);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
      bp.frequency.value = 2200 + Math.random() * 1800; bp.Q.value = 6;
      const gn = ctx.createGain(); gn.gain.value = 0.45 + Math.random() * 0.25;
      src.connect(bp); bp.connect(gn); gn.connect(ctx.destination);
      src.start(t);
    }
    tone(1050, .05, 0.46, .28);
    tone(680, .10, 0.52, .32);
  } catch (e) {}
}
function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'he-IL'; u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function ngToggle(pid) { ngSel.has(pid) ? ngSel.delete(pid) : ngSel.add(pid); render(); }
function startGame() {
  if (!requireAdmin()) return;
  if (activeGame()) { toast('יש כבר משחק פעיל'); return; }
  if (ngSel.size < 2) return;
  const now = Date.now();
  const g = {
    id: uid(), date: new Date().toISOString().slice(0, 10),
    startAt: now, endAt: null, status: 'active', isManual: false,
    config: {
      entryPrice: S.settings.entryPrice, houseFee: S.settings.houseFee,
      splitFirst: S.settings.splitFirst, splitSecond: S.settings.splitSecond, splitHouse: S.settings.splitHouse,
      maxRebuys: S.settings.maxRebuys, levelMinutes: S.settings.levelMinutes,
      breakAfter: S.settings.breakAfter, breakMinutes: S.settings.breakMinutes,
    },
    playerIds: [...ngSel],
    entries: [...ngSel].map(pid => ({ pid, delta: 1, ts: now })),
    results: null, timer: null,
  };
  timerInit(g);
  S.games.push(g); save();
  ngSel = new Set();
  go('game');
}

function addEntry(pid, delta) {

let endPick = null;
function beginEndGame() {

function renderEndPick() {
  const g = activeGame();
  const step = endPick.first === null ? 'first' : endPick.second === null ? 'second' : 'bubble';
  const title = step === 'first' ? '🥇 מי לקח מקום ראשון?' : step === 'second' ? '🥈 מי לקח מקום שני?' : '🎈 מי היה הבאבל בוי? (יצא שלישי)';
  const cands = g.playerIds.filter(pid => pid !== endPick.first && pid !== endPick.second);
  sheet(`<h3>${title}</h3><div class="winner-pick">${cands.map(pid =>
    `<div class="prow" onclick="pickWinner('${pid}')">${avatarHtml(player(pid))}
     <div class="name"><div class="nick">${esc(pname(pid))}</div>
     ${nickLine(pid)}

    <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">ביטול</button>`);
}
function pickWinner(pid) {
  const g = activeGame();
  if (endPick.first === null) { endPick.first = pid; renderEndPick(); return; }
  if (endPick.second === null) {
    endPick.second = pid;
    const rest = g.playerIds.filter(x => x !== endPick.first && x !== endPick.second);
    if (rest.length === 1) { endPick.bubble = rest[0]; showEndConfirm(); return; }
    if (rest.length === 0) { endPick.bubble = null; showEndConfirm(); return; }
    renderEndPick(); return;
  }
  endPick.bubble = pid; showEndConfirm();
}
function showEndConfirm() {

function buildWhatsApp(g) {
  const p = payouts(g);
  const L = '‎'; // keep +/− readable in RTL
  const lines = [
    `🃏 ערב פוקר — ${heDate(g.date)}`,
    g.startAt && g.endAt ? `🕗 ${hhmm(g.startAt)}–${hhmm(g.endAt)} · ${g.playerIds.length} שחקנים · ${totalEntries(g)} כניסות` : `👥 ${g.playerIds.length} שחקנים · ${totalEntries(g)} כניסות`,

    ...(g.results.bubble ? [`🎈 ${pname(g.results.bubble)} — הבאבל בוי`] : []),

function updateClock() {
  const g = activeGame(); if (!g || view !== 'clock') return;
  timerCatchUp(g);
  const tl = buildTimeline(g.config), t = g.timer, cur = tl[t.idx], nxt = tl[t.idx + 1];
  const rem = Math.max(0, timerRemaining(g));
  const mm = Math.floor(rem / 60000), ss = Math.floor((rem % 60000) / 1000);
  const el = id => document.getElementById(id);

  el('ck-time').textContent = `${mm}:${String(ss).padStart(2, '0')}`;
  const c = document.getElementById('clock');

  el('ck-players').textContent = g.playerIds.length;
  el('ck-entries').textContent = totalEntries(g);
  el('ck-pool').textContent = '₪' + poolOf(g).toLocaleString('he-IL');

  const pb = el('ck-pausebtn'); if (pb) pb.textContent = t.running ? '⏸ השהיה' : '▶️ המשך';
  // one-minute warning

/* tick loop */
let tickId = null;
function startTick() {
  if (tickId) return;
  tickId = setInterval(() => {
    const g = activeGame();
    if (!g) { stopTick(); return; }
    if (view === 'clock') updateClock();
    else if (view === 'game') {
      const adv = timerCatchUp(g);
      if (adv) { render(); return; }
      const rem = Math.max(0, timerRemaining(g));
      const mm = Math.floor(rem / 60000), ss = Math.floor((rem % 60000) / 1000);
      const elx = document.getElementById('strip-time');
      if (elx) elx.textContent = `${mm}:${String(ss).padStart(2, '0')}`;
      if (g.timer.running && rem <= 60000 && rem > 0 && !warned[g.timer.idx]) { warned[g.timer.idx] = true; playWarn(); }
    } else if (view !== 'home') return;
    else timerCatchUp(g);
  }, 250);
}
function stopTick() { clearInterval(tickId); tickId = null; }

      const p = player(pid);
      p.avatar = c.toDataURL('image/jpeg', 0.82);
      save(); openProfile(pid); render();
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(f);
  };
  inp.click();
}

/* ---- stats ---- */
function allStats() {
  const st = {};
  for (const g of S.games) {
    if (g.status !== 'done') continue;
    const p = payouts(g);
    for (const pid of g.playerIds) {
      const s = st[pid] || (st[pid] = { pid, games: 0, entries: 0, firsts: 0, seconds: 0, bubbles: 0, net: 0, best: -Infinity });
      s.games++; s.entries += entriesOf(g, pid);
      if (g.results.first === pid) s.firsts++;
      if (g.results.second === pid) s.seconds++;
      if (g.results.bubble === pid) s.bubbles++;
      s.net += p.nets[pid];
      s.best = Math.max(s.best, p.nets[pid]);
    }
  }
  return st;
}
function leaderboard() { return Object.values(allStats()).sort((a, b) => b.net - a.net); }
function statsView() {
  const app = document.getElementById('app');
  const lb = leaderboard();
  const gamesCount = S.games.filter(g => g.status === 'done').length;
  app.innerHTML = `
    <div class="topbar"><h1><span class="gi" style="color:var(--gold)">${ICONS.stats}</span> טבלת כל הזמנים</h1><div class="sub">${gamesCount} משחקים</div></div>
    ${lb.length ? `<div class="card">` + lb.map((r, i) =>
      `<div class="lb" style="cursor:pointer" onclick="openProfile('${r.pid}')">
        <div class="rank">${i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1}</div>
        ${avatarHtml(player(r.pid))}
        <div class="who"><div>${esc(pname(r.pid))}</div>
        ${nickLine(r.pid)}
        <div class="meta">${r.games} משחקים · ${r.firsts}🥇 ${r.seconds}🥈${r.bubbles ? ' ' + r.bubbles + '🎈' : ''} · שיא ${money(r.best === -Infinity ? 0 : r.best)}</div></div>
        ${money(r.net)}</div>`).join('') + `</div>`
      : `<div class="empty empty-lg">אין עדיין נתונים.<br>שחקו משחק או הוסיפו משחקים ישנים בהיסטוריה 📜</div>`}`;
}

/* ---- history + manual ---- */
function historyView() {
  const app = document.getElementById('app');
  const done = S.games.filter(g => g.status === 'done').sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
  app.innerHTML = `
    <div class="topbar"><h1><span class="gi" style="color:var(--gold)">${ICONS.history}</span> היסטוריה</h1>${isAdmin() ? `<button class="btn-primary" onclick="startManual()">+ משחק ישן</button>` : ''}</div>
    ${done.length ? done.map(g => {
      const p = payouts(g);
      return `<div class="card" style="cursor:pointer" onclick="go('summary','${g.id}')">
        <div class="row"><div class="grow">
          <div style="font-weight:600">${heDateShort(g.date)}${g.isManual ? ' <span style="font-size:.68rem;color:var(--ink-dim)">ידני</span>' : ''}</div>
          <div class="sub" style="color:var(--ink-dim);font-size:.8rem">🥇 ${esc(pname(g.results.first))} · 🥈 ${esc(pname(g.results.second))}${g.results.bubble ? ' · 🎈 ' + esc(pname(g.results.bubble)) : ''} · ${g.playerIds.length} שחקנים · ${totalEntries(g)} כניסות</div>
        </div><div style="color:var(--gold);font-weight:700">${shk(p.pool)}</div></div></div>`;
    }).join('') : `<div class="empty empty-lg">אין משחקים שמורים.<br>הוסיפו משחקים ישנים כדי למלא את הסטטיסטיקות 🏆</div>`}`;
}
let manualState = null;
function startManual() {
  if (!requireAdmin()) return;
  manualState = { date: new Date().toISOString().slice(0, 10), players: {}, first: null, second: null, bubble: null };
  go('manual');
}
function manualView() {
  if (!manualState) { go('history'); return; }
  const m = manualState;
  const app = document.getElementById('app');
  const act = S.players.filter(p => p.active !== false);
  const chosen = Object.keys(m.players);
  app.innerHTML = `
    <div class="topbar"><h1>משחק ישן</h1><button class="btn-ghost" onclick="manualState=null;go('history')">ביטול</button></div>
    <label class="field"><span>תאריך</span><input type="date" value="${m.date}" onchange="manualState.date=this.value"></label>
    <h2>שחקנים וכניסות</h2>
    <div class="chips" style="margin-bottom:12px">${act.filter(p => !m.players[p.id]).map(p =>
      `<div class="chip" onclick="manualState.players['${p.id}']=1;render()">${chipLabel(p)}</div>`).join('')}
      <div class="chip" onclick="quickAddPlayer('manual')">+ שחקן חדש</div></div>
    ${chosen.map(pid => `
      <div class="prow">${avatarHtml(player(pid))}
        <div class="name"><div class="nick">${esc(pname(pid))}</div>
          ${nickLine(pid)}
          <div class="meta">
            <span class="chip ${m.first === pid ? 'on' : ''}" style="padding:2px 10px;font-size:.72rem" onclick="mSetPlace('first','${pid}')">🥇</span>
            <span class="chip ${m.second === pid ? 'on' : ''}" style="padding:2px 10px;font-size:.72rem" onclick="mSetPlace('second','${pid}')">🥈</span>
            <span class="chip ${m.bubble === pid ? 'on' : ''}" style="padding:2px 10px;font-size:.72rem" onclick="mSetPlace('bubble','${pid}')">🎈</span>
          </div></div>
        <div class="stepper">
          <button onclick="mStep('${pid}',-1)">−</button>
          <div class="cnt num">${m.players[pid]}</div>
          <button onclick="mStep('${pid}',1)">+</button>
        </div></div>`).join('')}
    ${chosen.length ? `<div class="card" style="margin-top:6px;color:var(--ink-dim);font-size:.85rem">
      קופה: <b style="color:var(--gold)">₪${(Object.values(m.players).reduce((a, b) => a + b, 0) * S.settings.entryPrice).toLocaleString('he-IL')}</b>
      · ${Object.values(m.players).reduce((a, b) => a + b, 0)} כניסות</div>` : ''}
    <div style="height:10px"></div>
    <button class="btn-primary btn-big" ${chosen.length < 2 || !m.first || !m.second ? 'disabled' : ''} onclick="saveManual()">שמירת המשחק</button>
    ${chosen.length >= 2 && (!m.first || !m.second) ? '<div class="empty" style="padding:10px">סמנו 🥇 ו-🥈 ליד השחקנים</div>' : ''}`;
}
function mStep(pid, d) {
  const m = manualState;
  const v = (m.players[pid] || 1) + d;
  if (v <= 0) { delete m.players[pid]; for (const k of ['first', 'second', 'bubble']) if (m[k] === pid) m[k] = null; }
  else m.players[pid] = Math.min(v, S.settings.maxRebuys + 1);
  render();
}
function mSetPlace(place, pid) {
  const m = manualState;
  for (const k of ['first', 'second', 'bubble']) if (k !== place && m[k] === pid) m[k] = null;
  m[place] = m[place] === pid ? null : pid;
  render();
}
function saveManual() {
  if (!requireAdmin()) return;
  const m = manualState;
  const pids = Object.keys(m.players);
  if (pids.length < 2 || !m.first || !m.second) return;
  const g = {
    id: uid(), date: m.date, startAt: null, endAt: null, status: 'done', isManual: true,
    config: {
      entryPrice: S.settings.entryPrice, houseFee: S.settings.houseFee,
      splitFirst: S.settings.splitFirst, splitSecond: S.settings.splitSecond, splitHouse: S.settings.splitHouse,
      maxRebuys: S.settings.maxRebuys, levelMinutes: S.settings.levelMinutes,
      breakAfter: S.settings.breakAfter, breakMinutes: S.settings.breakMinutes,
    },
    playerIds: pids,
    entries: pids.map(pid => ({ pid, delta: m.players[pid], ts: Date.now() })),
    results: { first: m.first, second: m.second, bubble: m.bubble || null }, timer: null,
  };
  S.games.push(g); save(); manualState = null;
  go('summary', g.id); toast('המשחק נוסף להיסטוריה ✔');
}

/* ---- settings ---- */
function settingsView() {
  const s = S.settings;
  const app = document.getElementById('app');
  const sessionCard = `
    <h2>חשבון</h2>
    <div class="card">
      <div class="row">
        <div class="grow">מחובר: <b>${isAdmin() ? `<span class="gi" style="color:var(--gold)">${ICONS.key}</span> מנהל` : `<span class="gi">${ICONS.user}</span> ` + esc(SESSION.name)}</b>
        <div id="sync-badge" style="font-size:.75rem;color:var(--ink-dim);margin-top:2px">${syncBadgeText()}</div></div>
        <button onclick="logout()">התנתקות</button>
      </div>
    </div>`;
  if (!isAdmin()) {
    app.innerHTML = `
      <div class="topbar"><h1><span class="gi" style="color:var(--gold)">${ICONS.settings}</span> הגדרות</h1></div>
      ${sessionCard}
      <div class="empty">שינוי הגדרות, פתיחת משחקים והוספת משחקים —<br>למנהל בלבד 🔒<br><br>כדי להתחבר כמנהל, התנתקו ובחרו «מנהל» במסך הכניסה.</div>`;
    return;
  }
  app.innerHTML = `
    <div class="topbar"><h1><span class="gi" style="color:var(--gold)">${ICONS.settings}</span> הגדרות</h1></div>
    ${sessionCard}
    <h2>כסף</h2>
    <div class="card">
      <label class="field"><span>מחיר כניסה (₪)</span><input type="number" inputmode="numeric" id="st-entry" value="${s.entryPrice}"></label>
      <label class="field"><span>דמי בית לשחקן (₪)</span><input type="number" inputmode="numeric" id="st-fee" value="${s.houseFee}"></label>
      <div class="row">
        <label class="field grow"><span>מקום 1 (%)</span><input type="number" inputmode="numeric" id="st-s1" value="${s.splitFirst}"></label>
        <label class="field grow"><span>מקום 2 (%)</span><input type="number" inputmode="numeric" id="st-s2" value="${s.splitSecond}"></label>
        <label class="field grow"><span>בית (%)</span><input type="number" inputmode="numeric" id="st-sh" value="${s.splitHouse}"></label>
      </div>
      <label class="field"><span>תקרת רי-באי לשחקן</span><input type="number" inputmode="numeric" id="st-cap" value="${s.maxRebuys}"></label>
    </div>
    <h2>שעון</h2>
    <div class="card">
      <label class="field"><span>אורך רמה</span>
        <select id="st-lvlmin">
          ${[10, 12, 15, 20].map(v => `<option value="${v}" ${s.levelMinutes === v ? 'selected' : ''}>${v} דקות ${v === 10 ? '(טורבו)' : v === 15 ? '(רגיל)' : v === 20 ? '(רגוע)' : ''}</option>`).join('')}
        </select></label>
      <div class="row">
        <label class="field grow"><span>הפסקה אחרי רמה</span><input type="number" inputmode="numeric" id="st-brkafter" value="${s.breakAfter}"></label>
        <label class="field grow"><span>אורך הפסקה (דק')</span><input type="number" inputmode="numeric" id="st-brkmin" value="${s.breakMinutes}"></label>
      </div>
      <div class="row" style="margin-top:4px">
        <div class="chip ${s.sound ? 'on' : ''}" onclick="S.settings.sound=!S.settings.sound;save();render()">🔔 צלילים</div>
        <div class="chip ${s.voice ? 'on' : ''}" onclick="S.settings.voice=!S.settings.voice;save();render()">🗣 הכרזה קולית</div>
      </div>
      <div class="empty" style="padding:10px 0 0;font-size:.78rem;text-align:right">
        סולם בליינדים: 10/20 ← 15/30 ← 20/40 ← 30/60 ← 40/80 ← הפסקה ← 50/100 ← 75/150 ← 100/200 ← 150/300 ← ... כל כניסה = ${CHIPS_PER_ENTRY.toLocaleString()} צ'יפים.
      </div>
    </div>
    <button class="btn-primary btn-big" onclick="saveSettings()">שמירת הגדרות</button>
    <h2>גיבוי</h2>
    <div class="card">
      <div class="row">
        <button class="grow" onclick="exportBackup()">⬇️ ייצוא גיבוי</button>
        <button class="grow" onclick="importBackup()">⬆️ שחזור מגיבוי</button>
      </div>
      <div class="empty" style="padding:10px 0 0;font-size:.78rem">הנתונים נשמרים במכשיר הזה. מומלץ לייצא גיבוי מדי פעם.</div>
    </div>
    <div class="card">
      <button class="btn-ghost btn-danger" style="width:100%" onclick="wipeAll()">🗑 מחיקת כל הנתונים</button>
    </div>`;
}
function saveSettings() {
  if (!requireAdmin()) return;
  const v = id => parseInt(document.getElementById(id).value, 10);
  const s1 = v('st-s1'), s2 = v('st-s2'), sh = v('st-sh');
  if (s1 + s2 + sh !== 100) { toast(`האחוזים חייבים להסתכם ב-100 (עכשיו ${s1 + s2 + sh})`); return; }
  Object.assign(S.settings, {
    entryPrice: Math.max(1, v('st-entry')), houseFee: Math.max(0, v('st-fee')),
    splitFirst: s1, splitSecond: s2, splitHouse: sh,
    maxRebuys: Math.max(0, v('st-cap')),
    levelMinutes: parseInt(document.getElementById('st-lvlmin').value, 10),
    breakAfter: Math.max(0, v('st-brkafter')), breakMinutes: Math.max(1, v('st-brkmin')),
  });
  save(); toast('ההגדרות נשמרו ✔ (יחולו ממשחק חדש)');
}
function exportBackup() {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pokernight-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('הגיבוי ירד ✔');
}
function importBackup() {
  if (!requireAdmin()) return;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!Array.isArray(data.players) || !Array.isArray(data.games)) throw new Error('bad');
        confirmDlg('השחזור יחליף את כל הנתונים הקיימים. להמשיך?', () => {
          S = data; S.settings = Object.assign({}, DEFAULT_SETTINGS, S.settings || {});
          save(); render(); toast('שוחזר בהצלחה ✔');
        });
      } catch (e) { toast('קובץ גיבוי לא תקין'); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function wipeAll() {
  if (!requireAdmin()) return;
  confirmDlg('למחוק את <b>כל</b> הנתונים לצמיתות?<br>שחקנים, משחקים וסטטיסטיקות — מהמכשיר ומהענן.', () => {
    confirmDlg('בטוחים לגמרי? אין דרך חזרה.', () => {
      S = { players: [], games: [], settings: Object.assign({}, DEFAULT_SETTINGS) };
      save(); go('home'); toast('הכול נמחק');
    });
  });
}

/* ================= sheet / dialogs ================= */
function sheet(html) {
  closeSheet();
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'sheet-ov';
  ov.onclick = e => { if (e.target === ov) closeSheet(); };
  ov.innerHTML = `<div class="sheet-modal">${html}</div>`;
  document.body.appendChild(ov);
}
function closeSheet() { document.getElementById('sheet-ov')?.remove(); }
function confirmDlg(msg, onYes) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.style.alignItems = 'center';
  ov.innerHTML = `<div class="sheet-modal" style="border-radius:20px;max-width:340px;margin:0 16px">
    <div style="margin-bottom:16px;line-height:1.5">${msg}</div>
    <div class="row"><button class="grow" id="cd-no">ביטול</button>
    <button class="grow btn-primary" id="cd-yes">אישור</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#cd-no').onclick = () => ov.remove();
  ov.querySelector('#cd-yes').onclick = () => { ov.remove(); onYes(); };
}

/* ================= boot ================= */
window.addEventListener('load', () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});
});
const _g = activeGame();
if (_g) { timerCatchUp(_g, true); view = 'game'; }
render();
if (_g) startTick();
if (SESSION) pullState();
</script>
