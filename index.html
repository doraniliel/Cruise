<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ספירה לאחור משותפת לקרוז של 1 באוקטובר 2026, עם בדיחה יומית חדשה לכל מספר ימים שנותר.">
<meta name="theme-color" content="#0e6e7a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הקרוז">
<title>הקרוז הגדול — ספירה לאחור</title>
<style>
  /* ברירת מחדל = יום */
  :root {
    --sky-top: #3aa0e0;
    --sky-mid: #8fd0f0;
    --sky-low: #d6effb;
    --sea-top: #1f9ea0;
    --sea-bot: #0b5a68;
    --orb: #fff3b0;
    --orb-glow: rgba(255, 235, 130, 0.6);
    --accent: #ffd23f;
  }
  :root[data-phase="dawn"] {
    --sky-top: #26305c; --sky-mid: #e97d6a; --sky-low: #ffc78c;
    --sea-top: #3a7d95; --sea-bot: #163a52;
    --orb: #ffdba6; --orb-glow: rgba(255, 190, 130, 0.55); --accent: #ffb27d;
  }
  :root[data-phase="day"] {
    --sky-top: #3aa0e0; --sky-mid: #8fd0f0; --sky-low: #d6effb;
    --sea-top: #1f9ea0; --sea-bot: #0b5a68;
    --orb: #fff3b0; --orb-glow: rgba(255, 235, 130, 0.6); --accent: #ffd23f;
  }
  :root[data-phase="sunset"] {
    --sky-top: #2a2a6b; --sky-mid: #ff7e5a; --sky-low: #ffcf6a;
    --sea-top: #6a4a8a; --sea-bot: #241640;
    --orb: #ff9e4a; --orb-glow: rgba(255, 140, 70, 0.6); --accent: #ff9e4a;
  }
  :root[data-phase="night"] {
    --sky-top: #050a1c; --sky-mid: #0f1a3a; --sky-low: #1b2b4d;
    --sea-top: #0c2438; --sea-bot: #04101c;
    --orb: #eef2fa; --orb-glow: rgba(200, 215, 255, 0.4); --accent: #7fb0ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: "Assistant", "Heebo", "Rubik", "Arial Hebrew", -apple-system,
      "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background: var(--sea-bot);
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    direction: rtl;
  }

  .scene {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: linear-gradient(180deg,
      var(--sky-top) 0%, var(--sky-mid) 42%, var(--sky-low) 57%,
      var(--sea-top) 57.2%, var(--sea-bot) 100%);
    transition: background 1.2s ease;
  }
  .orb {
    position: absolute; top: 16%; left: 50%;
    width: min(28vw, 170px); height: min(28vw, 170px); margin-left: min(-14vw, -85px);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, var(--orb) 0%, var(--orb) 56%, transparent 72%);
    box-shadow: 0 0 90px 26px var(--orb-glow);
    animation: bob 9s ease-in-out infinite;
    transition: background 1.2s ease, box-shadow 1.2s ease;
  }
  .glints { position: absolute; inset: 0; }
  .waves { position: absolute; left: 0; right: 0; bottom: -2px; width: 100%; height: 44vh; }
  .wave { position: absolute; left: 0; width: 200%; height: 100%; }
  .wave path { fill: rgba(255, 255, 255, 0.08); }
  .wave.back { animation: drift 15s linear infinite; opacity: 0.5; }
  .wave.front { animation: drift 9s linear infinite reverse; opacity: 0.9; bottom: 0; }
  .wave.front path { fill: rgba(255, 255, 255, 0.13); }
  .ship {
    position: absolute; bottom: 29vh; right: -80px;
    font-size: clamp(2rem, 6vw, 3.4rem);
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35));
    animation: sail 28s linear infinite, sway 4s ease-in-out infinite;
  }

  .confetti { position: fixed; inset: 0; z-index: 40; pointer-events: none; }

  .wrap {
    position: relative; z-index: 2; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(0.85rem, 3vh, 1.7rem);
    padding: clamp(1.5rem, 5vw, 3rem);
    text-align: center;
  }

  .greet {
    display: inline-flex; align-items: center; gap: 0.5em;
    font-size: clamp(0.72rem, 2.6vw, 0.92rem); font-weight: 700;
    color: #fff; background: rgba(8, 16, 26, 0.5);
    padding: 0.45em 1.05em; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    cursor: pointer; transition: transform 0.15s ease;
  }
  .greet:hover { transform: translateY(-1px); }
  .greet .edit { opacity: 0.6; font-weight: 600; }

  .eyebrow {
    font-size: clamp(0.72rem, 2.6vw, 0.95rem); font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase; color: #fff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  }

  .timer {
    display: flex; flex-direction: row-reverse; justify-content: center; align-items: stretch;
    gap: clamp(0.3rem, 1.8vw, 0.9rem);
    background: rgba(8, 16, 26, 0.42);
    border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 24px;
    padding: clamp(0.9rem, 3.4vw, 1.6rem) clamp(0.8rem, 3.2vw, 1.8rem);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 22px 55px -22px rgba(0, 0, 0, 0.6);
  }
  .unit {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.4em; min-width: clamp(3rem, 17vw, 5.2rem); padding: 0 clamp(0.2rem, 1.2vw, 0.6rem);
  }
  .unit + .unit { border-inline-end: 1px solid rgba(255, 255, 255, 0.12); }
  .num {
    font-size: clamp(2.4rem, 12vw, 5rem); font-weight: 800; line-height: 0.95; color: #fff;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    text-shadow: 0 3px 20px rgba(0, 0, 0, 0.45);
  }
  .num.sec { color: var(--accent); transition: color 1.2s ease; }
  .ulabel {
    font-size: clamp(0.62rem, 2.5vw, 0.9rem); font-weight: 700;
    letter-spacing: 0.08em; color: rgba(255, 255, 255, 0.85);
  }

  .subtitle {
    font-size: clamp(1.1rem, 4.6vw, 1.55rem); font-weight: 700; color: #fff;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
  }

  .progress {
    width: min(90vw, 30rem); display: flex; flex-direction: column; gap: 0.5em;
  }
  .progress .track {
    height: 10px; border-radius: 999px; overflow: hidden;
    background: rgba(8, 16, 26, 0.45); border: 1px solid rgba(255, 255, 255, 0.16);
  }
  .progress .fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), #ffffff);
    border-radius: 999px; transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .progress .plabel {
    font-size: clamp(0.7rem, 2.6vw, 0.85rem); font-weight: 600; color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
  }

  .message {
    max-width: 34ch; font-size: clamp(1.05rem, 4.3vw, 1.42rem); font-weight: 600;
    line-height: 1.55; color: #fff;
    background: rgba(8, 16, 26, 0.5); border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 20px; padding: clamp(1.2rem, 4.2vw, 1.7rem) clamp(1.3rem, 5vw, 2rem);
    box-shadow: 0 20px 55px -22px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    position: relative; transition: opacity 0.35s ease, transform 0.35s ease; text-wrap: pretty;
  }
  .message::before {
    content: "😈"; position: absolute; top: -0.72em; inset-inline-start: 1.1em;
    font-size: 1.55em; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.4));
  }
  .message.fade { opacity: 0; transform: translateY(8px); }

  .actions { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.5em;
    font-family: inherit; font-size: clamp(0.85rem, 3.4vw, 1rem); font-weight: 700; color: #fff;
    background: rgba(8, 16, 26, 0.5); border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 999px; padding: 0.7em 1.3em; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0) scale(0.97); }
  .btn.share { background: rgba(37, 211, 102, 0.92); border-color: rgba(255, 255, 255, 0.25); color: #06331c; }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* חלון "מי אתה?" */
  .sheet {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    background: rgba(4, 10, 18, 0.66); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s ease;
  }
  .sheet.open { opacity: 1; visibility: visible; }
  .sheet-card {
    width: min(92vw, 26rem); background: rgba(12, 24, 38, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 24px;
    padding: clamp(1.4rem, 5vw, 2rem); text-align: center;
    box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.7);
  }
  .sheet-card h2 { font-size: 1.4rem; margin-bottom: 0.35em; }
  .sheet-card p { font-size: 0.9rem; color: rgba(255, 255, 255, 0.75); margin-bottom: 1.2em; }
  .name-grid { display: flex; flex-wrap: wrap; gap: 0.55rem; justify-content: center; }
  .name-btn {
    font-family: inherit; font-size: 0.98rem; font-weight: 700; color: #fff;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 14px; padding: 0.6em 1.05em; cursor: pointer; transition: background 0.15s ease, transform 0.1s ease;
  }
  .name-btn:hover { background: rgba(255, 255, 255, 0.16); }
  .name-btn:active { transform: scale(0.96); }
  .name-btn.guest { width: 100%; margin-top: 0.3rem; background: transparent; color: rgba(255,255,255,0.7); }
  .pin-input {
    width: 100%; font-family: inherit; font-size: 1.4rem; text-align: center; letter-spacing: 0.3em;
    color: #fff; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 14px; padding: 0.6em 0.8em; margin: 0.4rem 0 0.6rem;
  }
  .pin-input:focus { outline: 2px solid var(--accent); }
  .pin-error { color: #ff9e8e; font-size: 0.9rem; font-weight: 700; margin-bottom: 0.6rem; }
  .pin-actions { display: flex; gap: 0.5rem; justify-content: center; }
  .pin-ok { background: var(--accent); color: #06202a; }

  /* חברתי — מד התלהבות + קיר */
  .social { display: flex; flex-direction: column; gap: 1rem; width: min(92vw, 32rem); }
  .hype {
    display: flex; align-items: center; justify-content: center; gap: 0.6em;
    font-family: inherit; color: #fff; cursor: pointer;
    background: rgba(8, 16, 26, 0.5); border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 18px; padding: 0.9em 1.2em;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform 0.12s ease, background 0.2s ease;
  }
  .hype:active { transform: scale(0.97); }
  .hype:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .hype .hype-emoji { font-size: 1.7em; line-height: 1; transition: transform 0.15s ease; }
  .hype.pop .hype-emoji { transform: scale(1.35) rotate(-8deg); }
  .hype .hype-count { font-size: 1.7em; font-weight: 800; font-variant-numeric: tabular-nums; }
  .hype .hype-label { font-size: 0.85em; font-weight: 700; opacity: 0.85; }
  .wall {
    display: flex; flex-direction: column; gap: 0.7rem;
    background: rgba(8, 16, 26, 0.5); border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 18px; padding: 1rem 1.1rem;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .wall-head { font-size: 1.05rem; font-weight: 800; text-align: center; }
  .wall-input { display: flex; gap: 0.5rem; }
  .wall-input input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 0.95rem; color: #fff;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 12px; padding: 0.65em 0.9em; direction: rtl;
  }
  .wall-input input::placeholder { color: rgba(255, 255, 255, 0.5); }
  .wall-input input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .wall-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 38vh; overflow-y: auto; }
  .wall-item { text-align: right; background: rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 0.55em 0.8em; }
  .wall-item .who { font-weight: 700; color: var(--accent); font-size: 0.9rem; }
  .wall-item .when { font-weight: 500; color: rgba(255, 255, 255, 0.55); font-size: 0.72rem; }
  .wall-item .what { font-size: 0.98rem; line-height: 1.4; margin-top: 0.15em; word-break: break-word; }
  .wall-empty { text-align: center; opacity: 0.6; font-size: 0.9rem; padding: 0.5rem; }
  .wall-login { align-self: center; }

  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes sail { from { transform: translateX(0); } to { transform: translateX(calc(-100vw - 160px)); } }
  @keyframes sway { 0%, 100% { rotate: -3deg; } 50% { rotate: 3deg; } }

  @media (prefers-reduced-motion: reduce) {
    .orb, .wave, .ship { animation: none !important; }
    .ship { display: none; }
    .scene, .orb, .num.sec, .progress .fill { transition: none !important; }
  }
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="orb"></div>
  <canvas class="glints"></canvas>
  <div class="ship">🚢</div>
  <svg class="waves" viewBox="0 0 1440 320" preserveAspectRatio="none">
    <g class="wave back">
      <path d="M0,160 C240,220 480,100 720,140 C960,180 1200,240 1440,170 L1440,320 L0,320 Z"></path>
      <path d="M1440,160 C1680,220 1920,100 2160,140 C2400,180 2640,240 2880,170 L2880,320 L1440,320 Z"></path>
    </g>
    <g class="wave front">
      <path d="M0,210 C200,260 420,180 720,215 C1010,248 1230,290 1440,225 L1440,320 L0,320 Z"></path>
      <path d="M1440,210 C1640,260 1860,180 2160,215 C2450,248 2670,290 2880,225 L2880,320 L1440,320 Z"></path>
    </g>
  </svg>
</div>
<canvas class="confetti" aria-hidden="true"></canvas>

<main class="wrap">
  <button class="greet" id="greet" type="button" hidden></button>
  <span class="eyebrow">הקרוז הגדול · 1 באוקטובר 2026</span>

  <div class="timer" id="timer" aria-live="polite">
    <div class="unit"><span class="num" id="days">–</span><span class="ulabel">ימים</span></div>
    <div class="unit"><span class="num" id="hours">–</span><span class="ulabel">שעות</span></div>
    <div class="unit"><span class="num" id="mins">–</span><span class="ulabel">דקות</span></div>
    <div class="unit"><span class="num sec" id="secs">–</span><span class="ulabel">שניות</span></div>
  </div>

  <div class="subtitle" id="subtitle">עד שאנחנו בים 🚢</div>

  <div class="progress">
    <div class="track"><div class="fill" id="pfill"></div></div>
    <div class="plabel" id="plabel">כבר בדרך…</div>
  </div>

  <p class="message" id="message">טוען את הבדיחה של היום…</p>

  <div class="actions">
    <button class="btn" id="reroll" type="button">🎲 עוד אחת</button>
    <button class="btn share" id="share" type="button">שתפו בוואטסאפ ↗</button>
  </div>

  <section class="social" id="social" hidden>
    <button class="hype" id="hypeBtn" type="button">
      <span class="hype-emoji">🔥</span>
      <span class="hype-count" id="hypeCount">0</span>
      <span class="hype-label">התלהבות קבוצתית · הקש!</span>
    </button>
    <div class="wall">
      <div class="wall-head">📌 קיר החבורה</div>
      <div class="wall-input" id="wallInput">
        <input id="wallText" type="text" maxlength="200" placeholder="כתוב משהו לחבורה…" aria-label="הודעה לקיר">
        <button class="btn" id="wallSend" type="button">פרסם</button>
      </div>
      <button class="btn wall-login" id="wallLogin" type="button" hidden>🔑 התחבר/י כדי להגיב</button>
      <div class="wall-list" id="wallList"></div>
    </div>
  </section>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-card">
    <div id="stepName">
      <h2 id="sheet-title">מי אתה? 🚢</h2>
      <p>בחר/י את שמך והזן/י את הקוד האישי. (נשמר רק במכשיר שלך)</p>
      <div class="name-grid" id="nameGrid"></div>
    </div>
    <div id="stepPin" hidden>
      <h2 id="pinTitle">הקוד של …</h2>
      <p>הקלד/י את הקוד האישי שקיבלת בפרטי.</p>
      <input id="pinInput" class="pin-input" type="text" inputmode="numeric" autocomplete="off" placeholder="קוד" aria-label="קוד אישי">
      <div class="pin-error" id="pinError" hidden>קוד שגוי, נסה/י שוב</div>
      <div class="pin-actions">
        <button class="name-btn" id="pinBack" type="button">→ חזרה</button>
        <button class="name-btn pin-ok" id="pinOk" type="button">אישור</button>
      </div>
    </div>
  </div>
</div>

<script>
  "use strict";

  var TARGET = new Date(2026, 9, 1, 0, 0, 0);           // 1 באוקטובר 2026, חצות מקומי
  var START = new Date(2026, 6, 24, 0, 0, 0);           // תחילת הספירה (24 ביולי)

  var CAST = ["טל", "רוית", "ערן", "אלכס", "ירון", "אלון", "ליאל", "רפאלה", "איריס"];

  // ---- בדיחת היום לפי מספר הימים המלאים שנותרו ----
  var MESSAGES = {
    75: "75 יום. ליאל כבר מלטש טכניקה חדשה לפטמות של טל וערן. הם כבר לא ישנים על הגב.",
    74: "74 יום. רוית בנתה רשימה, טל הדפיס בשלושה עותקים והצמיד למקרר. חתלתול טוב.",
    73: "73 יום. ירון חזר מפלורנטין עם סיפור שהסמיק גם את הקירות. שומר אותו לסיפון.",
    72: "72 יום. אלון קבע להתחיל לארוז. הגיע למזוודה בערב, נרדם עליה. התחלה יפה.",
    71: "71 יום. ערן תרגל פוקר פייס מול המראה. הפרצוף שיחק, הידיים הסגירו הכול.",
    70: "70 יום עגולים. רוית הרשתה לטל לבחור לבד את הגרביים. הוא כמעט בכה מרוב חופש.",
    69: "69 יום 😏. אין מה להסביר. ליאל, טל, ערן — אתם יודעים בדיוק על מה מדובר.",
    68: "68 יום. אלכס ניסה שוב להתקרב לראש של רוית. רוית כבר משחיזה מחבט. סיבוב שני.",
    67: "67 יום. רפאלה סופרת לא ימים לחופשה — אלא ימים עד שמותר לה לחנוק את ליאל.",
    66: "66 יום. ירון ואלון בחדר אחד. ירון כבר יודע מי נוחר ומי חולם בקול. השאר חסוי.",
    65: "65 יום. טל הכין לו״ז צבעוני. רוית מחקה חצי במבט אחד. ככה נראה מי הבוס.",
    64: "64 יום. ערן נשבע לא לשחק פוקר על כסף. שיחק על הפטמות של ליאל. ליאל הסכים מיד.",
    63: "63 יום. מישהו נגע לרוית בראש בחלום. היא התעוררה ורדפה אחרי אלכס עד המטבח.",
    62: "62 יום. ליאל קנה שמן. אמר 'לעיסוי'. טל נעל את דלת הקבינה מבפנים, ליתר ביטחון.",
    61: "61 יום. ירון מבטיח שערב אחד בפלורנטין יסביר הכול. חצי מפחדים, חצי מסוקרנים.",
    60: "60 יום. טל מסביר את הלו״ז דקה-דקה. רוית כבר נרדמה. החתלתול ממשיך לדבר לעצמו.",
    59: "59 יום. אלון קרא '59', חשב שזה קו אוטובוס, ואיחר גם אליו.",
    58: "58 יום. רפאלה חתמה על ביטוח חיים. הנהנה זה לא ליאל. ממש לא במקרה.",
    57: "57 יום. ערן אמר 'אשן מוקדם בקרוז'. כולם צחקו. פוקר עד שהשמש עלתה על הסיפון.",
    56: "56 יום. אלכס כל כך גבוה שהוא רואה את היעד מהמרפסת — וגם לאן אסור לו להסתכל.",
    55: "55 יום. ירון ואלון, זוג שאינו זוג, חדר אחד ומיטה וחצי. פלורנטין גאה בשניהם.",
    54: "54 יום. טל פתח קבוצת וואטסאפ שלישית ל'עדכון חשוב'. רוית עשתה לו השתקה בשקט.",
    53: "53 יום. ליאל קנה כפפות. לא שאל אף אחד. טל וערן שאלו את כל השאלות במקומו.",
    52: "52 יום. ערן סופר מראש כמה ינקה את כולם בפוקר. ליאל סופר פטמות. לכל אחד תחביב.",
    51: "51 יום. רוית עשתה תספורת חדשה. מסתכלים, לא נוגעים. אלכס — כתבנו את זה בשבילך.",
    50: "חצי הדרך! 50 יום. ליאל מתאמן בזחילה שקטה לכיוון הקבינות. טל וערן ישנים על הבטן.",
    49: "49 יום. ירון ראה בפלורנטין תלבושת מושלמת לערב הגאלה. לא בטוחים שיש בה בד.",
    48: "48 יום. טל ארז את המזוודה של רוית, של ליה, ושל הבובה של ליה. שלו? ממתין לאישור.",
    47: "47 יום. ערן הפסיד בפוקר ושילם בפטמות של ליאל. ליאל יצא ברווח. אל תשאלו איך.",
    46: "46 יום. אלכס מדד את הקבינה. גבוה מהדלת, מהמיטה, ומהסבלנות של רוית אליו.",
    45: "45 יום. רפאלה קנתה אטמי אוזניים. לא בגלל הים — בגלל הלילות ליד ליאל.",
    44: "44 יום. אלון קבע 9:00, הגיע 11:00, וקרא לזה 'הקדמתי בעצם'.",
    43: "43 יום. טל: 'שמרתי לכולנו מקומות ליד'. רוית: 'ביטלתי, אני ליד החלון, לבד'.",
    42: "42. התשובה לכל דבר ביקום — כולל 'כמה זמן ליאל יחזיק ידיים לעצמו'. רמז: פחות מזה.",
    41: "41 יום. ירון מספר סיפור מפלורנטין. חצי חדר מסמיק, החצי השני מבקש פרטים.",
    40: "40 יום. אלון עדיין 'בדרך'. משה ידע לאן הולך אחרי 40. אלון עדיין מחפש חניה.",
    39: "39 יום. ליאל שכלל את הטכניקה. טל וערן ישנים עם שריון גוף. לא עוזר להם בכלל.",
    38: "38 יום. ערן הימר שיגיע ראשון לבופה. את ההימור הזה הוא מנצח בעיניים עצומות.",
    37: "37 יום. אלכס כמעט נגע לרוית בראש שוב, מתוך הרגל. רוית שוקלת קסדה קבועה.",
    36: "36 יום. טל פתח באקסל טאב 'רוית לא צריכה לדעת'. רוית כבר קראה אותו. פעמיים.",
    35: "35 יום. אלון 'בדרך'. עדיין בבית. עדיין בפיג'מה. עדיין גאה בעצמו.",
    34: "34 יום. רפאלה מתאמנת בנשימות. המטפל אמר שזה עוזר לחיות ליד ליאל. הוא שיקר לה.",
    33: "33 יום. ירון: 'ראיתי בפלורנטין דבר שיכניס את הקרוז לרשימה שחורה'. סקרן אותנו מדי.",
    32: "32 יום. ערן כבר מחייך את חיוך ה'פלאש רויאל'. ליאל כבר מחמם אצבעות למשהו אחר.",
    31: "31 יום. טל שלח לו״ז גרסה 14. רוית תשנה הכול בגרסה 15. הוא יודע. הוא אוהב את זה.",
    30: "חודש! 30 יום. אלון בטוח שיש עוד המון זמן. יארוז בבוקר הטיסה. בלי לחץ. עם איחור.",
    29: "29 יום. ליאל קנה שמן תינוקות. אין כאן תינוקות. טל, אתה מבין בדיוק למה.",
    28: "28 יום. ירון מבטיח ערב סיפורים על הסיפון. מביאים כיסאות, יין, ומבוגר אחראי אחד.",
    27: "27 יום. ערן 'לא מכור לפוקר'. שיחק אתמול 6 שעות, בלי לזוז, בלי לאכול, בלי בושה.",
    26: "26 יום. אלכס קנה כובע. עכשיו הוא גבוה מהמעלית ומהגבולות של רוית ביחד.",
    25: "25 יום. רוית עשתה טיפול פנים. אלכס — ידיים בכיסים, עיניים לרצפה, בהצלחה.",
    24: "24 יום. ירון ישן, אלון עדיין מחפש את החדר. 'זוג חדר' רק על הנייר, ובקושי.",
    23: "23 יום. טל התחיל ספירה לאחור משלו. הוא לא יודע שאנחנו עם הדף הזה כבר שבועות.",
    22: "22 יום. רפאלה חתמה על הסכם: אם ליאל שורד את הקרוז — זה נס, לא הבטחה.",
    21: "21. גיל השתייה, בלאק ג'ק, ובערך כמות המשקאות שירון יזמין בערב אחד בפלורנטין.",
    20: "20 יום. אלון קרא '20' וחשב 'עוד חודשיים'. אלון, זה פחות. הרבה פחות.",
    19: "19 יום. ליאל מחמם ידיים. טל וערן קבעו שמירות לילה על החזה, לסירוגין.",
    18: "ח״י — 18! לחיים. אלון עוד לא חי — הוא עדיין מחפש איפה שם את הדרכון.",
    17: "17 יום. אלכס נגע במשהו עגול, חלק וחמים. זה לא היה כדור. רוית עוד רודפת אחריו.",
    16: "16 יום. ערן סימן את כולם כטרף לפוקר. ליאל סימן את טל וערן. לכל צייד יש טרף.",
    15: "15 יום. טל הדפיס כרטיסים, גיבוי, וגיבוי לגיבוי. רוית זרקה שניים בלי להסביר.",
    14: "שבועיים! ערן פותח טורניר פוקר בקרוז. הפרס: יום שלם שליאל לא נוגע לאף פטמה.",
    13: "13 יום. אלון עדיין לא בטוח באיזה נמל עולים. גם לא באיזו מדינה. גם לא מתי.",
    12: "12 יום. רפאלה ארזה מזוודה לבגדים ואחת לסבלנות. השנייה כבר מלאה עד הפקק.",
    11: "11 יום. ירון הבטיח סיפור פלורנטין לכל ערב. שריינו מקומות בשורה הראשונה.",
    10: "10 ימים! אלכס מתכופף בכל כניסה, ורוית סופרת כל תנועה של היד שלו לכיוון ראשה.",
    9: "9 ימים. ליאל תרגל, טל בכה, ערן צחק — ואז הבין שגם הוא ברשימה, וגם הוא בכה.",
    8: "8 ימים. סימן אינסוף ששכב לנוח — כמו אלון בבוקר, וכמו הידיים של ליאל שלא נחות.",
    7: "7 ימים, שבוע! רוית מזהירה מראש: יד על הראש שלה בקרוז = שחייה חזרה לנמל.",
    6: "6 ימים. אלון קבע להתעורר ב-6, יתעורר ב-9, יגיע לרציף ב-11. הספינה יוצאת ב-10.",
    5: "5 ימים. חמש אצבעות ביד — אותה יד שליאל מחמם לטל וערן. הם ספרו. הם לא ישנים.",
    4: "4 ימים. טל בדק את הלו״ז 400 פעם. רוית שינתה אותו 401. הבוס תמיד לוקח את ההגה.",
    3: "3 ימים!! ערן לא ישן מרוב פוקר דמיוני, אלכס לא נכנס בדלת מהתרגשות, ליאל מחדד ציפורניים.",
    2: "יומיים!! ליאל מוכן, טל וערן קונים מגני חזה, רוית מסמנת גבולות ראש, רפאלה מתפללת.",
    1: "עוד יום!! אלון עכשיו מתחיל לארוז. 40% סיכוי שיגיע לשדה, 100% שיאחר לשער.",
    0: "היום טסים!! ✈️🚢 אלון — קום. טל — נשום. רוית — שמרי על הראש. ערן — קלפים בכיס. ליאל — ידיים לעצמך (בערך). רפאלה — את גיבורה. שנצא לדרך 😈"
  };

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

    if (arr.length === 0) return "";

    return v;
  }

  var currentText = "";
  var departed = false;
  var MILESTONES = { 50: 1, 40: 1, 30: 1, 25: 1, 21: 1, 14: 1, 10: 1, 7: 1, 5: 1, 3: 1, 2: 1, 1: 1, 0: 1 };

  function myName() { try { return localStorage.getItem("cruiseName") || ""; } catch (e) { return ""; } }
  function myPin() { try { return localStorage.getItem("cruisePin") || ""; } catch (e) { return ""; } }

  function setMessage(text) {
    currentText = text;
    msgEl.classList.add("fade");
    window.setTimeout(function () {
      msgEl.textContent = text;
      msgEl.classList.remove("fade");
    }, 180);
  }

  function dayJoke(days) { return MESSAGES[days] || ("עוד " + days + " יום. עדיין מוקדם אפילו לאלון לאחר. תחזרו לספור בקרוב 🍹"); }

  function reroll() {
    var pool = BONUS.slice();
    var name = myName();
    if (name && PERSONAL[name]) pool = pool.concat(PERSONAL[name]);
    setMessage(pick(pool, currentText));
  }

  function updateProgress() {
    var now = new Date();
    var pct = (now - START) / (TARGET - START) * 100;
    if (pct < 0) pct = 0; if (pct > 100) pct = 100;
    pfill.style.width = pct.toFixed(1) + "%";
    plabel.textContent = "כבר " + Math.floor(pct) + "% מאחורינו · יאללה 🌊";
  }

  function tick() {
    var ms = TARGET - new Date();
    if (ms <= 0) {
      dEl.textContent = "0"; hEl.textContent = "00"; mEl.textContent = "00"; sEl.textContent = "00";
      subEl.textContent = "אנחנו כבר בים! 🚢";
      pfill.style.width = "100%"; plabel.textContent = "100% — יצאנו לדרך! 🎉";
      if (!departed) {
        departed = true;
        setMessage("הקרוז יצא לדרך! אם אתם קוראים את זה מהמרפסת של הספינה — תשתו משהו, מגיע לכם. ליאל, ידיים לעצמך.");
        celebrate(2600);
      }
      return;
    }
    var totalSec = Math.floor(ms / 1000);
    var days = Math.floor(totalSec / 86400);
    var hours = Math.floor((totalSec % 86400) / 3600);
    var mins = Math.floor((totalSec % 3600) / 60);
    var secs = totalSec % 60;
    dEl.textContent = days; hEl.textContent = pad(hours); mEl.textContent = pad(mins); sEl.textContent = pad(secs);

    if (days !== lastDays) {
      var first = lastDays === null;
      lastDays = days;
      subEl.textContent = days === 0 ? "היום זה קורה ✈️" : "עד שאנחנו בים 🚢";
      setMessage(dayJoke(days));
      updateProgress();
      if (MILESTONES[days] && !first) celebrate(2200);
      if (MILESTONES[days] && first) window.setTimeout(function () { celebrate(2000); }, 500);
    }
  }

  // ---- מראה לפי שעה ביום ----
  var starIntensity = 0.15;
  function applyPhase() {
    var h = new Date().getHours(), phase;
    if (h >= 5 && h < 7) phase = "dawn";
    else if (h >= 7 && h < 17) phase = "day";
    else if (h >= 17 && h < 20) phase = "sunset";
    else phase = "night";
    document.documentElement.setAttribute("data-phase", phase);
    starIntensity = phase === "night" ? 1 : (phase === "day" ? 0.12 : 0.5);
  }

  // ---- זיהוי אישי ----
  var sheet = document.getElementById("sheet");
  var nameGrid = document.getElementById("nameGrid");
  var stepName = document.getElementById("stepName");
  var stepPin = document.getElementById("stepPin");
  var pinTitle = document.getElementById("pinTitle");
  var pinInput = document.getElementById("pinInput");
  var pinError = document.getElementById("pinError");
  var pinOk = document.getElementById("pinOk");
  var pendingName = "";

  function renderGreeting() {
    var name = myName();
    if (name) {
      greetBtn.hidden = false;
      greetBtn.innerHTML = "היי " + name + " 👋 <span class='edit'>(החלף)</span>";
    } else {
      greetBtn.hidden = false;
      greetBtn.innerHTML = "🔑 התחבר/י";
    }
  }
  function showNameStep() { stepPin.hidden = true; stepName.hidden = false; }
  function showPinStep(name) {
    pendingName = name;
    pinTitle.textContent = "הקוד של " + name;
    pinInput.value = ""; pinError.hidden = true;
    stepName.hidden = true; stepPin.hidden = false;
    window.setTimeout(function () { pinInput.focus(); }, 50);
  }
  function openSheet() { showNameStep(); sheet.classList.add("open"); }
  function closeSheet() { sheet.classList.remove("open"); }

  function finishIdentify(name, pin) {
    try { localStorage.setItem("cruiseName", name); localStorage.setItem("cruisePin", pin); } catch (e) {}
    renderGreeting(); updateWallLock(); closeSheet(); celebrate(1600); reroll();
  }
  function becomeGuest() {
    try { localStorage.removeItem("cruiseName"); localStorage.removeItem("cruisePin"); } catch (e) {}
    renderGreeting(); updateWallLock(); closeSheet();
  }
  function verifyPin() {
    var name = pendingName, pin = (pinInput.value || "").trim();
    if (!pin) { pinError.textContent = "בלי קוד אין קרוז. הקלד/י משהו."; pinError.hidden = false; return; }
    pinOk.disabled = true;
    api("rpc/verify_member", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ p_name: name, p_pin: pin })
    }).then(function (r) { return r.json(); }).then(function (ok) {
      if (ok === true) { finishIdentify(name, pin); }
      else { pinError.textContent = wrongCodeQuip(name); pinError.hidden = false; }
    }).catch(function () {
      pinError.textContent = "תקלת רשת, נסה/י שוב (זה לא אתה, זה האינטרנט)."; pinError.hidden = false;
    }).then(function () { pinOk.disabled = false; });
  }

  (function buildSheet() {
    CAST.forEach(function (n) {
      var b = document.createElement("button");
      b.className = "name-btn"; b.type = "button"; b.textContent = n;
      b.addEventListener("click", function () { showPinStep(n); });
      nameGrid.appendChild(b);
    });
    var g = document.createElement("button");
    g.className = "name-btn guest"; g.type = "button"; g.textContent = "אני סתם צופה 👀";
    g.addEventListener("click", becomeGuest);
    nameGrid.appendChild(g);
  })();
  document.getElementById("pinBack").addEventListener("click", showNameStep);
  pinOk.addEventListener("click", verifyPin);
  pinInput.addEventListener("keydown", function (e) { if (e.key === "Enter") verifyPin(); });
  greetBtn.addEventListener("click", openSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });

  // ---- כפתורים ----
  document.getElementById("reroll").addEventListener("click", reroll);
  document.getElementById("share").addEventListener("click", function () {
    var d = lastDays === null ? "" : lastDays;
    var text = "🚢 הקרוז הגדול — נשארו " + d + " ימים! ספירה לאחור עם בדיחה יומית: ";
    var url = location.href.split("#")[0];
    if (navigator.share) {
      navigator.share({ title: "הקרוז הגדול", text: text, url: url }).catch(function () {});
    } else {
      window.open("https://wa.me/?text=" + encodeURIComponent(text + url), "_blank");
    }
  });

  // ---- קונפטי ----
  var confettiCanvas = document.querySelector(".confetti");
  var cctx = confettiCanvas.getContext("2d");
  var confs = [], confActive = false, confUntil = 0, cdpr = Math.min(window.devicePixelRatio || 1, 2);
  var CONF_COLORS = ["#ff6e4e", "#ffd23f", "#37c2b4", "#ffffff", "#7fb0ff"];
  function sizeConfetti() {
    confettiCanvas.width = Math.floor(window.innerWidth * cdpr);
    confettiCanvas.height = Math.floor(window.innerHeight * cdpr);
    confettiCanvas.style.width = window.innerWidth + "px";
    confettiCanvas.style.height = window.innerHeight + "px";
  }
  function celebrate(duration) {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    sizeConfetti();
    var W = confettiCanvas.width, N = 130;
    for (var i = 0; i < N; i++) {
      confs.push({
        x: Math.random() * W, y: -Math.random() * confettiCanvas.height * 0.3,
        vx: (Math.random() - 0.5) * 3 * cdpr, vy: (Math.random() * 3 + 2) * cdpr,
        r: (Math.random() * 5 + 3) * cdpr, rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3, color: CONF_COLORS[Math.floor(Math.random() * CONF_COLORS.length)]
      });
    }
    confUntil = performance.now() + (duration || 2000);
    if (!confActive) { confActive = true; requestAnimationFrame(confFrame); }
  }
  function confFrame(t) {
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    for (var i = confs.length - 1; i >= 0; i--) {
      var c = confs[i];
      c.x += c.vx; c.y += c.vy; c.vy += 0.05 * cdpr; c.rot += c.vr;
      cctx.save(); cctx.translate(c.x, c.y); cctx.rotate(c.rot);
      cctx.fillStyle = c.color; cctx.fillRect(-c.r / 2, -c.r / 2, c.r, c.r * 0.6);
      cctx.restore();
      if (c.y > confettiCanvas.height + 20) confs.splice(i, 1);
    }
    if (confs.length > 0 || t < confUntil) { requestAnimationFrame(confFrame); }
    else { confActive = false; cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height); }
  }
  window.addEventListener("resize", sizeConfetti);

  // ---- נצנוצים / כוכבים ----
  (function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var canvas = document.querySelector(".glints");
    var ctx = canvas.getContext("2d");
    var dots = [], W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    function resize() {
      W = canvas.width = Math.floor(window.innerWidth * dpr);
      H = canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + "px"; canvas.style.height = window.innerHeight + "px";
      dots = [];
      var count = Math.round((window.innerWidth * window.innerHeight) / 12000);
      for (var i = 0; i < count; i++) {
        dots.push({ x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.6 + 0.4) * dpr,
          a: Math.random(), s: Math.random() * 0.02 + 0.005 });
      }
    }
    function frame() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < dots.length; i++) {
        var d = dots[i]; d.a += d.s;
        var alpha = (0.2 + Math.abs(Math.sin(d.a)) * 0.6) * starIntensity;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255," + alpha + ")"; ctx.fill();
      }
      requestAnimationFrame(frame);
    }
    window.addEventListener("resize", resize); resize(); requestAnimationFrame(frame);
  })();

  // ---- חברתי (Supabase) ----
  var SUPA_URL = "https://ivyqeerpmaoylcpatgub.supabase.co";
  var SUPA_KEY = "sb_publishable_cZmI5v-A3VTRXPjpvYFIRA_z0RfYsBw";
  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ apikey: SUPA_KEY, Authorization: "Bearer " + SUPA_KEY }, opts.headers || {});
    return fetch(SUPA_URL + "/rest/v1/" + path, opts);
  }

  var hypeBtn = document.getElementById("hypeBtn");
  var hypeCountEl = document.getElementById("hypeCount");
  var wallList = document.getElementById("wallList");
  var wallText = document.getElementById("wallText");
  var wallSend = document.getElementById("wallSend");
  var wallInputRow = document.getElementById("wallInput");
  var wallLoginBtn = document.getElementById("wallLogin");
  var hypeBase = 0, hypePending = 0, flushTimer = null;

  function renderHype() { hypeCountEl.textContent = (hypeBase + hypePending).toLocaleString("he-IL"); }
  function tapHype() {
    hypePending++; renderHype();
    hypeBtn.classList.add("pop");
    window.setTimeout(function () { hypeBtn.classList.remove("pop"); }, 160);
    if (!flushTimer) flushTimer = window.setTimeout(flushHype, 800);
  }
  function flushHype() {
    flushTimer = null;
    var n = hypePending; if (n <= 0) return; hypePending = 0;
    api("rpc/bump_hype", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ n: n }) })
      .then(function (r) { return r.json(); })
      .then(function (v) { if (typeof v === "number") { hypeBase = v; renderHype(); } })
      .catch(function () { hypePending += n; renderHype(); });
  }
  function loadHype() {
    api("hype?select=count&id=eq.1").then(function (r) { return r.json(); })
      .then(function (rows) {
        if (rows && rows[0] && typeof rows[0].count !== "undefined") { hypeBase = Number(rows[0].count); renderHype(); }
      }).catch(function () {});
  }

  function esc(t) { var d = document.createElement("div"); d.textContent = (t == null ? "" : t); return d.innerHTML; }
  function timeAgo(iso) {
    var s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (isNaN(s)) return "";
    if (s < 60) return "עכשיו";
    var m = Math.floor(s / 60); if (m < 60) return "לפני " + m + " ד'";
    var h = Math.floor(m / 60); if (h < 24) return "לפני " + h + " ש'";
    return "לפני " + Math.floor(h / 24) + " י'";
  }
  function loadWall() {
    api("wall?select=name,body,created_at&order=created_at.desc&limit=40").then(function (r) { return r.json(); })
      .then(function (rows) {
        if (!Array.isArray(rows)) return;
        if (rows.length === 0) {
          wallList.innerHTML = "<div class='wall-empty'>עדיין אין הודעות — תהיו הראשונים 🌊</div>";
          return;
        }
        wallList.innerHTML = rows.map(function (m) {
          return "<div class='wall-item'><div><span class='who'>" + esc(m.name || "אנונימי") +
            "</span> <span class='when'>· " + timeAgo(m.created_at) + "</span></div><div class='what'>" +
            esc(m.body) + "</div></div>";
        }).join("");
      }).catch(function () {});
  }
  function updateWallLock() {
    if (!wallText || !wallSend) return;
    var ok = !!(myName() && myPin());
    wallText.disabled = !ok;
    wallSend.disabled = !ok;
    if (wallInputRow) wallInputRow.hidden = !ok;
    if (wallLoginBtn) wallLoginBtn.hidden = ok;
  }
  function sendWall() {
    var t = wallText.value.trim(); if (!t) return;
    var name = myName(), pin = myPin();
    if (!name || !pin) { updateWallLock(); return; }
    wallSend.disabled = true;
    api("rpc/post_to_wall", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ p_name: name, p_pin: pin, p_body: t.slice(0, 200) })
    }).then(function (r) {
      if (r.ok) { wallText.value = ""; loadWall(); celebrate(1200); }
      else { alert("הקוד לא תקין. לחצו על השם למעלה והתחברו מחדש."); }
    }).catch(function () {})
      .then(function () { wallSend.disabled = false; updateWallLock(); });
  }

  if (hypeBtn) {
    document.getElementById("social").hidden = false;
    hypeBtn.addEventListener("click", tapHype);
    if (wallLoginBtn) wallLoginBtn.addEventListener("click", openSheet);
    wallSend.addEventListener("click", sendWall);
    wallText.addEventListener("keydown", function (e) { if (e.key === "Enter") sendWall(); });
    updateWallLock();
    loadHype(); loadWall();
    window.setInterval(function () { loadHype(); loadWall(); }, 6000);
  }

  // ---- הפעלה ----
  applyPhase();
  renderGreeting();
  if (!myName()) { try { if (!localStorage.getItem("cruiseAsked")) { localStorage.setItem("cruiseAsked", "1"); openSheet(); } } catch (e) {} }
  tick();
  updateProgress();
  window.setInterval(tick, 1000);
  window.setInterval(applyPhase, 60000);
  window.setInterval(updateProgress, 60000);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function () {});
    });
  }
</script>
</body>
</html>
