<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ספירה לאחור משותפת לקרוז של 1 באוקטובר 2026, עם בדיחה יומית חדשה לכל מספר ימים שנותר.">
<meta name="theme-color" content="#0e6e7a">
<title>הקרוז הגדול — ספירה לאחור</title>
<style>
  /* ברירת מחדל = יום */
  :root {
    --sky-top: #3aa0e0;
    --sky-mid: #8fd0f0;
    --sky-low: #d6effb;
    --sea-top: #1f9ea0;
    --sea-bot: #0b5a68;
    --orb: #fff3b0;
    --orb-glow: rgba(255, 235, 130, 0.6);
    --accent: #ffd23f;
  }
  :root[data-phase="dawn"] {
    --sky-top: #26305c;
    --sky-mid: #e97d6a;
    --sky-low: #ffc78c;
    --sea-top: #3a7d95;
    --sea-bot: #163a52;
    --orb: #ffdba6;
    --orb-glow: rgba(255, 190, 130, 0.55);
    --accent: #ffb27d;
  }
  :root[data-phase="day"] {
    --sky-top: #3aa0e0;
    --sky-mid: #8fd0f0;
    --sky-low: #d6effb;
    --sea-top: #1f9ea0;
    --sea-bot: #0b5a68;
    --orb: #fff3b0;
    --orb-glow: rgba(255, 235, 130, 0.6);
    --accent: #ffd23f;
  }
  :root[data-phase="sunset"] {
    --sky-top: #2a2a6b;
    --sky-mid: #ff7e5a;
    --sky-low: #ffcf6a;
    --sea-top: #6a4a8a;
    --sea-bot: #241640;
    --orb: #ff9e4a;
    --orb-glow: rgba(255, 140, 70, 0.6);
    --accent: #ff9e4a;
  }
  :root[data-phase="night"] {
    --sky-top: #050a1c;
    --sky-mid: #0f1a3a;
    --sky-low: #1b2b4d;
    --sea-top: #0c2438;
    --sea-bot: #04101c;
    --orb: #eef2fa;
    --orb-glow: rgba(200, 215, 255, 0.4);
    --accent: #7fb0ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Assistant", "Heebo", "Rubik", "Arial Hebrew", -apple-system,
      "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background: var(--sea-bot);
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    direction: rtl;
  }

  .scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: linear-gradient(
      180deg,
      var(--sky-top) 0%,
      var(--sky-mid) 42%,
      var(--sky-low) 57%,
      var(--sea-top) 57.2%,
      var(--sea-bot) 100%
    );
    transition: background 1.2s ease;
  }

  .orb {
    position: absolute;
    top: 16%;
    left: 50%;
    width: min(28vw, 170px);
    height: min(28vw, 170px);
    margin-left: min(-14vw, -85px);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, var(--orb) 0%, var(--orb) 56%, transparent 72%);
    box-shadow: 0 0 90px 26px var(--orb-glow);
    animation: bob 9s ease-in-out infinite;
    transition: background 1.2s ease, box-shadow 1.2s ease;
  }

  .glints { position: absolute; inset: 0; }

  .waves {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -2px;
    width: 100%;
    height: 44vh;
  }
  .wave { position: absolute; left: 0; width: 200%; height: 100%; }
  .wave path { fill: rgba(255, 255, 255, 0.08); }
  .wave.back { animation: drift 15s linear infinite; opacity: 0.5; }
  .wave.front { animation: drift 9s linear infinite reverse; opacity: 0.9; bottom: 0; }
  .wave.front path { fill: rgba(255, 255, 255, 0.13); }

  .ship {
    position: absolute;
    bottom: 29vh;
    right: -80px;
    font-size: clamp(2rem, 6vw, 3.4rem);
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35));
    animation: sail 28s linear infinite, sway 4s ease-in-out infinite;
  }

  .wrap {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1rem, 3.4vh, 2rem);
    padding: clamp(1.5rem, 5vw, 3rem);
    text-align: center;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.55em;
    font-size: clamp(0.72rem, 2.6vw, 0.95rem);
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(8, 16, 26, 0.5);
    padding: 0.5em 1.15em;
    border-radius: 999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.18);
  }

  /* ---- הטיימר ---- */
  .timer {
    display: flex;
    flex-direction: row-reverse;
    justify-content: center;
    align-items: stretch;
    gap: clamp(0.3rem, 1.8vw, 0.9rem);
    background: rgba(8, 16, 26, 0.42);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 24px;
    padding: clamp(0.9rem, 3.4vw, 1.6rem) clamp(0.8rem, 3.2vw, 1.8rem);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 22px 55px -22px rgba(0, 0, 0, 0.6);
  }
  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.4em;
    min-width: clamp(3rem, 17vw, 5.2rem);
    padding: 0 clamp(0.2rem, 1.2vw, 0.6rem);
  }
  .unit + .unit { border-inline-end: 1px solid rgba(255, 255, 255, 0.12); }
  .num {
    font-size: clamp(2.4rem, 12vw, 5rem);
    font-weight: 800;
    line-height: 0.95;
    color: #fff;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    text-shadow: 0 3px 20px rgba(0, 0, 0, 0.45);
  }
  .num.sec { color: var(--accent); transition: color 1.2s ease; }
  .ulabel {
    font-size: clamp(0.62rem, 2.5vw, 0.9rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0.85);
  }

  .subtitle {
    font-size: clamp(1.1rem, 4.6vw, 1.55rem);
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
  }

  .message {
    max-width: 34ch;
    font-size: clamp(1.05rem, 4.3vw, 1.42rem);
    font-weight: 600;
    line-height: 1.55;
    color: #fff;
    background: rgba(8, 16, 26, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 20px;
    padding: clamp(1.2rem, 4.2vw, 1.7rem) clamp(1.3rem, 5vw, 2rem);
    box-shadow: 0 20px 55px -22px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    position: relative;
    transition: opacity 0.4s ease, transform 0.4s ease;
    text-wrap: pretty;
  }
  .message::before {
    content: "😈";
    position: absolute;
    top: -0.72em;
    inset-inline-start: 1.1em;
    font-size: 1.55em;
    filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.4));
  }
  .message.fade { opacity: 0; transform: translateY(8px); }

  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes sail { from { transform: translateX(0); } to { transform: translateX(calc(-100vw - 160px)); } }
  @keyframes sway { 0%, 100% { rotate: -3deg; } 50% { rotate: 3deg; } }

  @media (prefers-reduced-motion: reduce) {
    .orb, .wave, .ship { animation: none !important; }
    .ship { display: none; }
    .scene, .orb, .num.sec { transition: none !important; }
  }
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="orb"></div>
  <canvas class="glints"></canvas>
  <div class="ship">🚢</div>
  <svg class="waves" viewBox="0 0 1440 320" preserveAspectRatio="none">
    <g class="wave back">
      <path d="M0,160 C240,220 480,100 720,140 C960,180 1200,240 1440,170 L1440,320 L0,320 Z"></path>
      <path d="M1440,160 C1680,220 1920,100 2160,140 C2400,180 2640,240 2880,170 L2880,320 L1440,320 Z"></path>
    </g>
    <g class="wave front">
      <path d="M0,210 C200,260 420,180 720,215 C1010,248 1230,290 1440,225 L1440,320 L0,320 Z"></path>
      <path d="M1440,210 C1640,260 1860,180 2160,215 C2450,248 2670,290 2880,225 L2880,320 L1440,320 Z"></path>
    </g>
  </svg>
</div>

<main class="wrap">
  <span class="eyebrow">הקרוז הגדול · 1 באוקטובר 2026</span>

  <div class="timer" id="timer" aria-live="polite">
    <div class="unit"><span class="num" id="days">–</span><span class="ulabel">ימים</span></div>
    <div class="unit"><span class="num" id="hours">–</span><span class="ulabel">שעות</span></div>
    <div class="unit"><span class="num" id="mins">–</span><span class="ulabel">דקות</span></div>
    <div class="unit"><span class="num sec" id="secs">–</span><span class="ulabel">שניות</span></div>
  </div>

  <div class="subtitle" id="subtitle">עד שאנחנו בים 🚢</div>

  <p class="message" id="message">טוען את הבדיחה של היום…</p>
</main>

<script>
  "use strict";

  // ---- יעד: 1 באוקטובר 2026, חצות מקומי (חודשים 0-11, אוקטובר = 9) ----
  var TARGET = new Date(2026, 9, 1, 0, 0, 0);

  // ---- מאגר ההודעות: מפתח = מספר הימים המלאים שנותרו ----
  var MESSAGES = {
    75: "עוד 75 יום. אפילו אלון היה מגיע בזמן אם היו לו 75 ימים התראה. אולי.",
    74: "74 יום. רוית הכינה רשימה, טל כבר הדפיס אותה בשלושה עותקים.",
    73: "73 יום. ירון ראה השבוע בפלורנטין משהו שאי אפשר לתאר כאן. שומרים לקרוז.",
    72: "72 יום = 3 ימים שלמים של אלון מנסה למצוא את הרציף הנכון.",
    71: "71 יום. ערן תרגל 'פוקר פייס' מול המראה. עדיין רואים עליו הכול.",
    70: "70 יום עגולים. טל התרגש כל כך שרוית הרשתה לו הערב לבחור לבד את הגרביים.",
    69: "69 יום 😏. ליאל, אנחנו רואים אותך מסתכל על המספר הזה. טל וערן — שמרו על הפטמות.",
    68: "68 יום. אלכס מדד את גובה תקרת הקבינה. ספוילר: הוא לא נכנס.",
    67: "67 יום. רפאלה סופרת לא את הימים לחופשה, אלא את הימים עד שתהרוג את ליאל.",
    66: "66 יום. אלון קבע ל-65 ויגיע ב-67. איפשהו באמצע יש קרוז.",
    65: "65 יום. טל בנה לו״ז לחופשה עם צבעים. רוית מחקה חצי, כי היא הבוס.",
    64: "64 יום. ערן הבטיח לא לשחק פוקר על כסף החדר. שיקרנו כולנו, בעיקר הוא.",
    63: "63 יום. מישהו נגע לרוית בראש. רגע — לא, זה היה סיוט. אלכס, אל תעז שוב.",
    62: "62 יום. ירון כבר מארז, אלון עדיין מחפש את המזוודה מהחופשה הקודמת.",
    61: "61 יום. ליאל מתאמן על הזחילה השקטה לכיוון הקבינה של טל. הפטמות רועדות.",
    60: "60 יום = שעה שלמה בשניות. גם הזמן שלוקח לטל להסביר את הלו״ז.",
    59: "59 יום. אלון קרא '59' וחשב שזה קו אוטובוס. הוא מאחר גם לזה.",
    58: "58 יום. רפאלה עשתה ביטוח חיים. הנהנה: לא ליאל.",
    57: "57 יום. ערן: 'אני אשן מוקדם בקרוז'. כולם צוחקים. פוקר עד 4 לפנות בוקר.",
    56: "56 יום. אלכס כל כך גבוה שהוא כבר רואה את היעד מהמרפסת. כנראה.",
    55: "55 יום, זוג חמישיות. כמו אלון וירון בחדר — זוג, אבל לא זוג. פלורנטין מתגעגע.",
    54: "54 יום. טל שלח כבר 3 קבוצות וואטסאפ עם 'עדכון חשוב'. אף אחד לא קרא.",
    53: "53 יום. ליאל קנה כפפות. לא שאלנו למה. טל, נעל את הדלת.",
    52: "52 שבועות בשנה, ו-52 ימים עד שערן ינקה אותנו בפוקר.",
    51: "51 יום. רוית עשתה תספורת. מי שנוגע — שוחה עם הכרישים.",
    50: "חצי הדרך! 50 יום. אלון בטוח שנשארו 3 שבועות. תנו לו לחלום.",
    49: "49 יום. ירון ראה בפלורנטין תלבושת שתהיה מושלמת לערב הגאלה בקרוז.",
    48: "48 יום. טל התחיל לארוז. את המזוודה של רוית וליה. שלו? עדיין לא הרשו לו.",
    47: "47 יום. ערן הפסיד בפוקר של אתמול. שילם בפטמות של ליאל. סחר הוגן.",
    46: "46 יום. אלכס מדד את דלת הקבינה, את המיטה ואת התקרה. הכול נמוך ממנו.",

    41: "41 יום. ירון מספר סיפורים מפלורנטין. חצי מהחדר מסמיק, החצי השני רושם.",
    40: "40 יום במדבר, 40 יום עד הקרוז. משה לפחות ידע לאן הולך, לא כמו אלון.",
    39: "39 יום. ליאל ליטש את הטכניקה. טל וערן ישנים עם שריון על החזה.",

    37: "37 יום. אלכס שוב כמעט נגע לרוית בראש מתוך הרגל. רוית כבר מחזיקה מחבט.",

    33: "33 יום. ירון: 'ראיתי בפלורנטין דבר שיכניס את הקרוז הזה לבושה'. מסקרן.",
    32: "32 שיניים, ו-32 ימים עד שערן יחייך את חיוך ה-'קיבלתי פלאש רויאל'.",

    29: "29 יום. ליאל קנה שמן תינוקות. לא לתינוקות. טל, אתה יודע למה.",

    9: "9 ימים. ליאל תרגל, טל בכה, ערן צחק — ואז גם הוא הבין שהוא ברשימה.",
    8: "8 ימים, סימן אינסוף ששכב לנוח. בדיוק כמו אלון בכל בוקר של הטיול.",
    7: "7 ימים, שבוע! מזל. רוית מזהירה: מי שנוגע בראש שלה בקרוז — שוחה הביתה.",
    6: "6 ימים. אלון קבע להתעורר ב-6, יתעורר ב-9, יגיע לרציף ב-11. הספינה ב-10.",
    5: "5 ימים, אצבעות של יד. אותה יד שליאל מחמם לטל וערן. הם ספרו. פחדו.",
    4: "4 ימים. טל בדק את הלו״ז 400 פעם. רוית שינתה אותו 401. הבוס ניצח.",
    3: "3 ימים!! ערן כבר לא ישן מרוב פוקר דמיוני, אלכס כבר לא נכנס בדלת מרוב התרגשות.",
    2: "יומיים!! ליאל מחדד ציפורניים, טל וערן שוקלים ברצינות מגן חזה, רפאלה מתפללת.",
    1: "עוד יום אחד!! אלון עכשיו מתחיל לארוז. יש 40% סיכוי שהוא בכלל יגיע לשדה.",
    0: "היום טסים!! ✈️🚢 אלון — קום עכשיו. טל — נשום. רוית — שמרי על הראש. ערן — קלפים בכיס. ליאל — ידיים לעצמך (בינתיים). רפאלה — את גיבורה. שנצא לדרך!"
  };

  function fallback(d) {
    return "עוד " + d + " יום. כל כך הרבה זמן שאפילו אלון עדיין לא התחיל לחשוב לאחר. תחזרו לספור בקרוב 🍹";
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  var dEl = document.getElementById("days");
  var hEl = document.getElementById("hours");
  var mEl = document.getElementById("mins");
  var sEl = document.getElementById("secs");
  var subEl = document.getElementById("subtitle");
  var msgEl = document.getElementById("message");
  var lastDays = null;
  var departed = false;

  function updateMessage(days) {
    var text = MESSAGES[days] || fallback(days);
    msgEl.classList.add("fade");
    window.setTimeout(function () {
      msgEl.textContent = text;
      msgEl.classList.remove("fade");
    }, 200);
  }

  function tick() {
    var ms = TARGET - new Date();

    if (ms <= 0) {
      dEl.textContent = "0";
      hEl.textContent = "00";
      mEl.textContent = "00";
      sEl.textContent = "00";
      subEl.textContent = "אנחנו כבר בים! 🚢";
      if (!departed) {
        departed = true;
        msgEl.textContent = "הקרוז יצא לדרך! אם אתם קוראים את זה מהמרפסת של הספינה — תשתו משהו, מגיע לכם. ליאל, ידיים לעצמך.";
      }
      return;
    }

    var totalSec = Math.floor(ms / 1000);
    var days = Math.floor(totalSec / 86400);
    var hours = Math.floor((totalSec % 86400) / 3600);
    var mins = Math.floor((totalSec % 3600) / 60);
    var secs = totalSec % 60;

    dEl.textContent = days;
    hEl.textContent = pad(hours);
    mEl.textContent = pad(mins);
    sEl.textContent = pad(secs);

    if (days !== lastDays) {
      lastDays = days;
      subEl.textContent = days === 0 ? "היום זה קורה ✈️" : "עד שאנחנו בים 🚢";
      updateMessage(days);
    }
  }

  // ---- מראה לפי שעה ביום ----
  var starIntensity = 0.15;
  function applyPhase() {
    var h = new Date().getHours();
    var phase;
    if (h >= 5 && h < 7) phase = "dawn";
    else if (h >= 7 && h < 17) phase = "day";
    else if (h >= 17 && h < 20) phase = "sunset";
    else phase = "night";
    document.documentElement.setAttribute("data-phase", phase);
    starIntensity = phase === "night" ? 1 : (phase === "day" ? 0.12 : 0.5);
  }

  applyPhase();
  tick();
  window.setInterval(tick, 1000);
  window.setInterval(applyPhase, 60000);

  // ---- כוכבים / נצנוצים (עוצמה משתנה לפי שעה, מכבד reduced-motion) ----
  (function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var canvas = document.querySelector(".glints");
    var ctx = canvas.getContext("2d");
    var dots = [];
    var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      W = canvas.width = Math.floor(window.innerWidth * dpr);
      H = canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      dots = [];
      var count = Math.round((window.innerWidth * window.innerHeight) / 12000);
      for (var i = 0; i < count; i++) {
        dots.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: (Math.random() * 1.6 + 0.4) * dpr,
          a: Math.random(),
          s: Math.random() * 0.02 + 0.005
        });
      }
    }

    function frame() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < dots.length; i++) {
        var d = dots[i];
        d.a += d.s;
        var alpha = (0.2 + Math.abs(Math.sin(d.a)) * 0.6) * starIntensity;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255," + alpha + ")";
        ctx.fill();
      }
      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(frame);
  })();
</script>
