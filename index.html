<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ספירה לאחור משותפת לקרוז של 1 באוקטובר 2026, עם בדיחה יומית חדשה לכל מספר ימים שנותר.">
<meta name="theme-color" content="#0e6e7a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#071019" media="(prefers-color-scheme: dark)">
<title>הקרוז הגדול — ספירה לאחור</title>
<style>
  :root {
    --sky-top: #7ec8e3;
    --sky-mid: #ffd8a8;
    --sky-low: #ffb08a;
    --sea-top: #2a9d9a;
    --sea-bot: #0e6e7a;
    --ink: #093040;
    --ink-soft: #0e4257;
    --paper: #fdf4e9;
    --card: rgba(255, 253, 248, 0.72);
    --card-border: rgba(9, 48, 64, 0.14);
    --coral: #ff6e4e;
    --gold: #f7a41c;
    --sun: #ffd23f;
    --sun-glow: rgba(255, 210, 63, 0.55);
    --eyebrow: #0e6e7a;
    --shadow: rgba(9, 48, 64, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sky-top: #0a1836;
      --sky-mid: #24325f;
      --sky-low: #6b3b6e;
      --sea-top: #0c2c40;
      --sea-bot: #061722;
      --ink: #f2e9dc;
      --ink-soft: #cdd9df;
      --paper: #071019;
      --card: rgba(12, 30, 44, 0.55);
      --card-border: rgba(242, 233, 220, 0.16);
      --coral: #ff7d5c;
      --gold: #ffc24b;
      --sun: #ffd76b;
      --sun-glow: rgba(255, 200, 90, 0.4);
      --eyebrow: #58c7c0;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="light"] {
    --sky-top: #7ec8e3;
    --sky-mid: #ffd8a8;
    --sky-low: #ffb08a;
    --sea-top: #2a9d9a;
    --sea-bot: #0e6e7a;
    --ink: #093040;
    --ink-soft: #0e4257;
    --paper: #fdf4e9;
    --card: rgba(255, 253, 248, 0.72);
    --card-border: rgba(9, 48, 64, 0.14);
    --coral: #ff6e4e;
    --gold: #f7a41c;
    --sun: #ffd23f;
    --sun-glow: rgba(255, 210, 63, 0.55);
    --eyebrow: #0e6e7a;
    --shadow: rgba(9, 48, 64, 0.18);
  }
  :root[data-theme="dark"] {
    --sky-top: #0a1836;
    --sky-mid: #24325f;
    --sky-low: #6b3b6e;
    --sea-top: #0c2c40;
    --sea-bot: #061722;
    --ink: #f2e9dc;
    --ink-soft: #cdd9df;
    --paper: #071019;
    --card: rgba(12, 30, 44, 0.55);
    --card-border: rgba(242, 233, 220, 0.16);
    --coral: #ff7d5c;
    --gold: #ffc24b;
    --sun: #ffd76b;
    --sun-glow: rgba(255, 200, 90, 0.4);
    --eyebrow: #58c7c0;
    --shadow: rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Assistant", "Heebo", "Rubik", "Arial Hebrew", -apple-system,
      "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    direction: rtl;
  }

  .scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: linear-gradient(
      180deg,
      var(--sky-top) 0%,
      var(--sky-mid) 42%,
      var(--sky-low) 58%,
      var(--sea-top) 58.2%,
      var(--sea-bot) 100%
    );
    transition: background 0.6s ease;
  }

  .sun {
    position: absolute;
    top: 20%;
    left: 50%;
    width: min(30vw, 190px);
    height: min(30vw, 190px);
    margin-left: min(-15vw, -95px);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, var(--sun) 0%, var(--sun) 55%, transparent 72%);
    box-shadow: 0 0 90px 30px var(--sun-glow);
    animation: bob 9s ease-in-out infinite;
  }

  .glints { position: absolute; inset: 0; }

  .waves {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -2px;
    width: 100%;
    height: 46vh;
  }
  .wave {
    position: absolute;
    left: 0;
    width: 200%;
    height: 100%;
  }
  .wave path { fill: rgba(255, 255, 255, 0.08); }
  .wave.back { animation: drift 15s linear infinite; opacity: 0.5; }
  .wave.front { animation: drift 9s linear infinite reverse; opacity: 0.9; bottom: 0; }
  .wave.front path { fill: rgba(255, 255, 255, 0.12); }

  .ship {
    position: absolute;
    bottom: 30vh;
    right: -80px;
    font-size: clamp(2rem, 6vw, 3.4rem);
    filter: drop-shadow(0 6px 10px var(--shadow));
    animation: sail 26s linear infinite, sway 4s ease-in-out infinite;
  }

  .wrap {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(0.9rem, 3.2vh, 2rem);
    padding: clamp(1.5rem, 5vw, 3rem);
    text-align: center;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.55em;
    font-size: clamp(0.72rem, 2.6vw, 0.95rem);
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #fff;
    background: color-mix(in srgb, var(--ink) 55%, transparent);
    padding: 0.5em 1.1em;
    border-radius: 999px;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .countbox { display: flex; flex-direction: column; align-items: center; line-height: 0.85; }

  .count {
    font-size: clamp(6.5rem, 34vw, 20rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    color: var(--paper);
    text-shadow: 0 6px 40px var(--shadow), 0 2px 0 rgba(0, 0, 0, 0.06);
    background: linear-gradient(180deg, #fffef9 0%, var(--sun) 130%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .count.pulse { animation: pop 0.6s cubic-bezier(0.16, 1, 0.3, 1); }

  .count-label {
    font-size: clamp(1.05rem, 4.2vw, 1.6rem);
    font-weight: 700;
    color: var(--paper);
    text-shadow: 0 2px 14px var(--shadow);
    margin-top: 0.35em;
  }

  .message {
    max-width: 34ch;
    font-size: clamp(1.05rem, 4.3vw, 1.45rem);
    font-weight: 600;
    line-height: 1.5;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: clamp(1.1rem, 4vw, 1.6rem) clamp(1.3rem, 5vw, 2rem);
    box-shadow: 0 18px 50px -20px var(--shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: relative;
    transition: opacity 0.4s ease, transform 0.4s ease;
    text-wrap: pretty;
  }
  .message::before {
    content: "😈";
    position: absolute;
    top: -0.7em;
    inset-inline-start: 1.1em;
    font-size: 1.6em;
    filter: drop-shadow(0 3px 6px var(--shadow));
  }
  .message.fade { opacity: 0; transform: translateY(8px); }

  .foot {
    display: flex;
    align-items: center;
    gap: 0.5em;
    font-size: clamp(0.72rem, 2.6vw, 0.85rem);
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--paper);
    opacity: 0.85;
    text-shadow: 0 1px 8px var(--shadow);
  }

  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes sail { from { transform: translateX(0); } to { transform: translateX(calc(-100vw - 160px)); } }
  @keyframes sway { 0%, 100% { rotate: -3deg; } 50% { rotate: 3deg; } }
  @keyframes pop { 0% { transform: scale(0.86); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }

  @media (prefers-reduced-motion: reduce) {
    .sun, .wave, .ship, .count, .message { animation: none !important; transition: none !important; }
    .ship { display: none; }
  }
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="sun"></div>
  <canvas class="glints"></canvas>
  <div class="ship">🚢</div>
  <svg class="waves" viewBox="0 0 1440 320" preserveAspectRatio="none">
    <g class="wave back">
      <path d="M0,160 C240,220 480,100 720,140 C960,180 1200,240 1440,170 L1440,320 L0,320 Z"></path>
      <path d="M1440,160 C1680,220 1920,100 2160,140 C2400,180 2640,240 2880,170 L2880,320 L1440,320 Z" transform="translate(0,0)"></path>
    </g>
    <g class="wave front">
      <path d="M0,210 C200,260 420,180 720,215 C1010,248 1230,290 1440,225 L1440,320 L0,320 Z"></path>
      <path d="M1440,210 C1640,260 1860,180 2160,215 C2450,248 2670,290 2880,225 L2880,320 L1440,320 Z"></path>
    </g>
  </svg>
</div>

<main class="wrap">
  <span class="eyebrow">הקרוז הגדול · 1 באוקטובר 2026</span>

  <div class="countbox">
    <div class="count" id="count" aria-live="polite">–</div>
    <div class="count-label" id="label">ימים עד שאנחנו בים</div>
  </div>

  <p class="message" id="message">טוען את הבדיחה של היום…</p>

  <div class="foot">✈️ 16 נוסעים · ספירה משותפת · תרעננו כל בוקר 🍹</div>
</main>

<script>
  "use strict";

  // ---- יעד: 1 באוקטובר 2026, חצות מקומי (חודשים 0-11, אוקטובר = 9) ----
  var TARGET = new Date(2026, 9, 1);

  function daysLeft() {
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((TARGET - today) / 86400000);
  }

  // ---- מאגר ההודעות: מפתח = מספר הימים שנותרו ----
  var MESSAGES = {
    75: "עוד 75 יום. אפילו אלון היה מגיע בזמן אם היו לו 75 ימים התראה. אולי.",
    74: "74 יום. רוית הכינה רשימה, טל כבר הדפיס אותה בשלושה עותקים.",
    73: "73 יום. ירון ראה השבוע בפלורנטין משהו שאי אפשר לתאר כאן. שומרים לקרוז.",
    72: "72 יום = 3 ימים שלמים של אלון מנסה למצוא את הרציף הנכון.",
    71: "71 יום. ערן תרגל 'פוקר פייס' מול המראה. עדיין רואים עליו הכול.",
    70: "70 יום עגולים. טל התרגש כל כך שרוית הרשתה לו הערב לבחור לבד את הגרביים.",
    69: "69 יום 😏. ליאל, אנחנו רואים אותך מסתכל על המספר הזה. טל וערן — שמרו על הפטמות.",
    68: "68 יום. אלכס מדד את גובה תקרת הקבינה. ספוילר: הוא לא נכנס.",
    67: "67 יום. רפאלה סופרת לא את הימים לחופשה, אלא את הימים עד שתהרוג את ליאל.",
    66: "66 יום. אלון קבע ל-65 ויגיע ב-67. איפשהו באמצע יש קרוז.",
    65: "65 יום. טל בנה לו״ז לחופשה עם צבעים. רוית מחקה חצי, כי היא הבוס.",
    64: "64 יום. ערן הבטיח לא לשחק פוקר על כסף החדר. שיקרנו כולנו, בעיקר הוא.",
    63: "63 יום. מישהו נגע לרוית בראש. רגע — לא, זה היה סיוט. אלכס, אל תעז שוב.",
    62: "62 יום. ירון כבר מארז, אלון עדיין מחפש את המזוודה מהחופשה הקודמת.",
    61: "61 יום. ליאל מתאמן על הזחילה השקטה לכיוון הקבינה של טל. הפטמות רועדות.",
    60: "60 יום = שעה שלמה בשניות. גם הזמן שלוקח לטל להסביר את הלו״ז.",
    59: "59 יום. אלון קרא '59' וחשב שזה קו אוטובוס. הוא מאחר גם לזה.",
    58: "58 יום. רפאלה עשתה ביטוח חיים. הנהנה: לא ליאל.",
    57: "57 יום. ערן: 'אני אשן מוקדם בקרוז'. כולם צוחקים. פוקר עד 4 לפנות בוקר.",
    56: "56 יום. אלכס כל כך גבוה שהוא כבר רואה את היעד מהמרפסת. כנראה.",
    55: "55 יום, זוג חמישיות. כמו אלון וירון בחדר — זוג, אבל לא זוג. פלורנטין מתגעגע.",
    54: "54 יום. טל שלח כבר 3 קבוצות וואטסאפ עם 'עדכון חשוב'. אף אחד לא קרא.",
    53: "53 יום. ליאל קנה כפפות. לא שאלנו למה. טל, נעל את הדלת.",
    52: "52 שבועות בשנה, ו-52 ימים עד שערן ינקה אותנו בפוקר.",
    51: "51 יום. רוית עשתה תספורת. מי שנוגע — שוחה עם הכרישים.",
    50: "חצי הדרך! 50 יום. אלון בטוח שנשארו 3 שבועות. תנו לו לחלום.",
    49: "49 יום. ירון ראה בפלורנטין תלבושת שתהיה מושלמת לערב הגאלה בקרוז.",
    48: "48 יום. טל התחיל לארוז. את המזוודה של רוית וליה. שלו? עדיין לא הרשו לו.",
    47: "47 יום. ערן הפסיד בפוקר של אתמול. שילם בפטמות של ליאל. סחר הוגן.",
    46: "46 יום. אלכס מדד את דלת הקבינה, את המיטה ואת התקרה. הכול נמוך ממנו.",
    45: "45 יום. רפאלה קנתה אטמי אוזניים. לא בגלל הים. בגלל ליאל.",
    44: "44 יום. אלון קבע פגישה ל-9:00 והגיע ב-11:00. עדיין גאה שהגיע.",
    43: "43 יום. טל: 'סידרתי לכולנו מקומות ליד'. רוית: 'ביטלתי, אני ליד החלון'.",
    42: "42 — התשובה לחיים, ליקום ולכל השאר. גם לשאלה 'כמה עוד עד הקרוז'.",
    41: "41 יום. ירון מספר סיפורים מפלורנטין. חצי מהחדר מסמיק, החצי השני רושם.",
    40: "40 יום במדבר, 40 יום עד הקרוז. משה לפחות ידע לאן הולך, לא כמו אלון.",
    39: "39 יום. ליאל ליטש את הטכניקה. טל וערן ישנים עם שריון על החזה.",
    38: "38 יום. ערן הימר שיגיע ראשון לבופה. את ההימור הזה הוא תמיד מנצח.",
    37: "37 יום. אלכס שוב כמעט נגע לרוית בראש מתוך הרגל. רוית כבר מחזיקה מחבט.",
    36: "36 יום. טל הכין אקסל של החופשה. יש בו טאב בשם 'רוית לא צריכה לדעת'.",
    35: "35 יום. אלון עדכן שהוא 'בדרך'. הוא עוד לא יצא מהבית. קלאסי.",
    34: "34 יום. רפאלה מתרגלת נשימות. המטפל אמר שזה יעזור לחיות עם ליאל.",
    33: "33 יום. ירון: 'ראיתי בפלורנטין דבר שיכניס את הקרוז הזה לבושה'. מסקרן.",
    32: "32 שיניים, ו-32 ימים עד שערן יחייך את חיוך ה-'קיבלתי פלאש רויאל'.",
    31: "31 יום. טל שלח לו״ז מעודכן. גרסה 14. רוית עדיין תשנה הכול בסוף.",
    30: "חודש! 30 יום. אלון בטוח שיש עוד המון זמן. יארוז בלילה שלפני. בבוקר.",
    29: "29 יום. ליאל קנה שמן תינוקות. לא לתינוקות. טל, אתה יודע למה.",
    28: "28 יום = מחזור ירח שלם. גם הזמן שלוקח לאלון להגיע לפגישה של רבע שעה.",
    27: "27 יום. ערן טוען שהוא 'לא מכור לפוקר'. שיחק אתמול 6 שעות ברצף.",
    26: "26 יום. אלכס קנה כובע. עכשיו הוא גבוה מהמעלית. יעלה במדרגות.",
    25: "25 יום, רבע מאה. רוית עשתה טיפול פנים. מותר להסתכל, אסור לגעת בראש.",
    24: "24 יום. ירון ואלון חולקים חדר. ירון ישן. אלון עוד מחפש את החדר.",
    23: "23 יום. טל התחיל ספירה לאחור משלו. הוא לא יודע שכבר יש את הדף הזה.",
    22: "22 יום. רפאלה חתמה על הסכם: אם ליאל שורד את הקרוז, זה נס.",
    21: "21 — גיל השתייה, וגם בלאק ג'ק. ערן כבר מלטש קלפים. 21 ימים לבִּזה.",
    20: "20 יום. אלון קרא '20' וחשב 'יופי, עוד חודשיים'. אלון, לא. פחות.",
    19: "19 יום. ליאל התחיל חימום ידיים. טל וערן התחילו לישון בתורנות.",
    18: "ח״י — 18 יום! לחיים. אלון עוד לא חי, הוא עדיין מחפש דרכון.",
    17: "17 יום. אלכס נגע במשהו עגול וחלק. זה לא היה כדור. רוית רודפת אחריו.",
    16: "16 יום, בדיוק כמספר הנוסעים בטיול. אחד מהם (אלון) עדיין יאחר.",
    15: "15 יום. טל הדפיס את הכרטיסים. ואת הגיבוי. ואת הגיבוי לגיבוי. רוית זרקה שניים.",
    14: "שבועיים! 14 יום. ערן מארגן טורניר פוקר בקרוז. הפרס: הפטמות של ליאל, שוב.",
    13: "13 יום, בר מצווה של הספירה. אלון עדיין לא בטוח באיזה נמל עולים.",
    12: "12 יום. רפאלה ארזה מזוודה לבגדים ואחת לסבלנות מול ליאל. השנייה קטנה.",
    11: "11 יום. ירון הבטיח סיפור מפלורנטין לכל ערב בקרוז. הזמנו כיסאות.",
    10: "ספרה כפולה אחרונה — 10 ימים! אלכס מתכופף בכניסה. עדיין נתקע.",
    9: "9 ימים. ליאל תרגל, טל בכה, ערן צחק — ואז גם הוא הבין שהוא ברשימה.",
    8: "8 ימים, סימן אינסוף ששכב לנוח. בדיוק כמו אלון בכל בוקר של הטיול.",
    7: "7 ימים, שבוע! מזל. רוית מזהירה: מי שנוגע בראש שלה בקרוז — שוחה הביתה.",
    6: "6 ימים. אלון קבע להתעורר ב-6, יתעורר ב-9, יגיע לרציף ב-11. הספינה ב-10.",
    5: "5 ימים, אצבעות של יד. אותה יד שליאל מחמם לטל וערן. הם ספרו. פחדו.",
    4: "4 ימים. טל בדק את הלו״ז 400 פעם. רוית שינתה אותו 401. הבוס ניצח.",
    3: "3 ימים!! ערן כבר לא ישן מרוב פוקר דמיוני, אלכס כבר לא נכנס בדלת מרוב התרגשות.",
    2: "יומיים!! ליאל מחדד ציפורניים, טל וערן שוקלים ברצינות מגן חזה, רפאלה מתפללת.",
    1: "עוד יום אחד!! אלון עכשיו מתחיל לארוז. יש 40% סיכוי שהוא בכלל יגיע לשדה.",
    0: "היום טסים!! ✈️🚢 אלון — קום עכשיו. טל — נשום. רוית — שמרי על הראש. ערן — קלפים בכיס. ליאל — ידיים לעצמך (בינתיים). רפאלה — את גיבורה. שנצא לדרך!"
  };

  function fallback(d) {
    return "עוד " + d + " יום. כל כך הרבה זמן שאפילו אלון עדיין לא התחיל לחשוב לאחר. תחזרו לספור בקרוב 🍹";
  }

  var countEl = document.getElementById("count");
  var labelEl = document.getElementById("label");
  var msgEl = document.getElementById("message");
  var lastRendered = null;

  function render() {
    var d = daysLeft();
    if (d === lastRendered) return;
    lastRendered = d;

    var num, label, text;
    if (d < 0) {
      num = "🚢";
      label = "אנחנו כבר בים!";
      text = "הקרוז יצא לדרך. אם אתם קוראים את זה מהמרפסת של הספינה — תשתו משהו, מגיע לכם. ליאל, ידיים לעצמך.";
    } else if (d === 0) {
      num = "0";
      label = "היום זה קורה ✈️";
      text = MESSAGES[0];
    } else {
      num = String(d);
      label = "ימים עד שאנחנו בים";
      text = MESSAGES[d] || fallback(d);
    }

    // אנימציית החלפת הודעה
    msgEl.classList.add("fade");
    countEl.classList.remove("pulse");
    // trigger reflow so the pulse can replay
    void countEl.offsetWidth;
    countEl.classList.add("pulse");

    window.setTimeout(function () {
      countEl.textContent = num;
      labelEl.textContent = label;
      msgEl.textContent = text;
      msgEl.classList.remove("fade");
    }, 220);
  }

  render();
  // רענון תקופתי — כדי שהמספר יתעדכן אם משאירים את הדף פתוח מעבר לחצות
  window.setInterval(render, 60000);

  // ---- נצנוצים על הים / כוכבים (עדין, מכבד reduced-motion) ----
  (function () {
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    var canvas = document.querySelector(".glints");
    var ctx = canvas.getContext("2d");
    var dots = [];
    var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      W = canvas.width = Math.floor(window.innerWidth * dpr);
      H = canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      dots = [];
      var count = Math.round((window.innerWidth * window.innerHeight) / 14000);
      for (var i = 0; i < count; i++) {
        dots.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: (Math.random() * 1.6 + 0.4) * dpr,
          a: Math.random(),
          s: Math.random() * 0.02 + 0.005
        });
      }
    }

    function frame() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < dots.length; i++) {
        var d = dots[i];
        d.a += d.s;
        var alpha = 0.25 + Math.abs(Math.sin(d.a)) * 0.55;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255," + alpha + ")";
        ctx.fill();
      }
      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(frame);
  })();
</script>
