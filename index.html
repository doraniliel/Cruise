<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ספירה לאחור משותפת לקרוז של 1 באוקטובר 2026, עם בדיחה יומית חדשה לכל מספר ימים שנותר.">
<meta name="theme-color" content="#0e6e7a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הקרוז">
<title>הקרוז הגדול — ספירה לאחור</title>
<style>
  /* ברירת מחדל = יום */
  :root {
    --sky-top: #3aa0e0;
    --sky-mid: #8fd0f0;
    --sky-low: #d6effb;
    --sea-top: #1f9ea0;
    --sea-bot: #0b5a68;
    --orb: #fff3b0;
    --orb-glow: rgba(255, 235, 130, 0.6);
    --accent: #ffd23f;
  }
  :root[data-phase="dawn"] {
    --sky-top: #26305c; --sky-mid: #e97d6a; --sky-low: #ffc78c;
    --sea-top: #3a7d95; --sea-bot: #163a52;
    --orb: #ffdba6; --orb-glow: rgba(255, 190, 130, 0.55); --accent: #ffb27d;
  }
  :root[data-phase="day"] {
    --sky-top: #3aa0e0; --sky-mid: #8fd0f0; --sky-low: #d6effb;
    --sea-top: #1f9ea0; --sea-bot: #0b5a68;
    --orb: #fff3b0; --orb-glow: rgba(255, 235, 130, 0.6); --accent: #ffd23f;
  }
  :root[data-phase="sunset"] {
    --sky-top: #2a2a6b; --sky-mid: #ff7e5a; --sky-low: #ffcf6a;
    --sea-top: #6a4a8a; --sea-bot: #241640;
    --orb: #ff9e4a; --orb-glow: rgba(255, 140, 70, 0.6); --accent: #ff9e4a;
  }
  :root[data-phase="night"] {
    --sky-top: #050a1c; --sky-mid: #0f1a3a; --sky-low: #1b2b4d;
    --sea-top: #0c2438; --sea-bot: #04101c;
    --orb: #eef2fa; --orb-glow: rgba(200, 215, 255, 0.4); --accent: #7fb0ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }

  body {
    font-family: "Assistant", "Heebo", "Rubik", "Arial Hebrew", -apple-system,
      "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background: var(--sea-bot);
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    direction: rtl;
  }

  .scene {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: linear-gradient(180deg,
      var(--sky-top) 0%, var(--sky-mid) 42%, var(--sky-low) 57%,
      var(--sea-top) 57.2%, var(--sea-bot) 100%);
    transition: background 1.2s ease;
  }
  .orb {
    position: absolute; top: 16%; left: 50%;
    width: min(28vw, 170px); height: min(28vw, 170px); margin-left: min(-14vw, -85px);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, var(--orb) 0%, var(--orb) 56%, transparent 72%);
    box-shadow: 0 0 90px 26px var(--orb-glow);
    animation: bob 9s ease-in-out infinite;
    transition: background 1.2s ease, box-shadow 1.2s ease;
  }
  .glints { position: absolute; inset: 0; }
  .waves { position: absolute; left: 0; right: 0; bottom: -2px; width: 100%; height: 44vh; }
  .wave { position: absolute; left: 0; width: 200%; height: 100%; }
  .wave path { fill: rgba(255, 255, 255, 0.08); }
  .wave.back { animation: drift 15s linear infinite; opacity: 0.5; }
  .wave.front { animation: drift 9s linear infinite reverse; opacity: 0.9; bottom: 0; }
  .wave.front path { fill: rgba(255, 255, 255, 0.13); }
  .ship {
    position: absolute; bottom: 29vh; right: -80px;
    font-size: clamp(2rem, 6vw, 3.4rem);
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35));
    animation: sail 28s linear infinite, sway 4s ease-in-out infinite;
  }

  .confetti { position: fixed; inset: 0; z-index: 40; pointer-events: none; }

  .bell {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); inset-inline-start: 12px; z-index: 30;
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(8, 16, 26, 0.6); color: #fff; font-size: 1.35rem; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
  }
  .bell-badge {
    position: absolute; top: -2px; inset-inline-end: -2px; min-width: 18px; height: 18px; padding: 0 4px;
    border-radius: 999px; background: #ff4d4f; color: #fff; font-size: 0.68rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .notif-panel {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 62px); inset-inline-start: 12px; z-index: 30;
    width: min(88vw, 22rem); max-height: 60vh; overflow-y: auto;
    background: rgba(12, 24, 38, 0.96); border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 16px; padding: 0.6rem; box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.6);
    display: flex; flex-direction: column; gap: 0.4rem;
  }
  .notif-item { text-align: right; background: rgba(255, 255, 255, 0.06); border-radius: 10px; padding: 0.5em 0.7em; cursor: pointer; }
  .notif-item .who { font-weight: 700; color: var(--accent); font-size: 0.85rem; }
  .notif-item .when { font-size: 0.68rem; opacity: 0.55; }
  .notif-item .rbody { font-size: 0.9rem; line-height: 1.35; margin-top: 0.1em; word-break: break-word; }
  .notif-empty { text-align: center; opacity: 0.6; font-size: 0.9rem; padding: 0.8rem; }

  .wrap {
    position: relative; z-index: 2; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(0.85rem, 3vh, 1.7rem);
    padding: clamp(1.5rem, 5vw, 3rem);
    text-align: center;
  }

  .greet {
    display: inline-flex; align-items: center; gap: 0.5em;
    font-size: clamp(0.72rem, 2.6vw, 0.92rem); font-weight: 700;
    color: #fff; background: rgba(8, 16, 26, 0.5);
    padding: 0.45em 1.05em; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    cursor: pointer; transition: transform 0.15s ease;
  }
  .greet:hover { transform: translateY(-1px); }
  .greet .edit { opacity: 0.6; font-weight: 600; }

  .eyebrow {
    font-size: clamp(0.72rem, 2.6vw, 0.95rem); font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase; color: #fff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  }

  .timer {
    display: flex; flex-direction: row-reverse; justify-content: center; align-items: stretch;
    gap: clamp(0.3rem, 1.8vw, 0.9rem);
    background: rgba(8, 16, 26, 0.42);
    border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 24px;
    padding: clamp(0.9rem, 3.4vw, 1.6rem) clamp(0.8rem, 3.2vw, 1.8rem);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 22px 55px -22px rgba(0, 0, 0, 0.6);
  }
  .unit {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.4em; min-width: clamp(3rem, 17vw, 5.2rem); padding: 0 clamp(0.2rem, 1.2vw, 0.6rem);
  }
  .unit + .unit { border-inline-end: 1px solid rgba(255, 255, 255, 0.12); }
  .num {
    font-size: clamp(2.4rem, 12vw, 5rem); font-weight: 800; line-height: 0.95; color: #fff;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    text-shadow: 0 3px 20px rgba(0, 0, 0, 0.45);
  }
  .num.sec { color: var(--accent); transition: color 1.2s ease; }
  .ulabel {
    font-size: clamp(0.62rem, 2.5vw, 0.9rem); font-weight: 700;
    letter-spacing: 0.08em; color: rgba(255, 255, 255, 0.85);
  }

  .subtitle {
    font-size: clamp(1.1rem, 4.6vw, 1.55rem); font-weight: 700; color: #fff;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
  }

  .progress {
    width: min(90vw, 30rem); display: flex; flex-direction: column; gap: 0.5em;
  }
  .progress .track {
    height: 10px; border-radius: 999px; overflow: hidden;
    background: rgba(8, 16, 26, 0.45); border: 1px solid rgba(255, 255, 255, 0.16);
  }
  .progress .fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), #ffffff);
    border-radius: 999px; transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .progress .plabel {
    font-size: clamp(0.7rem, 2.6vw, 0.85rem); font-weight: 600; color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
  }

  .message {
    max-width: 34ch; font-size: clamp(1.05rem, 4.3vw, 1.42rem); font-weight: 600;
    line-height: 1.55; color: #fff;
    background: rgba(8, 16, 26, 0.5); border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 20px; padding: clamp(1.2rem, 4.2vw, 1.7rem) clamp(1.3rem, 5vw, 2rem);
    box-shadow: 0 20px 55px -22px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    position: relative; transition: opacity 0.35s ease, transform 0.35s ease; text-wrap: pretty;
  }
  .message::before {
    content: "😈"; position: absolute; top: -0.72em; inset-inline-start: 1.1em;
    font-size: 1.55em; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.4));
  }
  .message.fade { opacity: 0; transform: translateY(8px); }

  .actions { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.5em;
    font-family: inherit; font-size: clamp(0.85rem, 3.4vw, 1rem); font-weight: 700; color: #fff;
    background: rgba(8, 16, 26, 0.5); border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 999px; padding: 0.7em 1.3em; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0) scale(0.97); }
  .btn.share { background: rgba(37, 211, 102, 0.92); border-color: rgba(255, 255, 255, 0.25); color: #06331c; }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* חלון "מי אתה?" */
  .sheet {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    background: rgba(4, 10, 18, 0.66); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s ease;
  }
  .sheet.open { opacity: 1; visibility: visible; }
  .sheet-card {
    width: min(92vw, 26rem); background: rgba(12, 24, 38, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 24px;
    padding: clamp(1.4rem, 5vw, 2rem); text-align: center;
    box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.7);
  }
  .sheet-card h2 { font-size: 1.4rem; margin-bottom: 0.35em; }
  .sheet-card p { font-size: 0.9rem; color: rgba(255, 255, 255, 0.75); margin-bottom: 1.2em; }
  .name-grid { display: flex; flex-wrap: wrap; gap: 0.55rem; justify-content: center; }
  .name-btn {
    font-family: inherit; font-size: 0.98rem; font-weight: 700; color: #fff;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 14px; padding: 0.6em 1.05em; cursor: pointer; transition: background 0.15s ease, transform 0.1s ease;
  }
  .name-btn:hover { background: rgba(255, 255, 255, 0.16); }
  .name-btn:active { transform: scale(0.96); }
  .name-btn.guest { width: 100%; margin-top: 0.3rem; background: transparent; color: rgba(255,255,255,0.7); }
  .pin-input {
    width: 100%; font-family: inherit; font-size: 1.4rem; text-align: center; letter-spacing: 0.3em;
    color: #fff; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 14px; padding: 0.6em 0.8em; margin: 0.4rem 0 0.6rem;
  }
  .pin-input:focus { outline: 2px solid var(--accent); }
  .pin-error { color: #ff9e8e; font-size: 0.9rem; font-weight: 700; margin-bottom: 0.6rem; }
  .pin-actions { display: flex; gap: 0.5rem; justify-content: center; }
  .pin-ok { background: var(--accent); color: #06202a; }

  /* חברתי — מד התלהבות + קיר */
  .social { display: flex; flex-direction: column; gap: 1rem; width: min(92vw, 32rem); }
  .hype {
    display: flex; align-items: center; justify-content: center; gap: 0.6em;
    font-family: inherit; color: #fff; cursor: pointer;
    background: rgba(8, 16, 26, 0.5); border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 18px; padding: 0.9em 1.2em;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform 0.12s ease, background 0.2s ease;
  }
  .hype:active { transform: scale(0.97); }
  .hype:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .hype .hype-emoji { font-size: 1.7em; line-height: 1; transition: transform 0.15s ease; }
  .hype.pop .hype-emoji { transform: scale(1.35) rotate(-8deg); }
  .hype .hype-count { font-size: 1.7em; font-weight: 800; font-variant-numeric: tabular-nums; }
  .hype .hype-label { font-size: 0.85em; font-weight: 700; opacity: 0.85; }
  .wall {
    display: flex; flex-direction: column; gap: 0.7rem;
    background: rgba(8, 16, 26, 0.5); border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 18px; padding: 1rem 1.1rem;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .wall-head { font-size: 1.05rem; font-weight: 800; text-align: center; }
  .wall-input { display: flex; gap: 0.5rem; }
  .wall-input input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 0.95rem; color: #fff;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 12px; padding: 0.65em 0.9em; direction: rtl;
  }
  .wall-input input::placeholder { color: rgba(255, 255, 255, 0.5); }
  .wall-input input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .wall-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 38vh; overflow-y: auto; }
  .wall-item { text-align: right; background: rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 0.55em 0.8em; }
  .wall-item .who { font-weight: 700; color: var(--accent); font-size: 0.9rem; }
  .wall-item .when { font-weight: 500; color: rgba(255, 255, 255, 0.55); font-size: 0.72rem; }
  .wall-item .what { font-size: 0.98rem; line-height: 1.4; margin-top: 0.15em; word-break: break-word; }
  .wall-empty { text-align: center; opacity: 0.6; font-size: 0.9rem; padding: 0.5rem; }
  .wall-login { align-self: center; }
  .poke { align-self: center; }
  .poke-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
  .react-bar { display: flex; gap: 0.35rem; margin-top: 0.5rem; flex-wrap: wrap; align-items: center; }
  .react {
    font-family: inherit; font-size: 0.8rem; color: #fff; cursor: pointer;
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px; padding: 0.2em 0.6em; transition: transform 0.1s ease;
  }
  .react:active { transform: scale(0.92); }
  .react.on { background: rgba(255, 210, 63, 0.22); border-color: var(--accent); }
  .react span { font-variant-numeric: tabular-nums; }
  .reply-btn {
    font-family: inherit; font-size: 0.8rem; color: #fff; cursor: pointer;
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px; padding: 0.2em 0.7em; transition: transform 0.1s ease;
  }
  .reply-btn:active { transform: scale(0.92); }
  .replies {
    margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.45rem;
    border-inline-start: 2px solid rgba(255, 255, 255, 0.14); padding-inline-start: 0.7rem;
  }
  .reply-item { text-align: right; }
  .reply-item .who { font-weight: 700; color: var(--accent); font-size: 0.82rem; }
  .reply-item .when { font-size: 0.68rem; opacity: 0.55; }
  .reply-item .rbody { font-size: 0.9rem; line-height: 1.4; word-break: break-word; margin-top: 0.1em; }
  .reply-form { display: flex; gap: 0.4rem; margin-top: 0.55rem; }
  .reply-form .reply-input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 0.9rem; color: #fff;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px; padding: 0.5em 0.7em; direction: rtl;
  }
  .reply-form .reply-input::placeholder { color: rgba(255, 255, 255, 0.5); }
  .reply-form .reply-send { padding: 0.5em 1em; font-size: 0.85rem; }
  .edit-save, .edit-cancel { padding: 0.5em 0.9em; font-size: 0.85rem; }
  .edit-cancel { background: rgba(255, 255, 255, 0.12); }
  .mini {
    background: transparent; border: none; cursor: pointer; font-size: 0.9rem;
    line-height: 1; padding: 0 0.15em; opacity: 0.7; transition: transform 0.1s ease;
  }
  .mini:active { transform: scale(0.9); }
  .reply-item .mini { font-size: 0.8rem; }
  .count-lbl { font-size: 0.75rem; opacity: 0.7; align-self: center; margin-inline-start: auto; }

  /* מקטע יומי — צ'ק-אין, סקר, לוח מובילים */
  .daily { display: flex; flex-direction: column; gap: 1rem; width: min(92vw, 32rem); }
  .checkin-row, .poll, .leaderboard {
    background: rgba(8, 16, 26, 0.5); border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 18px; padding: 1rem 1.1rem;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .checkin-head, .lb-head { font-size: 1rem; font-weight: 800; text-align: center; margin-bottom: 0.6rem; }
  .checkin-names { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; }
  .chip-name {
    font-size: 0.85rem; font-weight: 700; background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 999px; padding: 0.3em 0.8em;
  }
  .checkin-empty { opacity: 0.6; font-size: 0.88rem; }
  .streak { text-align: center; margin-top: 0.6rem; font-weight: 800; color: var(--accent); }
  .poll-q { font-size: 1.05rem; font-weight: 800; text-align: center; margin-bottom: 0.75rem; text-wrap: balance; }
  .poll-opts { display: flex; flex-direction: column; gap: 0.5rem; }
  .poll-opt {
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between;
    font-family: inherit; font-size: 0.95rem; font-weight: 700; color: #fff; cursor: pointer;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 12px; padding: 0.65em 0.9em; text-align: right;
  }
  .poll-opt .fillbar {
    position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 0%;
    background: rgba(255, 210, 63, 0.22); z-index: 0; transition: width 0.5s cubic-bezier(0.16,1,0.3,1);
  }
  .poll-opt.mine { border-color: var(--accent); }
  .poll-opt .lbl, .poll-opt .pct { position: relative; z-index: 1; }
  .poll-opt .pct { opacity: 0.85; font-variant-numeric: tabular-nums; }
  .poll-hint { text-align: center; font-size: 0.8rem; opacity: 0.7; margin-top: 0.6rem; }
  .lb-list { display: flex; flex-direction: column; gap: 0.35rem; }
  .lb-item { display: flex; align-items: center; padding: 0.35em 0.55em; border-radius: 10px; }
  .lb-item.me { background: rgba(255, 255, 255, 0.08); }
  .lb-rank { font-weight: 800; color: var(--accent); min-width: 1.6em; }
  .lb-name { flex: 1; text-align: right; font-weight: 700; }
  .lb-pts { font-variant-numeric: tabular-nums; opacity: 0.85; font-weight: 700; }

  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes sail { from { transform: translateX(0); } to { transform: translateX(calc(-100vw - 160px)); } }
  @keyframes sway { 0%, 100% { rotate: -3deg; } 50% { rotate: 3deg; } }

  @media (prefers-reduced-motion: reduce) {
    .orb, .wave, .ship { animation: none !important; }
    .ship { display: none; }

<script>
  "use strict";

  var TARGET = new Date(2026, 9, 1, 0, 0, 0);           // 1 באוקטובר 2026, חצות מקומי
  var START = new Date(2026, 6, 24, 0, 0, 0);           // תחילת הספירה (24 ביולי)

  var CAST = ["טל", "רוית", "ערן", "אלכס", "ירון", "אלון", "ליאל", "רפאלה", "איריס"];
  var AVATARS = {
    "טל": "📋", "רוית": "👑", "ערן": "🃏", "אלכס": "📏", "ירון": "💦",
    "אלון": "⏰", "ליאל": "😈", "רפאלה": "🧘", "איריס": "✨"
  };
  function avatarFor(name) { return AVATARS[name] || "🚢"; }

  // ---- צליל: צפירת ספינה (Web Audio, נעול עד אינטראקציה ראשונה) ----
  var audioCtx = null;
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {}
  }
  function shipHorn() {
    if (!audioCtx) return;
    try {
      var t = audioCtx.currentTime;
      var g = audioCtx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.12);
      g.gain.setValueAtTime(0.16, t + 0.8);
      g.gain.linearRampToValueAtTime(0.0001, t + 1.25);
      g.connect(audioCtx.destination);
      [98, 147].forEach(function (f) {
        var o = audioCtx.createOscillator();
        o.type = "sawtooth"; o.frequency.value = f;
        o.connect(g); o.start(t); o.stop(t + 1.3);
      });
    } catch (e) {}
  }
  window.addEventListener("pointerdown", unlockAudio);

  // ---- בדיחת היום לפי מספר הימים המלאים שנותרו ----
  var MESSAGES = {
    75: "75 יום. טל בנה לו״ז לחופשה. גם ללו״ז יש לו״ז. רוית תמחק את שניהם בשנייה וחצי.",
    74: "74 יום. רוית לא הרימה קול — רק גבה. טל כבר התנצל על שלושה דברים שעוד לא עשה.",
    73: "73 יום. ערן אמר 'סיבוב אחרון'. זה היה אתמול בערב. הוא עדיין יושב ליד השולחן.",
    72: "72 יום. אלכס ישן בקבינה באלכסון, כי הוא ארוך מהמיטה. וגם מהדלת. וגם מהסבלנות.",
    71: "71 יום. ירון נכנס לג'קוזי ראשון. תוך דקה הצטרפו עוד ארבעה גברים. עד הערב זו הייתה מסיבה.",
    70: "70 יום. אלון ניגש לכוסית ליד הבריכה: 'excuse me, where is the swimming pool?' ונעלם ליומיים.",
    69: "69 יום 😏. אין צורך להסביר. ליאל מחייך, וטל וערן כבר מחפשים את הכפתור לנעילת הדלת.",
    68: "68 יום. אלכס שוב הושיט יד לכיוון הראש של רוית. עכשיו הוא מתאמן לשחות, ליתר ביטחון.",
    67: "67 יום. איריס, אשתו של ערן, מתאמנת לזהות אותו בקרוז. הבעיה: כולם שם לבנים וקרחים.",
    66: "66 יום. רוית ארזה ערכת ניקוי כתמים שלמה. לא לילדים — לטל. הוא מלכלך בגדים בכל ארוחה.",
    65: "65 יום. ערן מכניס למזוודה בגד ים אחד וחפיסת קלפים אחת. נחשו במה ישתמש יותר.",
    64: "64 יום. כלל הקרוז: לא נוגעים לרוית בראש. כלל הכסף: אם נגעת, כדאי שכבר תדע לשחות.",
    63: "63 יום. רפאלה לא סופרת ימים לחופשה. היא סופרת כמה פעמים ביום היא לא חנקה את ליאל.",
    62: "62 יום. ליאל ארז שמן ו'תוכניות'. טל וערן ארזו מנעול לדלת. שני הצדדים כבר נערכים.",
    61: "61 יום. אלון מגיע לקזינו ומחפש נשים יותר משהוא מחפש קלפים. גם בזה הוא מפסיד.",
    60: "60 יום. שאלנו את ירון עם כמה בחורים הוא היה בג'קוזי. 'תפסיקו לספור'. ספרנו שבעה.",
    59: "59 יום. טל שאל את רוית איזה בגד לקחת. רוית ארזה לו הכול. הוא הודה. ככה זה עובד.",
    58: "58 יום. ערן לא בולף — הפרצוף שלו בולף בשבילו. וגם הפרצוף מפסיד בסוף.",
    57: "57 יום. איריס תכננה חופשה רומנטית. ערן תכנן טורניר פוקר. נחשו מי מנצח.",
    56: "56 יום. אלכס גבוה כל כך שבבופה הוא רואה את כל הצלחות. את הראש של רוית הוא כבר לא מעז.",
    55: "55 יום. החדר של ירון ואלון: ירון כבר ישן וחלם, אלון עדיין מחפש באיזו קומה החדר.",
    54: "54 יום. רוית זוכרת מי נגע לה בראש ב-2019. אלכס — היא לא שכחה. היא רק חיכתה לים.",
    53: "53 יום. ליאל הבטיח 'השנה לא אגע'. בדיוק אותה הבטחה כמו של אלון עם הזמנים.",
    52: "52 יום. אמרנו לאלון שהספינה יוצאת שעתיים לפני הזמן האמיתי. הוא עדיין יאחר, ויתפלא.",
    51: "51 יום. טל התחרה עם הבני 5 של הספינה מי מלכלך יותר בארוחת הערב. טל ניצח בגדול.",
    50: "חצי הדרך! 50 יום. ליאל כבר מתאמן. טל וערן כבר ישנים עם חולצה. הם יודעים בדיוק למה.",
    49: "49 יום. ירון הבטיח 'רק אטבול רגליים בג'קוזי'. יצא משם עם שלושה מספרי טלפון.",
    48: "48 יום. אם ליאל יחזור מהקרוז שלם — זה הישג של רפאלה, לא מזל, ולא צירוף מקרים.",
    47: "47 יום. ערן הפסיד בפוקר וניסה לשלם בהבטחות. גם ההבטחות היו בלוף, כמו תמיד.",
    46: "46 יום. אלכס גבוה כל כך שהוא מברך את העננים. מספיק שיושיט יד — ורוית כבר מזהירה.",
    45: "45 יום. רוית לא מנהלת את החבורה. היא רק מחליטה מי חושב לרגע שהוא מנהל.",
    44: "44 יום. אלון קבע פגישה ל-9:00. הגיע ב-11:00. אמר בביטחון מלא 'בעצם הקדמתי'.",
    43: "43 יום. טל: 'שמרתי לכולם מקומות זה ליד זה'. רוית: 'ביטלתי. אני ליד החלון, לבד'.",
    42: "42 — התשובה לכל שאלה ביקום. כולל 'כמה זמן ליאל יחזיק ידיים לעצמו'. התשובה: פחות.",
    41: "41 יום. הג'קוזי בקרוז מזהיר: כשירון בפנים, מגבת אחת לא מספיקה לכל האורחים.",
    40: "40 יום. אלון מחפש אהבה בקרוז כמו שהוא מחפש חניה — הרבה סיבובים, אפס תוצאה.",
    39: "39 יום. טל וערן קנו חולצות שינה עבות במיוחד. ליאל קנה סבלנות. נחשו מי יוותר ראשון.",
    38: "38 יום. ערן הימר שיגיע ראשון לבופה. את ההימור הזה הוא מנצח אפילו כשהוא ישן.",
    37: "37 יום. אלכס כמעט נגע לרוית בראש מתוך הרגל. עכשיו הוא ישן עם הידיים בכיסים.",
    36: "36 יום. טל אכל, וחצי מהצלחת נחתה על החולצה. רוית כבר מכינה בראש את הכתם הבא.",
    35: "35 יום. רפאלה מתאמנת בנשימות עמוקות. לא בגלל הים — בגלל שלוש שעות רכב עם ליאל.",
    34: "34 יום. איריס תבלה חצי מהקרוז בחיפוש אחרי ערן, וחצי בגרירתו מהקזינו.",
    33: "33 יום. ירון מארגן 'מסיבת בריכה קטנה'. הגיעו רק גברים. הבריכה התחממה מעצמה.",
    32: "32 יום. ערן קורא לפוקר 'תחביב'. הבנק שלו קורא לזה 'הכנסה עונתית קבועה'.",
    31: "31 יום. טל שלח לו״ז גרסה 14. רוית תשנה הכול בגרסה 15. הוא יודע, והוא אפילו נהנה.",
    30: "חודש! 30 יום. אלון בטוח שיש עוד המון זמן. יארוז בבוקר הטיסה, בזמן שהמונית מצפצפת.",
    29: "29 יום. ליאל קנה שמן תינוקות. אין תינוקות בקרוז. טל, אתה מבין בדיוק את הרמז.",
    28: "28 יום. רוית עשתה תספורת. מסתכלים, מעריכים, לא נוגעים. אלכס — כתבנו את זה בשבילך.",
    27: "27 יום. ערן 'לא מכור לפוקר'. אתמול שיחק שש שעות בלי לקום, בלי לאכול, בלי בושה.",
    26: "26 יום. אלכס קנה כובע. עכשיו הוא גבוה מהמעלית — אז ימשיך לעלות במדרגות, כרגיל.",
    25: "25 יום. איריס מזהה את ערן מרחוק לפי הצחוק. אחרת, בין כל הקרחים הלבנים — אין סיכוי.",
    24: "24 יום. תפסנו את ירון בג'קוזי עם עוד כמה בחורים. הפסקנו לספור אחרי חמישה.",
    23: "23 יום. טל התחיל ספירה לאחור משלו. הוא לא יודע שאנחנו עם הדף הזה כבר שבועות.",
    22: "22 יום. רפאלה חתמה על הסכם עם עצמה: אם ליאל שורד את הקרוז — היא רשמית קדושה.",
    21: "21 — בלאק ג'ק. ערן כבר מלטש קלפים ומחייך, כאילו הוא כבר יודע מי משלם על הקוקטיילים.",
    20: "20 יום. אלון חשב שהכוסית ליד הבריכה בת 20. היא בת 30 ומתעלמת ממנו. אלון, תתקדם.",
    19: "19 יום. טל וערן קבעו שמירות לילה על החזה. ליאל קבע שמירות לילה על טל וערן.",
    18: "ח״י — 18! לחיים. אלון עדיין לא חי — הוא עדיין מחפש איפה שם את הדרכון.",
    17: "17 יום. אלכס נגע במשהו עגול וחלק. זה לא היה כדור. רוית עדיין רודפת אחריו בסיפון.",
    16: "16 יום. ערן סימן את כולם כטרף לפוקר. מה שהוא לא יודע: ליאל סימן אותו למשהו אחר.",
    15: "15 יום. טל החליף חולצה שלוש פעמים בארוחה אחת. רוית ארזה לו חמש רזרביות. לא יספיק.",
    14: "שבועיים! ערן פותח טורניר פוקר בקרוז. הפרס: יום שלם שבו ליאל שומר ידיים לעצמו.",
    13: "13 יום. אלון עדיין לא בטוח באיזה נמל עולים, אבל כבר בטוח באיזו כוסית הוא מאוהב.",
    12: "12 יום. רפאלה מאמנת אצבעות ללחוץ על הסלוטים בקזינו. רוית? מאמנת אצבעות ללחוץ על הציצי של רפאלה. לכל אחת ההימור שלה.",
    11: "11 יום. ירון שריין את הג'קוזי לכל ערב. הקפטן כבר שוקל למכור כרטיסים.",
    10: "10 ימים! אלכס מתכופף בכל כניסה בקרוז. רוית סופרת כל תנועה של היד שלו לכיוון ראשה.",
    9: "9 ימים. ליאל תרגל, טל בכה, ערן צחק — ואז ערן הבין שגם הוא ברשימה, וגם הוא בכה.",
    8: "8 ימים. סימן האינסוף נשכב לנוח — בדיוק כמו אלון בכל בוקר שבו הוא אמור לצאת.",
    7: "7 ימים, שבוע! רוית מזהירה מראש: יד על הראש שלה בקרוז = שחייה יפה חזרה לנמל.",
    6: "6 ימים. אלון קבע להתעורר ב-6, יתעורר ב-9, יגיע לרציף ב-11. הספינה יוצאת ב-10.",

  function sizeConfetti() {

    for (var i = 0; i < N; i++) {
      confs.push({
        x: Math.random() * W, y: -Math.random() * confettiCanvas.height * 0.3,
        vx: (Math.random() - 0.5) * 3 * cdpr, vy: (Math.random() * 3 + 2) * cdpr,

  function confFrame(t) {
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

      var c = confs[i];
      c.x += c.vx; c.y += c.vy; c.vy += 0.05 * cdpr; c.rot += c.vr;

      cctx.restore();

    }

  var POLLS = [
    { q: "מי יאחר הכי הרבה לטיסה?", opts: ["אלון", "טל", "ערן", "מישהו מפתיע"] },
    { q: "מי יירדם ראשון על הסיפון?", opts: ["אלון", "טל", "רפאלה", "ליאל"] },
    { q: "מי ינצח בפוקר בערב הראשון?", opts: ["ערן", "אלכס", "ירון", "הבית תמיד מנצח"] },
    { q: "מי יאבד משהו בקרוז?", opts: ["אלון", "ליאל", "ערן", "אלכס"] },
    { q: "מי ייגע לרוית בראש (שוב)?", opts: ["אלכס", "ליאל", "ילד אקראי", "אף אחד — רוצים לחיות"] },
    { q: "מי יישרף הכי גרוע בשמש?", opts: ["ליאל", "טל", "ערן", "ירון"] },
    { q: "מי יביא הכי הרבה מזוודות?", opts: ["רוית", "טל", "איריס", "רפאלה"] },
    { q: "כמה פעמים טל יבדוק את הלו״ז ביום הראשון?", opts: ["פחות מ-5", "5–10", "10–20", "אינסוף"] },
    { q: "מי יחזור עם הכי הרבה סיפורים?", opts: ["ירון", "ערן", "ליאל", "אלון"] },
    { q: "מי יבכה ראשון מהתרגשות?", opts: ["טל", "רפאלה", "ליאל", "אלכס"] },
    { q: "מי יבלה הכי הרבה זמן בג'קוזי?", opts: ["ירון", "אלון", "ליאל", "כולם ביחד"] },
    { q: "כמה זמן ייקח לאיריס למצוא את ערן בקרוז?", opts: ["חצי שעה", "יום", "כל הקרוז", "רק בקזינו"] },
    { q: "על מה אלון יבזבז יותר זמן?", opts: ["רדיפה אחרי כוסיות", "לחפש את הבריכה", "לאחר", "הכול ביחד"] },
    { q: "כמה חולצות טל יכתים בארוחת ערב אחת?", opts: ["אחת", "שתיים", "שלוש+", "כל מה שרוית ארזה"] }
  ];
  function currentPoll() {
    var d = utcToday();
    var idx = parseInt(d.replace(/-/g, ""), 10) % POLLS.length;
    return { id: d, def: POLLS[idx] };
  }

  function doCheckin() {
    var name = myName(), pin = myPin();
    if (!name || !pin) return;
    api("rpc/do_checkin", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ p_name: name, p_pin: pin })
    }).then(function () { loadCheckins(); loadLeaderboard(); }).catch(function () {});
  }
  function loadCheckins() {
    if (!checkinNames) return;
    api("checkins?select=name&day=eq." + utcToday()).then(function (r) { return r.json(); })
      .then(function (rows) {
        if (!Array.isArray(rows)) return;
        if (rows.length === 0) { checkinNames.innerHTML = "<span class='checkin-empty'>אף אחד עדיין לא התחבר היום… היו הראשונים</span>"; }
        else {
          checkinNames.innerHTML = rows.map(function (x) {
            return "<span class='chip-name'>" + avatarFor(x.name) + " " + esc(x.name) + "</span>";
          }).join("");
        }
      }).catch(function () {});
    var me = myName();
    if (me) {
      api("checkins?select=day&name=eq." + encodeURIComponent(me) + "&order=day.desc&limit=90")
        .then(function (r) { return r.json(); }).then(function (rows) {
          if (!Array.isArray(rows) || rows.length === 0) { streakEl.hidden = true; return; }
          var days = rows.map(function (x) { return x.day; });
          var set = {}; days.forEach(function (d) { set[d] = true; });
          var streak = 0;
          var cur = new Date(utcToday() + "T00:00:00Z");
          // אם לא נכנס היום, נתחיל מאתמול כדי לא לאפס סתם
          if (!set[cur.toISOString().slice(0, 10)]) cur.setUTCDate(cur.getUTCDate() - 1);
          while (set[cur.toISOString().slice(0, 10)]) { streak++; cur.setUTCDate(cur.getUTCDate() - 1); }
          if (streak >= 2) { streakEl.hidden = false; streakEl.textContent = "🔥 רצף שלך: " + streak + " ימים ברצף"; }
          else { streakEl.hidden = true; }
        }).catch(function () {});
    } else { streakEl.hidden = true; }
  }

  function renderPoll() {
    if (!pollQ) return;
    var p = currentPoll();
    pollQ.textContent = "🗳️ " + p.def.q;
    api("votes?select=name,choice&poll=eq." + encodeURIComponent(p.id)).then(function (r) { return r.json(); })
      .then(function (rows) {
        rows = Array.isArray(rows) ? rows : [];
        var total = rows.length, tally = {}, me = myName(), myChoice = null;
        rows.forEach(function (v) {
          tally[v.choice] = (tally[v.choice] || 0) + 1;
          if (me && v.name === me) myChoice = v.choice;
        });
        pollOpts.innerHTML = p.def.opts.map(function (opt) {
          var c = tally[opt] || 0;
          var pct = total ? Math.round(c / total * 100) : 0;
          var mine = myChoice === opt;
          return "<button class='poll-opt" + (mine ? " mine" : "") + "' data-choice='" + esc(opt) + "'>" +
            "<span class='fillbar' style='width:" + pct + "%'></span>" +
            "<span class='lbl'>" + (mine ? "✓ " : "") + esc(opt) + "</span>" +
            "<span class='pct'>" + (total ? pct + "%" : "") + "</span></button>";
        }).join("");
        pollHint.textContent = myChoice ? ("הצבעת: " + myChoice + " · אפשר לשנות") :
          (total ? total + " הצביעו · מה דעתך?" : "היו הראשונים להצביע");
      }).catch(function () {});
  }
  function vote(choice) {
    if (!ensureAuth()) return;
    var name = myName(), pin = myPin();
    var p = currentPoll();
    api("rpc/cast_vote", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ p_name: name, p_pin: pin, p_poll: p.id, p_choice: choice })
    }).then(function () { renderPoll(); loadLeaderboard(); }).catch(function () {});
  }

  function loadLeaderboard() {
    if (!lbList) return;
    api("rpc/leaderboard", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        if (!Array.isArray(rows)) return;
        var me = myName();
        var top = rows.filter(function (x) { return x.points > 0; });
        if (top.length === 0) { lbList.innerHTML = "<div class='checkin-empty' style='text-align:center'>עדיין אין נקודות — כל כניסה, הצבעה והודעה שוות נקודות 🌟</div>"; return; }
        lbList.innerHTML = top.slice(0, 10).map(function (x, i) {
          var medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1) + ".";
          return "<div class='lb-item" + (me && x.name === me ? " me" : "") + "'>" +
            "<span class='lb-rank'>" + medal + "</span>" +
            "<span class='lb-name'>" + avatarFor(x.name) + " " + esc(x.name) + "</span>" +
            "<span class='lb-pts'>" + x.points + "</span></div>";
        }).join("");
      }).catch(function () {});
  }

  function startDaily() {
    document.getElementById("daily").hidden = false;
    pollOpts.addEventListener("click", function (e) {
      var b = e.target.closest(".poll-opt"); if (b) vote(b.getAttribute("data-choice"));
    });
    buildPokeGrid();
    if (pokeBtn) pokeBtn.addEventListener("click", function () { pokeGrid.hidden = !pokeGrid.hidden; });
    doCheckin();
    loadCheckins(); renderPoll(); loadLeaderboard();
    window.setInterval(function () { loadCheckins(); renderPoll(); loadLeaderboard(); }, 12000);
  }

  if (hypeBtn) {
    document.getElementById("social").hidden = false;
    hypeBtn.addEventListener("click", tapHype);
    if (wallLoginBtn) wallLoginBtn.addEventListener("click", openSheet);
    wallSend.addEventListener("click", sendWall);
    wallText.addEventListener("keydown", function (e) { if (e.key === "Enter") sendWall(); });
    wallList.addEventListener("click", function (e) {
      var me2 = e.target.closest(".msg-edit");
      if (me2) { var wi = me2.closest(".wall-item"); var wb = wi ? wi.querySelector(".what") : null; openEditForm(me2.getAttribute("data-id"), "wall", wi, wb ? wb.textContent : ""); return; }
      var md = e.target.closest(".msg-del");
      if (md) { deleteItem(md.getAttribute("data-id"), "wall"); return; }
      var re2 = e.target.closest(".rep-edit");
      if (re2) { var ri = re2.closest(".reply-item"); var rbo = ri ? ri.querySelector(".rbody") : null; openEditForm(re2.getAttribute("data-id"), "reply", ri, rbo ? rbo.textContent : ""); return; }
      var rd = e.target.closest(".rep-del");
      if (rd) { deleteItem(rd.getAttribute("data-id"), "reply"); return; }
      var es = e.target.closest(".edit-save");
      if (es) { submitEdit(); return; }
      var ec = e.target.closest(".edit-cancel");
      if (ec) { closeReplyForm(); loadWall(); return; }
      var snd = e.target.closest(".reply-send");
      if (snd) {
        var form = snd.closest(".reply-form");
        if (form) { var inp = form.querySelector(".reply-input"); submitReply(form.getAttribute("data-msg"), inp ? inp.value : ""); }
        return;
      }
      var rep = e.target.closest(".reply-btn");
      if (rep) { openReplyForm(rep.getAttribute("data-msg"), rep); return; }
      var rb = e.target.closest(".react");
      if (rb) { toggleReaction(rb.getAttribute("data-msg"), rb.getAttribute("data-emoji")); return; }
    });
    try { notifSeen = localStorage.getItem("cruiseNotifSeen"); } catch (e) {}
    if (!notifSeen) { try { notifSeen = new Date().toISOString(); localStorage.setItem("cruiseNotifSeen", notifSeen); } catch (e) {} }
    if (bell) {
      bell.addEventListener("click", function (e) {
        e.stopPropagation();
        if (notifPanel.hidden) { renderNotifPanel(); notifPanel.hidden = false; markNotifSeen(); }
        else { notifPanel.hidden = true; }
      });
      notifPanel.addEventListener("click", function () { notifPanel.hidden = true; scrollToWall(); });
      document.addEventListener("click", function (e) {
        if (!notifPanel.hidden && !notifPanel.contains(e.target) && e.target !== bell && !bell.contains(e.target)) notifPanel.hidden = true;
      });
    }
    updateWallLock();
    loadHype(); loadWall();
    window.setInterval(function () { loadHype(); if (!wallBusy()) loadWall(); }, 6000);
    startDaily();
  }

  // ---- הפעלה ----
  applyPhase();
  renderGreeting();
  if (!myName()) { try { if (!localStorage.getItem("cruiseAsked")) { localStorage.setItem("cruiseAsked", "1"); openSheet(); } } catch (e) {} }
  tick();
  updateProgress();
  window.setInterval(tick, 1000);
  window.setInterval(applyPhase, 60000);
  window.setInterval(updateProgress, 60000);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function () {});
    });
  }
</script>
</body>
</html>
