<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>אנגלית עם טוקי</title>
<meta name="description" content="לומדים אנגלית בכיף — משחק יומי לילדים דוברי עברית מגיל 5. מילים, האזנה, דיבור וסיפורים.">
<meta name="theme-color" content="#58cc02">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="טוקי">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ===== פתיחה והרשמה ===== -->
<div id="sc-onboard" class="screen"></div>

<!-- ===== מסך ראשי: סרגל עליון + תוכן לשונית + ניווט תחתון ===== -->
<div id="sc-main" class="screen">
  <div class="topbar">
    <div class="topbar-in" id="topbar"></div>
  </div>
  <div id="tab-body" class="wrap page-pad"></div>
  <nav class="nav"><div class="nav-in" id="nav"></div></nav>
</div>

<!-- ===== שיעור ===== -->
<div id="sc-lesson" class="screen">
  <div class="lesson-top">
    <div class="lesson-top-in">
      <button class="x-btn" id="l-quit" aria-label="יציאה">✕</button>
      <div class="pbar"><div class="pbar-fill" id="l-bar"></div></div>
      <div class="hearts-live" id="l-hearts"></div>
    </div>
  </div>
  <div class="lesson-body" id="l-body"></div>
  <div class="foot" id="l-foot"><div class="foot-in" id="l-foot-in"></div></div>
</div>

<!-- ===== מסכי סיום / חגיגה ===== -->
<div id="sc-done" class="screen"></div>

<!-- ===== שכבות ===== -->
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="confetti hidden" id="confetti"></div>

<script src="mascot.js"></script>
<script src="audio.js"></script>
<script src="state.js"></script>
<script src="curriculum.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
